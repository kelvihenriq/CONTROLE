function AutomacaoMapaTab({ productionRows = [], mapLabel = '' }) {
  const { t } = useLang();
  const [frameUrl, setFrameUrl] = useState(null);
  const [frameError, setFrameError] = useState('');
  const iframeRef = React.useRef(null);
  const frameReadyRef = React.useRef(false);

  useEffect(() => {
    let objUrl = null;
    try {
      const binary = atob(AUTOMACAO_HTML_B64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'text/html;charset=utf-8' });
      objUrl = URL.createObjectURL(blob);
      setFrameUrl(objUrl);
    } catch (e) {
      console.error('Erro ao preparar a Automação (mapa):', e);
      setFrameError('Não foi possível carregar a ferramenta de automação. Recarregue a página.');
    }
    return () => { if (objUrl) URL.revokeObjectURL(objUrl); };
  }, []);

  // Monta os dados no mesmo formato que a ferramenta de Automação espera (mesma estrutura
  // de item.codes já usada na aba Produção — os mesmos valores que aparecem certos em ASBUILT GERADO).
  const buildPanelRows = () => productionRows.map(item => ({
    date: item.date || '',
    name: (item.location || '').trim(),
    splice: item.splice || 0,
    type2: item.typeEnd || '',
    codes: item.codes || {}
  }));

  const sendProductionToFrame = () => {
    if (!iframeRef.current || !iframeRef.current.contentWindow) return;
    iframeRef.current.contentWindow.postMessage(
      { type: 'CONTROL_PRO_PRODUCTION_DATA', rows: buildPanelRows() },
      '*'
    );
  };

  // Reenvia sempre que a produção mudar (ex: usuário editou/adicionou algo na aba Produção)
  // enquanto a aba Automação está aberta, desde que o iframe já tenha avisado que está pronto.
  useEffect(() => {
    if (frameReadyRef.current) sendProductionToFrame();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [productionRows]);

  useEffect(() => {
    const onMessage = (ev) => {
      if (ev.data && ev.data.type === 'CONTROL_PRO_AUTOMACAO_READY') {
        frameReadyRef.current = true;
        sendProductionToFrame();
      }
    };
    window.addEventListener('message', onMessage);
    return () => window.removeEventListener('message', onMessage);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [frameUrl]);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{ fontSize: 10.5, color: C.textDim, lineHeight: 1.5 }}>
        {t('Sobe o')} <strong style={{ color: C.text }}>Splice Report</strong> {t('e o')} <strong style={{ color: C.text }}>{t('PDF do As-Built')}</strong> — {t('a lista de')} <strong style={{ color: C.text }}>{t('Produção')}</strong>{mapLabel ? ` (${t('mapa')} ${mapLabel})` : ''} {t('já vem direto da aba Produção deste painel (botão "Usar Produção do Painel" dentro da ferramenta), sem precisar exportar/subir planilha à parte.')}
        {' '}{t('Ela acha a posição certa de cada tag sozinha e grava as caixinhas como anotações reais (editáveis) no PDF, já com conciliação em Excel.')}
      </div>
      {frameError && (
        <div style={{ background: "rgba(255,82,82,0.1)", border: `1px solid ${C.red}`, color: C.red, padding: 10, borderRadius: 6, fontSize: 11 }}>
          {frameError}
        </div>
      )}
      <div style={{ width: '100%', height: 'calc(100vh - 190px)', minHeight: 600, background: '#fff', borderRadius: 8, overflow: 'hidden', border: `1px solid ${C.border2}` }}>
        {frameUrl ? (
          <iframe
            ref={iframeRef}
            src={frameUrl}
            title="Automação de Callouts (Mapa)"
            onLoad={() => { frameReadyRef.current = true; sendProductionToFrame(); }}
            style={{ width: '100%', height: '100%', border: 'none' }}
          />
        ) : (
          <div style={{ padding: 20, color: C.textDim, fontSize: 11 }}>{t('Carregando ferramenta de automação...')}</div>
        )}
      </div>
    </div>
  );
}

// Migração do sistema antigo (Semana Atual/Anterior) para o novo (Semana 1-4) + migração para
// histórico de datas (CICLO) + recuperação de crédito de atualizações antigas de Workbook/
// Invoice/AS-BUILT que ficaram sem técnico no histórico (de antes da trava de nome obrigatório
// existir) — usa o nome já salvo no campo do item como melhor palpite. Roda tanto nos dados
// carregados do navegador quanto nos que chegam da nuvem, pra nenhum dos dois ficar pra trás.
function migrateProjectsList(data) {
  if (!Array.isArray(data)) return [];
  return data.map((p) => {
    let migrated = { ...p };
    if (migrated.cycle === 'CURRENT_WEEK') migrated.cycle = 'SEMANA_1';
    if (migrated.cycle === 'PREVIOUS_WEEK') migrated.cycle = 'SEMANA_2';
    if (!Array.isArray(migrated.asbuiltHistory)) migrated.asbuiltHistory = migrated.asbuiltDate ? [migrated.asbuiltDate] : [];
    if (!Array.isArray(migrated.workbookHistory)) migrated.workbookHistory = migrated.workbookDate ? [migrated.workbookDate] : [];
    if (!Array.isArray(migrated.invoiceHistory)) migrated.invoiceHistory = migrated.invoiceDate ? [migrated.invoiceDate] : [];
    const backfillTech = (hist, fallbackTech) => (Array.isArray(hist) ? hist : []).map((entry) => {
      const date = historyEntryDate(entry);
      const tech = historyEntryTech(entry);
      return { date, tech: tech || (fallbackTech || '').trim() };
    });
    migrated.asbuiltHistory = backfillTech(migrated.asbuiltHistory, migrated.asbuiltTech);
    migrated.workbookHistory = backfillTech(migrated.workbookHistory, migrated.workbookTech);
    migrated.invoiceHistory = backfillTech(migrated.invoiceHistory, migrated.invoiceTech);
    return migrated;
  });
}

function ProductionDashboard() {
  // ===== IDIOMA DO SITE (PT/EN) — botão no header, salvo no navegador =====
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem(STORAGE_KEY_LANG) || 'pt'; } catch (e) { return 'pt'; }
  });
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY_LANG, lang); } catch (e) {}
  }, [lang]);
  const t = (s) => translate(lang, s);
  useEffect(() => {
    try {
      document.title = t('CONTROL PRO — Gestão Semanal por Ciclos & Desempenho');
      document.documentElement.lang = lang === 'en' ? 'en' : 'pt-BR';
    } catch (e) {}
  }, [lang]);

  // Carrega do localStorage se existir, senão usa o inicial
  const [projects, setProjects] = useState(() => {
    const saved = localStorage.getItem(STORAGE_KEY);
    let data = INITIAL_DEFAULT_DATA;
    if (saved) {
      try {
        data = JSON.parse(saved);
      } catch (e) {
        console.error("Erro ao carregar dados locais", e);
      }
    }
    return migrateProjectsList(data);
  });

  // ===== HISTÓRICO DE ATUALIZAÇÕES (CICLO) — adiciona a data de hoje na etapa escolhida, junto com quem atualizou =====
  const addHistoryToday = (itemId, stage) => {
    const today = new Date().toISOString().slice(0, 10);
    const historyKey = `${stage}History`; // 'asbuiltHistory' | 'workbookHistory' | 'invoiceHistory'
    const dateKey = `${stage}Date`;
    const techKey = `${stage}Tech`;
    setProjects((prev) => prev.map((p) => {
      if (p.id !== itemId) return p;
      const currentHistory = Array.isArray(p[historyKey]) ? p[historyKey] : [];
      if (historyHasDate(currentHistory, today)) return p; // já registrado hoje, não duplica
      const entry = { date: today, tech: (p[techKey] || '').trim() };
      return { ...p, [historyKey]: [...currentHistory, entry], [dateKey]: today };
    }));
  };

  // Semana atualmente "aberta" para lançamentos (as outras ficam "fechadas"/histórico)
  const [openWeek, setOpenWeek] = useState(() => {
    const saved = localStorage.getItem(STORAGE_KEY_OPEN_WEEK);
    return saved && WEEK_OPTIONS.some((w) => w.id === saved) ? saved : 'SEMANA_1';
  });
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY_OPEN_WEEK, openWeek); } catch (e) { console.error('Erro ao salvar semana aberta', e); }
  }, [openWeek]);
  useCloudSync('open_week', [openWeek], () => openWeek, (v) => setOpenWeek(v));

  // Intervalo de datas (De/Até) cadastrado pra cada Semana (1-4) — ex: Semana 1 = 01/08 a 07/08.
  // Puramente informativo/organizacional: não filtra os itens automaticamente, só aparece junto
  // do rótulo da semana em todo lugar do sistema, pra facilitar saber qual data corresponde a
  // qual semana. { SEMANA_1: { from: "2026-08-01", to: "2026-08-07" }, ... }
  const [weekDateRanges, setWeekDateRanges] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_WEEK_RANGES) || 'null');
      if (saved) return saved;
    } catch (e) {}
    return {};
  });
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY_WEEK_RANGES, JSON.stringify(weekDateRanges)); } catch (e) { console.error('Erro ao salvar datas das semanas', e); }
  }, [weekDateRanges]);
  useCloudSync('week_date_ranges', [weekDateRanges], () => weekDateRanges, (v) => setWeekDateRanges(v));
  const [showWeekDatesModal, setShowWeekDatesModal] = useState(false);
  const setWeekDateRange = (weekId, field, value) => {
    setWeekDateRanges(prev => ({ ...prev, [weekId]: { ...(prev[weekId] || {}), [field]: value } }));
  };

  // ===== ARQUIVO/HISTÓRICO MENSAL (reset manual das semanas) =====
  const [archives, setArchives] = useState(() => {
    const saved = localStorage.getItem(STORAGE_KEY_ARCHIVE);
    if (saved) { try { return JSON.parse(saved); } catch (e) { console.error('Erro ao carregar histórico', e); } }
    return [];
  });
  const [showArchiveModal, setShowArchiveModal] = useState(false);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY_ARCHIVE, JSON.stringify(archives)); } catch (e) { console.error('Erro ao salvar histórico', e); }
  }, [archives]);
  useCloudSync('archives', [archives], () => archives, (v) => setArchives(v));

  const handleResetMonth = async () => {
    if (projects.length === 0) { alert('Não há itens para arquivar — a lista já está vazia.'); return; }
    const suggestion = new Date().toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    const label = window.prompt('Vamos arquivar TODOS os itens atuais (Semanas 1-4) e começar um novo mês do zero.\n\nUm arquivo .xlsx com tudo do mês vai ser baixado automaticamente antes de resetar.\n\nDê um nome para o mês que está sendo arquivado:', suggestion);
    if (label === null) return; // cancelou
    const finalLabel = label.trim() || suggestion;

    // Baixa um .xlsx com TODOS os itens do mês (das 4 semanas) antes de arquivar/limpar
    await exportGeneralXLSXForItems(projects, `Mes_${finalLabel.replace(/\s+/g, "_")}`);

    const snapshot = {
      id: 'arch-' + Date.now(),
      archivedAt: new Date().toISOString(),
      label: finalLabel,
      projects
    };
    setArchives((prev) => [snapshot, ...prev]);

    // Pergunta se quer levar a LISTA DE MAPAS pro mês novo, já cadastrada (só código + dia de
    // entrega — sem OTs, sem status, como se fosse tudo novo), em vez de ter que digitar de novo.
    const carryOver = confirm('Mês arquivado! Quer copiar a LISTA DE MAPAS (só mapa + dia de entrega, tudo zerado — sem OTs, sem status) para o novo mês já cadastrada, em vez de começar do zero?\n\nCada mapa único vira 1 item novo, pronto pra receber OTs no mês que está começando.');

    if (carryOver) {
      const seen = new Set();
      const freshItems = [];
      projects.forEach((item, idx) => {
        const key = (item.map || '').trim().toUpperCase();
        if (!key || seen.has(key)) return; // um mapa pode aparecer em várias semanas do mês antigo — só 1 cópia
        seen.add(key);
        freshItems.push({
          id: `item-${Date.now()}-${idx}`,
          deliveryDay: item.deliveryDay || "QUINTA",
          cycle: 'SEMANA_1',
          map: item.map || '',
          status: "NO_UPDATE",
          otCount: 0,
          asbuiltStatus: "SEM_ATUALIZACAO_SEMANA", asbuiltDate: "", asbuiltTech: "", asbuiltHistory: [],
          invoiceStatus: "PENDENTE", invoiceDate: "", invoiceTech: "", invoiceHistory: [],
          workbookStatus: "PENDENTE", workbookDate: "", workbookTech: "", workbookHistory: [],
          note: ""
        });
      });
      setProjects(freshItems);
    } else {
      setProjects([]);
    }
    setOpenWeek('SEMANA_1');
    setSelectedCycle('SEMANA_1');
  };

  const handleRestoreArchive = (archiveId) => {
    const arch = archives.find((a) => a.id === archiveId);
    if (!arch) return;
    if (!confirm(`Restaurar "${arch.label}"? Isso vai SUBSTITUIR os itens atuais (${projects.length}) pelos ${arch.projects.length} itens arquivados. Se quiser manter os atuais, arquive-os primeiro.`)) return;
    setProjects(arch.projects);
    setArchives((prev) => prev.filter((a) => a.id !== archiveId));
    setShowArchiveModal(false);
  };

  const handleDeleteArchive = (archiveId) => {
    if (!confirm('Excluir este arquivo permanentemente? Não dá pra desfazer.')) return;
    setArchives((prev) => prev.filter((a) => a.id !== archiveId));
  };

  // ===== BOTÃO "STATUS": TEXTO PRONTO OU PRINT PARA MANDAR NO WHATSAPP (MANUAL) =====
  const statusCaptureRef = React.useRef(null);
  const [statusFeedback, setStatusFeedback] = useState(""); // "" | "texto" | "imagem"

  const copyToClipboardGeneric = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch (e2) {
        console.error('Falha ao copiar', e2);
        return false;
      }
    }
  };

  const copyStatusText = async () => {
    const topPriority = filteredAndSorted[0]?.otCount > 0 ? `${filteredAndSorted[0].map} (${filteredAndSorted[0].otCount} OTs)` : "Nenhuma";
    const lines = [
      `📊 *STATUS DA PRODUÇÃO* — ${new Date().toLocaleDateString('pt-BR')}`,
      ``,
      `✅ Taxa de Conclusão: *${kpis.rate}%*`,
      `🗺️ Mapas: ${kpis.total} total | ${kpis.ok} finalizados | ${kpis.pending} em andamento`,
      ``,
      `⚠️ OTs a Fazer: *${kpis.totalOTs}*`,
      `🔥 Prioridade Máxima: *${topPriority}*`,
      ``,
      `📐 AS-BUILT: ${kpis.ok} prontos | ${kpis.pending} pendentes/revisão`,
      `📄 Invoices: ${kpis.invoiceUpdated}/${kpis.total} atualizadas`,
      `📘 Workbooks: ${kpis.workbookUpdated}/${kpis.total} atualizados`
    ];
    const ok = await copyToClipboardGeneric(lines.join('\n'));
    if (ok) {
      setStatusFeedback('texto');
      setTimeout(() => setStatusFeedback(''), 2000);
    } else {
      alert('Não foi possível copiar automaticamente. Tente novamente.');
    }
  };

  const captureStatusImage = async () => {
    if (!window.html2canvas) { alert('Biblioteca de captura ainda carregando, tente novamente em instantes.'); return; }
    const node = statusCaptureRef.current;
    if (!node) return;
    try {
      const canvas = await window.html2canvas(node, { backgroundColor: '#0b0f16', scale: 2 });
      canvas.toBlob(async (blob) => {
        if (!blob) return;
        const fileName = `Status_Producao_${new Date().toISOString().slice(0, 10)}.png`;
        // Em celular com suporte, tenta abrir direto o menu de compartilhamento (permite escolher o WhatsApp)
        try {
          const file = new File([blob], fileName, { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Status da Produção' });
            setStatusFeedback('imagem');
            setTimeout(() => setStatusFeedback(''), 2000);
            return;
          }
        } catch (shareErr) {
          // Cancelado ou não suportado — cai para o download abaixo
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setStatusFeedback('imagem');
        setTimeout(() => setStatusFeedback(''), 2000);
      }, 'image/png');
    } catch (e) {
      console.error('Erro ao capturar imagem de status', e);
      alert('Não foi possível gerar a imagem. Tente novamente.');
    }
  };

  const [search, setSearch] = useState("");
  const [selectedCycle, setSelectedCycle] = useState("SEMANA_1");
  const [selectedDeliveryDay, setSelectedDeliveryDay] = useState("ALL");
  const [showModal, setShowModal] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [modalMode, setModalMode] = useState("GENERAL"); // 'GENERAL' (Controle Geral / Novo Item) ou 'QUEUE' (Prioridade da Fila — atualização diária de AS-BUILT)
  const [perfTab, setPerfTab] = useState("PRODUCAO_SEMANA");
  const [selectedGeneralIds, setSelectedGeneralIds] = useState(() => new Set());

  // ===== ABA (DASHBOARD DE CONTROLE x PRODUÇÃO & CÓDIGOS AS-BUILT) =====
  const [activeTab, setActiveTab] = useState("DASHBOARD");

  // ===== SITUAÇÃO DO DRIVE NO CONTROLE GERAL =====
  // Lê o resultado da última varredura feita na aba "SCANNER DRIVE" (fica salvo no navegador,
  // mesma chave usada lá) pra mostrar SITUAÇÃO e MODIFICADO ao lado de cada mapa aqui no
  // Controle Geral, e permitir filtrar só os mapas que têm pendência no Drive. Não faz a
  // varredura sozinho (isso continua exigindo conectar ao Google Drive na aba própria) —
  // mas sempre que você volta pra esta aba, recarrega o resultado mais recente salvo.
  const [driveScanResults, setDriveScanResults] = useState(() => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY_DRIVE_SCAN_RESULTS) || 'null') || []; }
    catch (e) { return []; }
  });
  const [driveScanLast, setDriveScanLast] = useState(() => localStorage.getItem(STORAGE_KEY_DRIVE_SCAN_LAST) || '');
  const [onlyDrivePending, setOnlyDrivePending] = useState(false);
  // Feedback visual rápido (2s) no botão "Atualizar Drive" pra deixar claro que o clique funcionou,
  // já que ele só recarrega o cache local (não sai buscando nada novo sozinho no Google Drive).
  const [driveRefreshFlash, setDriveRefreshFlash] = useState(false);

  useEffect(() => {
    if (activeTab !== "DASHBOARD") return;
    try { setDriveScanResults(JSON.parse(localStorage.getItem(STORAGE_KEY_DRIVE_SCAN_RESULTS) || 'null') || []); } catch (e) {}
    setDriveScanLast(localStorage.getItem(STORAGE_KEY_DRIVE_SCAN_LAST) || '');
  }, [activeTab]);

  const driveResultByMap = useMemo(() => {
    const map = new Map();
    driveScanResults.forEach((r) => {
      const key = normMapKey(r.mapName);
      if (key && !map.has(key)) map.set(key, r);
    });
    return map;
  }, [driveScanResults]);

  const getDriveResultForItem = (mapCode) => {
    const key = normMapKey(mapCode);
    if (!key) return null;
    if (driveResultByMap.has(key)) return driveResultByMap.get(key);
    return findDriveResultForMap(mapCode, driveScanResults);
  };

  const [productionList, setProductionList] = useState(() => {
    const saved = localStorage.getItem(STORAGE_KEY_PRODUCTION);
    if (saved) {
      try { return migrateProductionCodes(JSON.parse(saved)); } catch (e) { console.error("Erro ao carregar produção", e); }
    }
    return INITIAL_PRODUCTION;
  });
  const [searchProd, setSearchProd] = useState("");
  const [showProdModal, setShowProdModal] = useState(false);
  const [showPasteImportModal, setShowPasteImportModal] = useState(false);
  const [editingProd, setEditingProd] = useState(null);
  const [selectedMapProd, setSelectedMapProd] = useState("ALL");
  // Filtro por dia de entrega na aba Produção (SEGUNDA/QUARTA/QUINTA/SEXTA), independente do
  // filtro de dia usado no Dashboard — aqui não se restringe ao ciclo/semana aberta, olha o
  // cadastro do mapa em TODOS os ciclos, já que a Produção junta o histórico inteiro.
  const [selectedDeliveryDayProd, setSelectedDeliveryDayProd] = useState("ALL");
  const [copiedRowId, setCopiedRowId] = useState(null);

  // ===== COPIAR TEXTO PRONTO (LOCAL + SPLICE + CÓDIGOS) PARA COLAR NA AUTOMAÇÃO =====
  const copyProdToClipboard = async (item) => {
    const asbuiltText = computeAsbuiltFormat(item.codes, allCodeFields);
    const lines = [item.location, item.splice ? `#${item.splice}` : '', asbuiltText].filter(Boolean);
    const text = lines.join('\n');
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      // Fallback para navegadores/contextos sem permissão de Clipboard API
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e2) {
        console.error('Falha ao copiar', e2);
        return;
      }
    }
    setCopiedRowId(item.id);
    setTimeout(() => setCopiedRowId((id) => (id === item.id ? null : id)), 1500);
  };

  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY_PRODUCTION, JSON.stringify(productionList));
    } catch (e) {
      console.error('Erro ao salvar lista de produção:', e);
    }
  }, [productionList]);
  useCloudSync('production_list', [productionList], () => productionList, (v) => setProductionList(migrateProductionCodes(v)));

  // Grava automaticamente no localStorage sempre que 'projects' for alterado
  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
    } catch (e) {
      console.error('Erro ao salvar projetos:', e);
    }
  }, [projects]);
  useCloudSync('projects', [projects], () => projects, (v) => setProjects(migrateProjectsList(v)));

  const filteredAndSorted = useMemo(() => {
    return projects.filter((p) => {
      if (selectedCycle !== "ALL" && p.cycle !== selectedCycle) return false;

      if (search) {
        const s = search.toLowerCase();
        const matchMap = (p.map || "").toLowerCase().includes(s);
        const matchTech = (p.asbuiltTech || "").toLowerCase().includes(s) || (p.invoiceTech || "").toLowerCase().includes(s) || (p.workbookTech || "").toLowerCase().includes(s);
        const matchNote = (p.note || "").toLowerCase().includes(s);
        if (!matchMap && !matchTech && !matchNote) return false;
      }
      return true;
    }).sort((a, b) => (b.otCount || 0) - (a.otCount || 0));
  }, [projects, search, selectedCycle]);

  const otQueueItems = useMemo(() => {
    // Fica na fila quem tem OT pendente OU quem já está com o AS-BUILT marcado como "FAZENDO"
    // (em andamento) — assim um mapa que alguém começou a trabalhar não desaparece da fila
    // só porque o saldo de OTs já está zerado.
    return filteredAndSorted.filter(p => p.otCount > 0 || p.asbuiltStatus === "FAZENDO");
  }, [filteredAndSorted]);

  // Fila de prioridade filtrada pelo mesmo dia de entrega selecionado (compartilha o filtro
  // com o Controle Geral, para os dois ficarem sincronizados na mesma aba de dia).
  const filteredQueueItems = useMemo(() => {
    if (selectedDeliveryDay === "ALL") return otQueueItems;
    return otQueueItems.filter((p) => (p.deliveryDay || "").trim().toUpperCase() === selectedDeliveryDay);
  }, [otQueueItems, selectedDeliveryDay]);

  // Dias de entrega disponíveis (extraídos dos próprios itens cadastrados, não é lista fixa)
  const deliveryDayOptions = useMemo(() => {
    const set = new Set();
    filteredAndSorted.forEach((p) => { if (p.deliveryDay && p.deliveryDay.trim()) set.add(p.deliveryDay.trim().toUpperCase()); });
    return Array.from(set).sort();
  }, [filteredAndSorted]);

  // Se o dia selecionado sumir da lista (ex: trocou de semana), volta pra "Todos"
  useEffect(() => {
    if (selectedDeliveryDay !== "ALL" && !deliveryDayOptions.includes(selectedDeliveryDay)) {
      setSelectedDeliveryDay("ALL");
    }
  }, [deliveryDayOptions, selectedDeliveryDay]);

  // Itens da tabela "Controle Geral" filtrados pelo dia de entrega selecionado
  const generalTableItems = useMemo(() => {
    if (selectedDeliveryDay === "ALL") return filteredAndSorted;
    return filteredAndSorted.filter((p) => (p.deliveryDay || "").trim().toUpperCase() === selectedDeliveryDay);
  }, [filteredAndSorted, selectedDeliveryDay]);

  // Mesma lista acima, mas só usada pra RENDERIZAR a tabela — quando "Só com pendência no
  // Drive" está marcado, esconde os mapas que a varredura do Drive não achou (ou achou "em
  // dia"), sem afetar os cálculos de progresso/KPIs que usam generalTableItems inteiro.
  const generalTableItemsDisplayed = useMemo(() => {
    if (!onlyDrivePending) return generalTableItems;
    return generalTableItems.filter((item) => {
      const dr = getDriveResultForItem(item.map);
      return dr && !dr.error && (dr.pendingCount || 0) > 0;
    });
  }, [generalTableItems, onlyDrivePending, driveScanResults]);

  // Progressão separada por etapa (AS-BUILT / INVOICE / WORKBOOK) dentro do dia de entrega
  // selecionado — permite ver, por exemplo, que o AS-BUILT de quinta-feira já está quase
  // todo atualizado mesmo que Invoice/Workbook ainda estejam pendentes.
  // IMPORTANTE: a base de cálculo é TODOS os mapas do dia (generalTableItems), não só os
  // que ainda têm OT pendente (fila). Isso evita dois problemas: (1) um mapa que você já
  // terminou o AS-BUILT e zerou as OTs sai da fila e deixava de contar no progresso; (2)
  // adicionar/remover OT de um mapa mudava a base de cálculo e fazia o % de Invoice/Workbook
  // oscilar sem relação nenhuma com o trabalho de invoice/workbook em si.
  const queueStageStats = useMemo(() => {
    const total = generalTableItems.length;
    const asbuiltDone = generalTableItems.filter(p => p.asbuiltStatus === "OK" || p.asbuiltStatus === "ENTREGUE").length;
    const invoiceDone = generalTableItems.filter(p => p.invoiceStatus === "SIM" || p.invoiceStatus === "OK" || p.invoiceStatus === "ENTREGUE").length;
    const workbookDone = generalTableItems.filter(p => p.workbookStatus === "SIM" || p.workbookStatus === "OK").length;
    const pct = (n) => (total > 0 ? Math.round((n / total) * 100) : 0);
    return {
      total,
      asbuilt: { done: asbuiltDone, pct: pct(asbuiltDone) },
      invoice: { done: invoiceDone, pct: pct(invoiceDone) },
      workbook: { done: workbookDone, pct: pct(workbookDone) },
    };
  }, [generalTableItems]);

  // DESEMPENHO POR COLABORADOR: CADA DIA REGISTRADO NO CICLO (COM TÉCNICO) SOMA 1 PONTO PARA QUEM ATUALIZOU
  const perfCollaborators = useMemo(() => {
    const mapTechs = {};

    const ensureTech = (key) => {
      if (!mapTechs[key]) {
        mapTechs[key] = {
          name: key,
          updatesCount: 0,
          asbuiltCount: 0,
          invoiceCount: 0,
          workbookCount: 0,
          pendingOts: 0,
          asbuiltMaps: [],
          invoiceMaps: [],
          workbookMaps: []
        };
      }
      return mapTechs[key];
    };

    // Cada entrada de data no histórico do ciclo vale 1 ponto para o técnico que a registrou.
    // Ex: mapa X atualizado por KELVI em 04-08 e 05-08, depois por CARLOS em 06-08, depois
    // KELVI de novo em 07-08 → KELVI fica com 3 pontos (3 datas) e CARLOS com 1 (1 data).
    const recordUpdate = (techName, stageName, mapLabel, dateStr) => {
      const key = (techName || "").toUpperCase().trim();
      if (!key) return; // sem técnico atribuído nessa data, não dá pra creditar ninguém
      const t = ensureTech(key);
      t.updatesCount += 1;
      const mapName = `${(mapLabel || "SEM MAPA").trim()}${dateStr ? ` (${formatShortDate(dateStr)})` : ""}`;
      if (stageName === 'AB') { t.asbuiltCount += 1; t.asbuiltMaps.push(mapName); }
      if (stageName === 'INV') { t.invoiceCount += 1; t.invoiceMaps.push(mapName); }
      if (stageName === 'WB') { t.workbookCount += 1; t.workbookMaps.push(mapName); }
    };

    filteredAndSorted.forEach(p => {
      [
        { hist: p.asbuiltHistory, stage: 'AB' },
        { hist: p.workbookHistory, stage: 'WB' },
        { hist: p.invoiceHistory, stage: 'INV' }
      ].forEach(({ hist, stage }) => {
        (Array.isArray(hist) ? hist : []).forEach((entry) => {
          recordUpdate(historyEntryTech(entry), stage, p.map, historyEntryDate(entry));
        });
      });

      // OTs pendentes continuam atribuídas ao técnico de AS-BUILT atual do item
      if (p.otCount > 0 && p.asbuiltTech) {
        ensureTech(p.asbuiltTech.toUpperCase().trim()).pendingOts += p.otCount;
      }
    });

    return Object.values(mapTechs).sort((a, b) => b.updatesCount - a.updatesCount);
  }, [filteredAndSorted]);

  const delayedItems = useMemo(() => {
    return filteredAndSorted.filter(p => p.status !== "OK" || p.otCount > 0);
  }, [filteredAndSorted]);

  const kpis = useMemo(() => {
    const total = filteredAndSorted.length;
    const ok = filteredAndSorted.filter(p => p.status === "OK" || ((p.asbuiltStatus === "OK" || p.asbuiltStatus === "ENTREGUE") && (p.invoiceStatus === "SIM" || p.invoiceStatus === "ENTREGUE") && p.workbookStatus === "SIM")).length;
    const pending = total - ok;
    const totalOTs = filteredAndSorted.reduce((acc, p) => acc + (p.otCount || 0), 0);
    // Total equivalente pela Produção: soma, por mapa presente neste ciclo, das linhas de Produção
    // ainda não marcadas FEITO. Serve só de comparação — não substitui o total oficial (totalOTs),
    // que continua vindo do saldo salvo em cada item (editável no cadastro/Fila de Prioridade).
    const mapsInCycle = new Set(filteredAndSorted.map(p => (p.map || "").trim().toUpperCase()).filter(Boolean));
    const totalOTsFromProduction = productionList.reduce((acc, p) => {
      const mapKey = (p.map || "").trim().toUpperCase();
      if (mapsInCycle.has(mapKey) && !p.done) return acc + 1;
      return acc;
    }, 0);
    const invoiceUpdated = filteredAndSorted.filter(p => p.invoiceStatus === "SIM" || p.invoiceStatus === "OK" || p.invoiceStatus === "ENTREGUE").length;
    const workbookUpdated = filteredAndSorted.filter(p => p.workbookStatus === "SIM" || p.workbookStatus === "OK").length;
    const rate = total > 0 ? Math.round((ok / total) * 100) : 0;

    return { total, ok, pending, totalOTs, totalOTsFromProduction, invoiceUpdated, workbookUpdated, rate };
  }, [filteredAndSorted, productionList]);

  const statusBadge = (st) => {
    switch (st) {
      case "OK": return <span style={{ background: C.greenSoft, color: C.green, border: `1px solid ${C.green}`, padding: "2px 6px", borderRadius: 4, fontSize: 10, fontWeight: 700 }}>{t('PRONTO')}</span>;
      case "PENDING_REVISION": return <span style={{ background: C.redSoft, color: C.red, border: `1px solid ${C.red}`, padding: "2px 6px", borderRadius: 4, fontSize: 10, fontWeight: 700 }}>{t('REVISÃO NECESSÁRIA')}</span>;
      default: return <span style={{ background: C.panel2, color: C.textDim, border: `1px solid ${C.border2}`, padding: "2px 6px", borderRadius: 4, fontSize: 10 }}>{t('SEM ATUALIZAÇÃO')}</span>;
    }
  };

  const handleSaveItem = (item) => {
    const submittedOtCount = Number(item.otCount || 0);

    // Se surgiram OTs novas (ex: chegaram mais demandas depois do AS-BUILT já ter sido
    // marcado como "Atualizado"/"Entregue" hoje), isso significa que o AS-BUILT atual não
    // cobre mais o mapa inteiro — então volta o status pra PENDENTE automaticamente, pra
    // reentrar na Fila de Prioridade, em vez de simplesmente descartar as OTs recém-somadas.
    const asbuiltStatus = (submittedOtCount > 0 && (item.asbuiltStatus === "OK" || item.asbuiltStatus === "ENTREGUE")) ? "PENDENTE" : item.asbuiltStatus;

    const isFullyDone = (asbuiltStatus === "OK" || asbuiltStatus === "ENTREGUE")
      && (item.invoiceStatus === "SIM" || item.invoiceStatus === "ENTREGUE")
      && item.workbookStatus === "SIM";

    const finalItem = {
      ...item,
      asbuiltStatus,
      cycle: item.cycle || "SEMANA_1",
      status: isFullyDone ? "OK" : (item.status || "NO_UPDATE"),
      otCount: submittedOtCount
    };

    if (finalItem.id) {
      setProjects(prev => prev.map(p => p.id === finalItem.id ? finalItem : p));
    } else {
      setProjects(prev => [...prev, { ...finalItem, id: `item-${Date.now()}` }]);
    }
    setShowModal(false);
    setEditingItem(null);
  };

  const handleDeleteItem = (id) => {
    if (confirm("Deseja realmente remover este item do sistema?")) {
      setProjects(prev => prev.filter(p => p.id !== id));
    }
  };

  // ===== SELEÇÃO DE LINHAS NO CONTROLE GERAL (PARA COPIAR MAPAS PRA PRÓXIMA SEMANA) =====
  const toggleGeneralSelect = (id) => {
    setSelectedGeneralIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };
  const toggleSelectAllGeneralVisible = () => {
    setSelectedGeneralIds(prev => {
      const allSelected = generalTableItems.length > 0 && generalTableItems.every(p => prev.has(p.id));
      if (allSelected) return new Set();
      return new Set(generalTableItems.map(p => p.id));
    });
  };
  const allGeneralVisibleSelected = generalTableItems.length > 0 && generalTableItems.every(p => selectedGeneralIds.has(p.id));

  // Copia os mapas selecionados (ou, se nenhum estiver marcado, TODOS os visíveis na aba de
  // entrega atual) para a semana seguinte, já zerados (PENDENTE), sem precisar recadastrar 1 a 1.
  const handleCopyToNextWeek = () => {
    const sourceItems = selectedGeneralIds.size > 0
      ? generalTableItems.filter(p => selectedGeneralIds.has(p.id))
      : generalTableItems;

    if (sourceItems.length === 0) {
      alert("Nenhum mapa para copiar.");
      return;
    }

    const label = selectedGeneralIds.size > 0 ? `${sourceItems.length} mapa(s) selecionado(s)` : `TODOS os ${sourceItems.length} mapa(s) visíveis`;
    if (!confirm(`Copiar ${label} para a semana seguinte (zerados, como PENDENTE)?`)) return;

    const nextCycleOf = (cycleId) => {
      const idx = WEEK_OPTIONS.findIndex(w => w.id === cycleId);
      return WEEK_OPTIONS[(idx + 1) % WEEK_OPTIONS.length].id;
    };

    const copies = sourceItems.map((item, idx) => ({
      ...item,
      id: `item-${Date.now()}-${idx}`,
      cycle: nextCycleOf(item.cycle || "SEMANA_1"),
      asbuiltStatus: "SEM_ATUALIZACAO_SEMANA", asbuiltDate: "", asbuiltTech: "", asbuiltHistory: [],
      invoiceStatus: "PENDENTE", invoiceDate: "", invoiceTech: "", invoiceHistory: [],
      workbookStatus: "PENDENTE", workbookDate: "", workbookTech: "", workbookHistory: [],
      status: "NO_UPDATE"
    }));

    setProjects(prev => [...prev, ...copies]);
    setSelectedGeneralIds(new Set());
    alert(`${copies.length} mapa(s) copiado(s) para a próxima semana com sucesso!`);
  };

  // ===== LÓGICA DA ABA PRODUÇÃO & CÓDIGOS AS-BUILT =====
  // ===== CÓDIGOS CUSTOMIZADOS (além dos 11 padrão) — ex: surgiu um código novo "AS19" =====
  // Guarda só os códigos extras cadastrados pela equipe; os 11 padrão (CODE_FIELDS) continuam
  // fixos no código. "allCodeFields" é a lista final usada em toda a aba Produção (tabela,
  // cadastro, totais, invoice e exportação) — assim um código novo aparece em todo lugar de
  // uma vez só, sem precisar recadastrar em cada tela.
  const [customCodeFields, setCustomCodeFields] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_CUSTOM_CODES) || 'null');
      if (Array.isArray(saved)) return saved;
    } catch (e) {}
    return [];
  });
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY_CUSTOM_CODES, JSON.stringify(customCodeFields)); } catch (e) { console.error('Erro ao salvar códigos customizados', e); }
  }, [customCodeFields]);
  useCloudSync('custom_code_fields', [customCodeFields], () => customCodeFields, (v) => setCustomCodeFields(Array.isArray(v) ? v : []));

  const allCodeFields = useMemo(() => [...CODE_FIELDS, ...customCodeFields], [customCodeFields]);

  // Cadastra um novo código (ex: "AS19"). Normaliza (maiúsculo, sem espaço) e recusa duplicado
  // (tanto dos 11 padrão quanto dos já customizados). Devolve true/false pra quem chamou avisar.
  const addCustomCodeField = (rawId) => {
    const id = (rawId || '').trim().toUpperCase().replace(/\s+/g, '');
    if (!id) return false;
    const alreadyExists = CODE_FIELDS.some(f => f.id === id) || customCodeFields.some(f => f.id === id);
    if (alreadyExists) { alert(`O código "${id}" já existe.`); return false; }
    setCustomCodeFields(prev => [...prev, { id, label: id }]);
    return true;
  };

  // Remove um código customizado (só é permitido remover os que foram adicionados pela
  // equipe — os 11 padrão do sistema não podem ser removidos por aqui). Os valores já
  // lançados nesse código, dentro de registros de produção antigos, ficam guardados —
  // só somem de aparecer na tabela/cadastro/exportação, mas nada é apagado do histórico.
  const removeCustomCodeField = (id) => {
    setCustomCodeFields(prev => prev.filter(f => f.id !== id));
  };

  // ===== DIA DE ENTREGA POR MAPA, ATRIBUÍDO DIRETO AQUI NA PRODUÇÃO =====
  // Independente do cadastro no Controle Geral: permite marcar o dia de entrega (SEGUNDA/
  // QUARTA/QUINTA/SEXTA) de um mapa direto na aba Produção, pra classificar mesmo mapas que
  // ainda não foram cadastrados lá (ou corrigir o dia sem precisar abrir o outro cadastro).
  // Quando o mapa também está cadastrado no Controle Geral, esse valor aqui tem prioridade.
  const [mapDeliveryDayOverrides, setMapDeliveryDayOverrides] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_MAP_DELIVERY_DAY) || 'null');
      if (saved) return saved;
    } catch (e) {}
    return {};
  });
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY_MAP_DELIVERY_DAY, JSON.stringify(mapDeliveryDayOverrides)); } catch (e) { console.error('Erro ao salvar dia de entrega por mapa', e); }
  }, [mapDeliveryDayOverrides]);
  useCloudSync('map_delivery_day_overrides', [mapDeliveryDayOverrides], () => mapDeliveryDayOverrides, (v) => setMapDeliveryDayOverrides(v));

  const setMapDeliveryDay = (mapName, day) => {
    const key = (mapName || "").trim().toUpperCase();
    if (!key) return;
    setMapDeliveryDayOverrides(prev => {
      const next = { ...prev };
      if (!day) delete next[key];
      else next[key] = day;
      return next;
    });
  };

  // Liga cada MAPA (código) ao dia de entrega: prioridade pro que foi definido manualmente aqui
  // na Produção (mapDeliveryDayOverrides); se não tiver, cai pro cadastro do Controle Geral,
  // olhando TODOS os ciclos/semanas (não só o aberto), já que a Produção acumula histórico de tudo.
  const mapToDeliveryDay = useMemo(() => {
    const lookup = {};
    projects.forEach(p => {
      const key = (p.map || "").trim().toUpperCase();
      const day = (p.deliveryDay || "").trim().toUpperCase();
      if (key && day) lookup[key] = day;
    });
    // Override manual (definido aqui na Produção) sempre vence o que veio do Controle Geral.
    Object.entries(mapDeliveryDayOverrides).forEach(([key, day]) => {
      if (day) lookup[key] = day;
    });
    return lookup;
  }, [projects, mapDeliveryDayOverrides]);

  const productionDeliveryDayOptions = useMemo(() => {
    const set = new Set(Object.values(mapToDeliveryDay));
    return Array.from(set).sort();
  }, [mapToDeliveryDay]);

  // Volta pra "Todos" se o dia selecionado sumir (ex: nenhum mapa mais cadastrado com esse dia)
  useEffect(() => {
    if (selectedDeliveryDayProd !== "ALL" && selectedDeliveryDayProd !== "SEM_ENTREGA" && !productionDeliveryDayOptions.includes(selectedDeliveryDayProd)) {
      setSelectedDeliveryDayProd("ALL");
    }
  }, [productionDeliveryDayOptions, selectedDeliveryDayProd]);

  // Lista de mapas/projetos únicos existentes na produção, com contagem de registros de cada um
  const availableMaps = useMemo(() => {
    const counts = {};
    productionList.forEach(item => {
      const key = (item.map || "SEM MAPA").trim() || "SEM MAPA";
      counts[key] = (counts[key] || 0) + 1;
    });
    return Object.keys(counts).sort().map(map => ({ map, count: counts[map] }));
  }, [productionList]);

  // Mesma lista acima, mas só com os mapas cujo dia de entrega cadastrado bate com o filtro
  // selecionado (ou "SEM_ENTREGA" pra mapas com produção lançada mas ainda sem cadastro no
  // Controle Geral — não têm como saber o dia de entrega ainda).
  const availableMapsForSelectedDay = useMemo(() => {
    if (selectedDeliveryDayProd === "ALL") return availableMaps;
    return availableMaps.filter(({ map }) => {
      const day = mapToDeliveryDay[map.trim().toUpperCase()];
      return selectedDeliveryDayProd === "SEM_ENTREGA" ? !day : day === selectedDeliveryDayProd;
    });
  }, [availableMaps, mapToDeliveryDay, selectedDeliveryDayProd]);

  // Aplica o filtro de dia de entrega, depois o filtro de mapa selecionado, antes da busca por texto
  const productionByDay = useMemo(() => {
    if (selectedDeliveryDayProd === "ALL") return productionList;
    return productionList.filter(p => {
      const day = mapToDeliveryDay[(p.map || "").trim().toUpperCase()];
      return selectedDeliveryDayProd === "SEM_ENTREGA" ? !day : day === selectedDeliveryDayProd;
    });
  }, [productionList, mapToDeliveryDay, selectedDeliveryDayProd]);

  const productionByMap = useMemo(() => {
    if (selectedMapProd === "ALL") return productionByDay;
    return productionByDay.filter(p => (p.map || "SEM MAPA").trim() === selectedMapProd || (!p.map && selectedMapProd === "SEM MAPA"));
  }, [productionByDay, selectedMapProd]);

  const filteredProduction = useMemo(() => {
    return productionByMap.filter(p => !searchProd || JSON.stringify(p).toLowerCase().includes(searchProd.toLowerCase()));
  }, [productionByMap, searchProd]);

  // ===== SELEÇÃO DE LINHAS (pra somar só algumas no Invoice, ex: só uma semana específica) =====
  const [selectedProdIds, setSelectedProdIds] = useState(() => new Set());
  // Cabeçalho da tabela de Produção "grudado" (sticky) ao rolar a página, pra sempre dar pra
  // ver os títulos das colunas. Mede a altura real da linha de TOTAIS em tempo de execução
  // (varia com o texto, ex: "(8 LINHA(S) SELECIONADA(S))"), pra empilhar certinho a linha de
  // CABEÇALHOS logo abaixo dela, sem sobrepor uma na outra.
  const prodTotalsRowRef = React.useRef(null);
  const [prodTotalsRowHeight, setProdTotalsRowHeight] = useState(37);
  useEffect(() => {
    const measure = () => {
      if (prodTotalsRowRef.current) setProdTotalsRowHeight(prodTotalsRowRef.current.getBoundingClientRect().height);
    };
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, [selectedProdIds, selectedMapProd]);
  const [rangeFrom, setRangeFrom] = useState("");
  const [rangeTo, setRangeTo] = useState("");

  const toggleProdSelect = (id) => {
    setSelectedProdIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const allVisibleSelected = filteredProduction.length > 0 && filteredProduction.every(p => selectedProdIds.has(p.id));
  const toggleSelectAllVisible = () => {
    setSelectedProdIds(prev => {
      if (allVisibleSelected) {
        const next = new Set(prev);
        filteredProduction.forEach(p => next.delete(p.id));
        return next;
      }
      const next = new Set(prev);
      filteredProduction.forEach(p => next.add(p.id));
      return next;
    });
  };

  const clearProdSelection = () => setSelectedProdIds(new Set());

  // ===== MARCAÇÃO "FEITO" (conclusão de produção) — separada da seleção de linhas para invoice =====
  // Permite marcar cada registro como concluído sem afetar a seleção usada no Fechamento/Invoice.
  const [prodDoneFilter, setProdDoneFilter] = useState("ALL"); // "ALL" | "PENDING" | "DONE"

  const toggleProdDone = (id) => {
    setProductionList(prev => prev.map(p => p.id === id ? { ...p, done: !p.done } : p));
  };

  // Progresso por data: quantos registros existem em cada dia e quantos já foram marcados
  // como "FEITO" — assim dá pra ver, por exemplo, que no dia 08-08 tinham 18 a fazer e
  // quantos já foram concluídos, mesmo que apareçam trabalhos novos no mesmo dia depois.
  const dailyProdStats = useMemo(() => {
    const map = {};
    filteredProduction.forEach((item) => {
      const d = item.date || "SEM DATA";
      if (!map[d]) map[d] = { total: 0, done: 0 };
      map[d].total += 1;
      if (item.done) map[d].done += 1;
    });
    return Object.entries(map)
      .map(([date, stats]) => ({ date, ...stats, pending: stats.total - stats.done }))
      .sort((a, b) => (a.date < b.date ? 1 : -1));
  }, [filteredProduction]);

  // Aplica o filtro Todos/Pendentes/Feitos por cima do que já estava filtrado (mapa + busca)
  const visibleProduction = useMemo(() => {
    if (prodDoneFilter === "PENDING") return filteredProduction.filter(p => !p.done);
    if (prodDoneFilter === "DONE") return filteredProduction.filter(p => p.done);
    return filteredProduction;
  }, [filteredProduction, prodDoneFilter]);

  // Progresso do PERÍODO DE ENTREGA (ex: fechamento semanal de 08-08 até 14-08) — usa o mesmo
  // "DE / ATÉ" já existente no cabeçalho, então mudar as datas ali também atualiza esse resumo.
  const formatDateBR = (isoDate) => {
    if (!isoDate) return "";
    const parts = isoDate.split("-");
    if (parts.length !== 3) return isoDate;
    const [y, m, d] = parts;
    return `${d}/${m}`;
  };
  const periodProdStats = useMemo(() => {
    if (!rangeFrom || !rangeTo) return null;
    const rows = filteredProduction.filter(p => p.date && p.date >= rangeFrom && p.date <= rangeTo);
    const total = rows.length;
    const done = rows.filter(p => p.done).length;
    return { total, done, pending: total - done, from: rangeFrom, to: rangeTo };
  }, [filteredProduction, rangeFrom, rangeTo]);

  // Marca automaticamente todas as linhas visíveis dentro de um período de datas (ex: 2026-08-01 a 2026-08-07)
  const selectByDateRange = () => {
    if (!rangeFrom || !rangeTo) { alert('Preencha as duas datas (de / até) pra selecionar por período.'); return; }
    setSelectedProdIds(prev => {
      const next = new Set(prev);
      filteredProduction.forEach(p => {
        if (p.date && p.date >= rangeFrom && p.date <= rangeTo) next.add(p.id);
      });
      return next;
    });
  };

  // Se houver linhas selecionadas, o Invoice/Totais usa só elas — senão, usa tudo que está filtrado (comportamento de sempre)
  const invoiceSourceRows = selectedProdIds.size > 0 ? filteredProduction.filter(p => selectedProdIds.has(p.id)) : filteredProduction;

  // Totais acumulados agora respeitam o mapa selecionado (e a busca), não mais a lista inteira —
  // e passam a considerar a seleção de linhas quando houver alguma marcada.
  const codeTotals = useMemo(() => {
    const totals = {};
    allCodeFields.forEach(f => totals[f.id] = 0);
    invoiceSourceRows.forEach(item => {
      allCodeFields.forEach(f => {
        totals[f.id] += Number(item.codes?.[f.id]) || 0;
      });
    });
    return totals;
  }, [invoiceSourceRows, allCodeFields]);

  // ===== FECHAMENTO / INVOICE — preço por código (editável, sincronizado com a equipe) =====
  const [invoicePrices, setInvoicePrices] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_INVOICE_PRICES) || 'null');
      if (saved) return saved;
    } catch (e) {}
    const defaults = {};
    CODE_FIELDS.forEach(f => defaults[f.id] = 10);
    return defaults;
  });
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY_INVOICE_PRICES, JSON.stringify(invoicePrices)); } catch (e) { console.error('Erro ao salvar preços do invoice', e); }
  }, [invoicePrices]);
  useCloudSync('invoice_prices', [invoicePrices], () => invoicePrices, (v) => setInvoicePrices(v));

  const updateInvoicePrice = (codeId, value) => {
    setInvoicePrices(prev => ({ ...prev, [codeId]: value === '' ? '' : Number(value) }));
  };

  // Linhas do invoice: código, total de unidades, preço unitário e subtotal (total x preço)
  const invoiceRows = useMemo(() => {
    return allCodeFields.map(f => {
      const total = codeTotals[f.id] || 0;
      const price = Number(invoicePrices[f.id]) || 0;
      return { id: f.id, label: f.label, total, price, subtotal: total * price };
    });
  }, [codeTotals, invoicePrices, allCodeFields]);

  const invoiceGrandTotal = useMemo(() => invoiceRows.reduce((sum, r) => sum + r.subtotal, 0), [invoiceRows]);

  // ===== PENDINGS POR MAPA (checklist manual: FT/SE/S, DONE/MISSING, coordenadas) =====
  const [pendingsByMap, setPendingsByMap] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_PENDINGS) || 'null');
      if (saved) return saved;
    } catch (e) {}
    return {};
  });
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY_PENDINGS, JSON.stringify(pendingsByMap)); } catch (e) { console.error('Erro ao salvar pendings', e); }
  }, [pendingsByMap]);
  useCloudSync('pendings_by_map', [pendingsByMap], () => pendingsByMap, (v) => setPendingsByMap(v));

  // ===== REDLINES (planilha de controle por mês, colorida por status, com pendências gerais) =====
  const [redlinesData, setRedlinesData] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_REDLINES) || 'null');
      if (saved) return saved;
    } catch (e) {}
    return { months: {}, currentMonth: '' };
  });
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY_REDLINES, JSON.stringify(redlinesData)); } catch (e) { console.error('Erro ao salvar redlines', e); }
  }, [redlinesData]);
  useCloudSync('redlines', [redlinesData], () => redlinesData, (v) => setRedlinesData(v));

  const handleSaveProd = (item) => {
    if (item.id) {
      setProductionList(prev => prev.map(p => p.id === item.id ? item : p));
    } else {
      setProductionList(prev => [...prev, { ...item, id: `prod-${Date.now()}` }]);
    }
    setShowProdModal(false);
    setEditingProd(null);
  };

  const handleDeleteProd = (id) => {
    if (confirm("Deseja remover este registro de produção?")) {
      setProductionList(prev => prev.filter(p => p.id !== id));
    }
  };

  // Apaga todos os registros do mapa atualmente selecionado no filtro
  const handleDeleteCurrentMapProd = () => {
    if (selectedMapProd === "ALL") return;
    const count = productionList.filter(p => (p.map || "SEM MAPA").trim() === selectedMapProd || (!p.map && selectedMapProd === "SEM MAPA")).length;
    if (count === 0) return;
    if (!confirm(`Limpar (apagar) TODOS os ${count} registro(s) do mapa "${selectedMapProd}"? Essa ação não pode ser desfeita.`)) return;
    setProductionList(prev => prev.filter(p => !((p.map || "SEM MAPA").trim() === selectedMapProd || (!p.map && selectedMapProd === "SEM MAPA"))));
    setSelectedMapProd("ALL");
  };

  // Recebe as linhas já coladas do Excel/Sheets (DATE, MAP, LOCATION, SPLICE, NAME, TYPE, TYPE)
  // e cria um registro de produção pra cada uma, com os códigos em branco pra preencher depois.
  const handleImportPastedRows = (rows) => {
    if (!rows || rows.length === 0) return;
    const newItems = rows.map((r) => ({
      id: `prod-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      daily: "",
      pendings: "NO HUNG",
      done: false,
      date: r.date || "",
      map: r.map || "",
      location: r.location || "",
      splice: r.splice || "",
      name: r.name || "",
      type: r.type || "AERIAL",
      typeEnd: r.typeEnd || "END",
      codes: {
        US01: '', FS01: '', FS02: '', FS03: '', FS14: '', FS07A: '', FS08: '', FS16: '', FS04: '', AS24: '', MC01A: '',
        ...(r.codes || {})
      }
    }));
    setProductionList(prev => [...prev, ...newItems]);
    setShowPasteImportModal(false);
  };

  // Assinatura única de uma linha (mapa + local + data + splice), pra saber se ela já existe
  // na Produção e não importar duplicado quando a mesma pendência é importada mais de uma vez.
  const prodRowSignature = (r) => [
    String(r.map || '').trim().toUpperCase(),
    String(r.location || '').trim().toUpperCase(),
    String(r.date || '').trim(),
    String(r.splice || '').trim().toUpperCase(),
  ].join('|');

  const existingProdSignatures = useMemo(() => {
    return new Set(productionList.map(prodRowSignature));
  }, [productionList]);

  // Recebe as linhas "pendentes" já lidas pelo Scanner Drive (uma por mapa escaneado) e cria um
  // registro de produção pra cada uma que ainda não existe na aba Produção — sem precisar copiar
  // e colar manualmente do Excel/Drive. Os códigos ficam em branco pra preencher na hora do as-built.
  const handleImportFromDrive = (rows, updateExisting = false) => {
    if (!rows || rows.length === 0) return { imported: 0, updated: 0, skipped: 0, newCodes: [] };

    // Se alguma linha trouxe um código que ainda não existe no sistema (ex: coluna extra "FS10"
    // que só existe naquele mapa específico), cadastra automaticamente como código customizado —
    // igual ao botão "Novo Código", mas sem interromper a importação com um alerta por linha.
    const knownIds = new Set(allCodeFields.map((f) => f.id));
    const newIds = new Set();
    rows.forEach((r) => {
      Object.keys(r.codes || {}).forEach((id) => {
        if (id && !knownIds.has(id)) newIds.add(id);
      });
    });
    if (newIds.size > 0) {
      setCustomCodeFields((prev) => {
        const existing = new Set([...CODE_FIELDS.map((f) => f.id), ...prev.map((f) => f.id)]);
        const toAddFields = [...newIds].filter((id) => !existing.has(id)).map((id) => ({ id, label: id }));
        return toAddFields.length > 0 ? [...prev, ...toAddFields] : prev;
      });
    }

    const toAdd = [];
    // sig -> linha vinda da planilha, pra quando o registro já existe mas o usuário marcou
    // "Atualizar as linhas já existentes" — aí em vez de ignorar, mescla os dados novos.
    const updatesBySig = new Map();
    let skipped = 0;
    rows.forEach((r) => {
      const sig = prodRowSignature(r);
      if (existingProdSignatures.has(sig)) {
        if (updateExisting) { updatesBySig.set(sig, r); } else { skipped++; }
        return;
      }
      toAdd.push({
        id: `prod-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
        daily: "",
        pendings: "NO HUNG",
        done: false,
        date: r.date || "",
        map: r.map || "",
        location: r.location || "",
        splice: r.splice || "",
        name: r.name || "",
        type: r.typeCode || "AERIAL",
        typeEnd: r.type || "END",
        codes: { US01: '', FS01: '', FS02: '', FS03: '', FS14: '', FS07A: '', FS08: '', FS16: '', FS04: '', AS24: '', MC01A: '', ...(r.codes || {}) },
      });
    });

    if (toAdd.length > 0 || updatesBySig.size > 0) {
      setProductionList(prev => {
        let next = prev;
        if (updatesBySig.size > 0) {
          next = prev.map((item) => {
            const incoming = updatesBySig.get(prodRowSignature(item));
            if (!incoming) return item;
            // Só sobrescreve nome/tipo se a planilha trouxe algo preenchido, e só sobrescreve os
            // códigos que vieram com valor — códigos já preenchidos manualmente no site que a
            // planilha não trouxe (vazio) continuam intactos, nada é apagado.
            const incomingCodes = Object.fromEntries(
              Object.entries(incoming.codes || {}).filter(([, v]) => v !== '' && v != null)
            );
            return {
              ...item,
              name: incoming.name || item.name,
              type: incoming.typeCode || item.type,
              typeEnd: incoming.type || item.typeEnd,
              codes: { ...item.codes, ...incomingCodes },
            };
          });
        }
        return toAdd.length > 0 ? [...next, ...toAdd] : next;
      });
    }

    return { imported: toAdd.length, updated: updatesBySig.size, skipped, newCodes: [...newIds] };
  };

  const [showDriveImportModal, setShowDriveImportModal] = useState(false);

  // ===== EXPORTAR .XLSX COM CORES (igual ao padrão usado na planilha do Google Sheets) =====
  const exportProdXLSX = async () => {
    if (!window.ExcelJS) {
      alert('Biblioteca de exportação Excel ainda carregando, tente novamente em instantes.');
      return;
    }
    const mainHeaders = ["DAILY", "PENDINGS", "DATE", "MAP", "LOCATION", "SPLICE", "NAME", "TYPE", "TYPE"];
    const codeHeaders = allCodeFields.map((f) => f.label);
    const headers = [...mainHeaders, ...codeHeaders, "ASBUILT (GERADO)"];
    const nMain = mainHeaders.length;
    const nCode = codeHeaders.length;
    const totalCols = headers.length;
    const colLetter = (n) => {
      let s = '';
      while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
      return s;
    };

    const wb = new window.ExcelJS.Workbook();
    const ws = wb.addWorksheet('Produção As-Built');

    // ----- LINHA 1: TOTAIS -----
    const totalsRowData = new Array(totalCols).fill('');
    totalsRowData[0] = `TOTAIS ${selectedMapProd === "ALL" ? "(TODOS OS MAPAS)" : `(MAPA ${selectedMapProd})`} -->`;
    allCodeFields.forEach((f, i) => { totalsRowData[nMain + i] = codeTotals[f.id] || 0; });
    totalsRowData[totalCols - 1] = 'AUTOMÁTICO';
    ws.getRow(1).values = totalsRowData;
    ws.mergeCells(1, 1, 1, nMain);

    // ----- LINHA 2: CABEÇALHOS -----
    ws.getRow(2).values = headers;

    // ----- LINHAS 3+: DADOS -----
    filteredProduction.forEach((item, idx) => {
      const asbuiltText = computeAsbuiltFormat(item.codes, allCodeFields);
      ws.getRow(3 + idx).values = [
        item.daily || '', item.pendings || '', item.date || '', item.map || '', item.location || '',
        item.splice || '', item.name || '', item.type || '', item.typeEnd || '',
        ...allCodeFields.map((f) => item.codes?.[f.id] || ''),
        asbuiltText
      ];
    });

    const lastDataRow = 2 + filteredProduction.length;

    // ----- CORES -----
    const mainHeaderFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1B5E20' } };
    const codeHeaderFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF33691E' } };
    const totalsFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB3E5FC' } };
    const dateMapLocFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF92D050' } };
    const codeDataFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF00FFFF' } };
    const thinBorder = { style: 'thin', color: { argb: 'FF999999' } };

    // Linha de totais
    for (let c = 1; c <= totalCols; c++) {
      const cell = ws.getRow(1).getCell(c);
      cell.fill = totalsFill;
      cell.font = { bold: true, color: { argb: 'FF0D47A1' } };
      cell.alignment = { horizontal: c === 1 ? 'right' : 'center', vertical: 'middle' };
      cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    }

    // Linha de cabeçalhos
    for (let c = 1; c <= totalCols; c++) {
      const cell = ws.getRow(2).getCell(c);
      const isCode = c > nMain && c <= nMain + nCode;
      cell.fill = isCode ? codeHeaderFill : mainHeaderFill;
      cell.font = { bold: true, color: { argb: isCode ? 'FFC6E0B4' : 'FFFFFFFF' } };
      cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    }

    // Linhas de dados
    for (let r = 3; r <= lastDataRow; r++) {
      for (let c = 1; c <= totalCols; c++) {
        const cell = ws.getRow(r).getCell(c);
        cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        // DATE, MAP, LOCATION (colunas 3, 4, 5) em verde-claro
        if (c >= 3 && c <= 5) cell.fill = dateMapLocFill;
        // Colunas de códigos (bloco inteiro) em ciano, igual ao padrão da planilha
        if (c > nMain && c <= nMain + nCode) cell.fill = codeDataFill;
      }
      // ASBUILT alinhado à esquerda, em negrito
      const asbuiltCell = ws.getRow(r).getCell(totalCols);
      asbuiltCell.alignment = { horizontal: 'left', vertical: 'middle' };
      asbuiltCell.font = { bold: true };
    }

    // Larguras de coluna
    ws.columns = headers.map((h, i) => ({
      width: i < nMain ? (i === 4 ? 14 : 11) : (i < nMain + nCode ? 9 : 22)
    }));

    // Congela as duas primeiras linhas (totais + cabeçalho) e ativa o filtro
    ws.views = [{ state: 'frozen', ySplit: 2 }];
    ws.autoFilter = `A2:${colLetter(totalCols)}2`;

    // ===== ADICIONA A(S) ABA(S) DE PENDINGS NO MESMO ARQUIVO =====
    // A comparação ignora maiúsculas/minúsculas e espaços nas pontas, pra não depender de
    // ter digitado o nome do mapa EXATAMENTE igual nas duas abas (Produção e Pendings).
    const normalizeMapName = (s) => (s || '').trim().toUpperCase();
    if (selectedMapProd === "ALL") {
      Object.keys(pendingsByMap).sort().forEach((mapName) => {
        buildPendingsSheet(wb, mapName, pendingsByMap[mapName]);
      });
    } else {
      const matchKey = Object.keys(pendingsByMap).find((k) => normalizeMapName(k) === normalizeMapName(selectedMapProd));
      if (matchKey) {
        buildPendingsSheet(wb, matchKey, pendingsByMap[matchKey]);
      }
    }

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    const mapSuffix = selectedMapProd === "ALL" ? "TODOS" : selectedMapProd.replace(/\s+/g, "_");
    link.download = `Producao_Asbuilt_${mapSuffix}_${new Date().toISOString().slice(0, 10)}.xlsx`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  // ===== EXPORTAR INVOICE (.XLSX) — dados da produção em cima + fechamento (TOTAL/PRICE/SUBTOTAL) embaixo =====
  const exportInvoiceXLSX = async () => {
    if (!window.ExcelJS) {
      alert('Biblioteca de exportação Excel ainda carregando, tente novamente em instantes.');
      return;
    }
    const mainHeaders = ["DATE", "MAP", "LOCATION", "SPLICE", "NAME", "TYPE", "TYPE2"];
    const codeHeaders = allCodeFields.map((f) => f.label);
    const headers = [...mainHeaders, ...codeHeaders];
    const nMain = mainHeaders.length;
    const nCode = codeHeaders.length;
    const totalCols = headers.length;
    const colLetter = (n) => {
      let s = '';
      while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
      return s;
    };
    // Data no padrão DD-MM-AA usado no modelo (ex: 08-04-26 = 08/abril/2026)
    const toDDMMYY = (isoDate) => {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      const [y, m, d] = parts;
      return `${d}-${m}-${y.slice(-2)}`;
    };

    const wb = new window.ExcelJS.Workbook();
    const ws = wb.addWorksheet('DADOS');

    // ----- CORES (fiéis ao modelo real da empresa) -----
    const companyFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9E2F3' } };
    const navyFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F3864' } };
    const titleFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF8EAADB' } };
    const bandFillA = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9E2F3' } };
    const bandFillB = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB4C6E7' } };
    const thinBorder = { style: 'thin', color: { argb: 'FF000000' } };
    const mediumBorder = { style: 'medium', color: { argb: 'FF000000' } };

    // ----- LINHAS 1-3: CABEÇALHO DA EMPRESA (mesclado) -----
    ws.mergeCells(1, 1, 3, totalCols);
    const companyCell = ws.getRow(1).getCell(1);
    companyCell.value = COMPANY_HEADER_TEXT;
    companyCell.fill = companyFill;
    companyCell.font = { name: 'Times New Roman', bold: true, size: 16 };
    companyCell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    companyCell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    [1, 2, 3].forEach((r) => { ws.getRow(r).height = 30; });

    // ----- LINHAS 4-5: RESPIRO EM BRANCO -----
    [4, 5].forEach((r) => { ws.getRow(r).height = 15; });

    // ----- LINHA 6: BARRA NAVY -----
    ws.mergeCells(6, 1, 6, totalCols);
    ws.getRow(6).getCell(1).fill = navyFill;
    ws.getRow(6).height = 15;

    // ----- LINHA 7: TÍTULO "N: 0000 / DAY: ..." — usa o período selecionado na Lista de Produção -----
    const dayLabel = (() => {
      if (rangeFrom && rangeTo) return rangeFrom === rangeTo ? toDDMMYY(rangeFrom) : `${toDDMMYY(rangeFrom)} A ${toDDMMYY(rangeTo)}`;
      if (rangeFrom) return toDDMMYY(rangeFrom);
      if (rangeTo) return toDDMMYY(rangeTo);
      const dates = invoiceSourceRows.map((r) => r.date).filter(Boolean).sort();
      return toDDMMYY(dates.length ? dates[dates.length - 1] : new Date().toISOString().slice(0, 10));
    })();
    ws.mergeCells(7, 1, 7, totalCols);
    const titleCell = ws.getRow(7).getCell(1);
    titleCell.value = `N: 0000 / DAY: ${dayLabel}`;
    titleCell.fill = titleFill;
    titleCell.font = { name: 'Times New Roman', bold: true, size: 16 };
    titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
    titleCell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };

    // ----- LINHA 8: CABEÇALHOS DAS COLUNAS -----
    ws.getRow(8).values = headers;
    for (let c = 1; c <= totalCols; c++) {
      const cell = ws.getRow(8).getCell(c);
      cell.font = { name: 'Times New Roman', size: 12 };
      cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      cell.border = { top: mediumBorder, bottom: mediumBorder, left: mediumBorder, right: mediumBorder };
    }

    // ----- LINHAS 9+: DADOS -----
    invoiceSourceRows.forEach((item, idx) => {
      const r = 9 + idx;
      const row = ws.getRow(r);
      const dateCell = row.getCell(1);
      if (item.date) {
        dateCell.value = new Date(`${item.date}T00:00:00`);
        dateCell.numFmt = 'dd/mm/yy';
      } else {
        dateCell.value = '';
      }
      row.getCell(2).value = item.map || '';
      row.getCell(3).value = item.location || '';
      row.getCell(4).value = item.splice || '';
      row.getCell(5).value = item.name || '';
      row.getCell(6).value = item.type || '';
      row.getCell(7).value = item.typeEnd || '';
      allCodeFields.forEach((f, i) => { row.getCell(nMain + 1 + i).value = item.codes?.[f.id] || ''; });
      row.height = 15.75;
    });

    const lastDataRow = 8 + invoiceSourceRows.length;

    // Zebra: faixas alternadas D9E2F3 / B4C6E7, uniformes em todas as colunas
    for (let r = 9; r <= lastDataRow; r++) {
      const band = (r % 2 === 1) ? bandFillA : bandFillB;
      for (let c = 1; c <= totalCols; c++) {
        const cell = ws.getRow(r).getCell(c);
        cell.fill = band;
        cell.font = { name: 'Times New Roman', size: 10 };
        cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
      }
    }

    // ===== BLOCO 2: FECHAMENTO / INVOICE (TOTAL, PRICE e tabela vertical) =====
    const miniHeaderFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2F5496' } };
    const miniTotalFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF9CC2E5' } };

    const miniStartRow = lastDataRow + 3; // deixa 2 linhas em branco de respiro
    const miniStartCol = nMain + 1;       // alinha as colunas dos códigos com o bloco de cima

    // Cabeçalho com os códigos
    for (let i = 0; i < nCode; i++) {

      cell.value = codeHeaders[i];
      cell.fill = miniHeaderFill;
      cell.font = { name: 'Times New Roman', bold: true, color: { argb: 'FFFFFFFF' } };
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
      cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    }
    // Rótulo "TOTAL" / "PRICE" na coluna anterior aos códigos
    ws.getRow(miniStartRow + 1).getCell(miniStartCol - 1).value = 'TOTAL';
    ws.getRow(miniStartRow + 2).getCell(miniStartCol - 1).value = 'PRICE';

    invoiceRows.forEach((r, i) => {
      const totalCell = ws.getRow(miniStartRow + 1).getCell(miniStartCol + i);
      totalCell.value = r.total;
      const priceCell = ws.getRow(miniStartRow + 2).getCell(miniStartCol + i);
      priceCell.value = r.price;
      priceCell.numFmt = '"$" #,##0.00';
      totalCell.fill = miniTotalFill;
      totalCell.font = { name: 'Times New Roman', bold: true };
      totalCell.alignment = { horizontal: 'center', vertical: 'middle' };
      totalCell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
      // PRICE não tem preenchimento (fica branco), igual ao modelo
      priceCell.font = { name: 'Times New Roman', bold: true };
      priceCell.alignment = { horizontal: 'center', vertical: 'middle' };
      priceCell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    });
    const totalLabelCell = ws.getRow(miniStartRow + 1).getCell(miniStartCol - 1);
    totalLabelCell.fill = miniTotalFill;
    totalLabelCell.font = { name: 'Times New Roman', bold: true };
    totalLabelCell.alignment = { horizontal: 'left', vertical: 'middle' };
    totalLabelCell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    const priceLabelCell = ws.getRow(miniStartRow + 2).getCell(miniStartCol - 1);
    priceLabelCell.font = { name: 'Times New Roman', bold: true };
    priceLabelCell.alignment = { horizontal: 'left', vertical: 'middle' };
    priceLabelCell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };

    // ----- TABELA VERTICAL (CÓDIGO / $), logo abaixo da mini-tabela, alinhada para terminar na última coluna -----
    const vStartRow = miniStartRow + 4; // 1 linha em branco de respiro após PRICE
    const valueCol = totalCols;         // coluna de valores termina alinhada com a última coluna
    const codeCol = totalCols - 1;      // coluna de rótulos (código) logo à esquerda
    invoiceRows.forEach((r, idx) => {
      const row = ws.getRow(vStartRow + idx);
      row.getCell(codeCol).value = r.label;
      row.getCell(valueCol).value = r.subtotal;
      row.getCell(codeCol).fill = miniTotalFill;
      row.getCell(valueCol).fill = miniTotalFill;
      row.getCell(codeCol).font = { name: 'Times New Roman', bold: true };
      row.getCell(valueCol).font = { name: 'Times New Roman', bold: true };
      row.getCell(codeCol).alignment = { horizontal: 'center', vertical: 'middle' };
      row.getCell(valueCol).alignment = { horizontal: 'right', vertical: 'middle' };
      row.getCell(valueCol).numFmt = '"$" #,##0.00';
      row.getCell(codeCol).border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
      row.getCell(valueCol).border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    });

    const subtotalRow = vStartRow + invoiceRows.length + 2;
    ws.getRow(subtotalRow).getCell(codeCol).value = 'TOTAL';
    ws.getRow(subtotalRow).getCell(valueCol).value = invoiceGrandTotal;
    ws.getRow(subtotalRow).getCell(codeCol).fill = navyFill;
    ws.getRow(subtotalRow).getCell(valueCol).fill = navyFill;
    ws.getRow(subtotalRow).getCell(codeCol).font = { name: 'Times New Roman', bold: true, color: { argb: 'FFFFFFFF' }, size: 16 };
    ws.getRow(subtotalRow).getCell(valueCol).font = { name: 'Times New Roman', bold: true, color: { argb: 'FFFFFFFF' }, size: 16 };
    ws.getRow(subtotalRow).getCell(codeCol).alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getRow(subtotalRow).getCell(valueCol).alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getRow(subtotalRow).getCell(valueCol).numFmt = '"$" #,##0.00';
    ws.getRow(subtotalRow).getCell(codeCol).border = { top: mediumBorder, bottom: mediumBorder, left: mediumBorder, right: mediumBorder };
    ws.getRow(subtotalRow).getCell(valueCol).border = { top: mediumBorder, bottom: mediumBorder, left: mediumBorder, right: mediumBorder };

    // Larguras de coluna (DATE, MAP, LOCATION, SPLICE, NAME, TYPE, TYPE2, códigos...)
    ws.columns = headers.map((h, i) => ({
      width: i === 0 ? 12 : i === 1 ? 14 : i === 2 ? 30 : i === 3 ? 12 : i === 4 ? 19 : i === 5 ? 16 : i === 6 ? 13 : 10
    }));

    // Congela até o cabeçalho de colunas e ativa o filtro no bloco de dados

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');

    const mapSuffix = selectedMapProd === "ALL" ? "TODOS" : selectedMapProd.replace(/\s+/g, "_");
    link.download = `Invoice_${mapSuffix}_DAY_${dayLabel.replace(/\s+/g, "_")}.xlsx`;

    document.body.removeChild(link);
    URL.revokeObjectURL(url);
