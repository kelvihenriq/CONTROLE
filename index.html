  // ===== EXPORTAR INVOICE (.XLSX) — dados da produção em cima + fechamento (TOTAL/PRICE/SUBTOTAL) embaixo =====
  const exportInvoiceXLSX = async () => {
    if (!window.ExcelJS) {
      alert('Biblioteca de exportação Excel ainda carregando, tente novamente em instantes.');
      return;
    }
    const mainHeaders = ["DATE", "MAP", "LOCATION", "SPLICE", "NAME", "TYPE", "TYPE2"];
    const codeHeaders = CODE_FIELDS.map((f) => f.label);
    const headers = [...mainHeaders, ...codeHeaders];
    const nMain = mainHeaders.length;
    const nCode = codeHeaders.length;
    const totalCols = headers.length;
    const colLetter = (n) => {
      let s = '';
      while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
      return s;
    };
    // Data no padrão DD-MM-AA usado no modelo (ex: 08-04-26 = 08/abril/2026)
    const toDDMMYY = (isoDate) => {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      const [y, m, d] = parts;
      return `${d}-${m}-${y.slice(-2)}`;
    };

    const wb = new window.ExcelJS.Workbook();
    const ws = wb.addWorksheet('DADOS');

    // ----- CORES (fiéis ao modelo real da empresa) -----
    const companyFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9E2F3' } };
    const navyFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F3864' } };
    const titleFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF8EAADB' } };
    const bandFillA = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9E2F3' } };
    const bandFillB = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB4C6E7' } };
    const thinBorder = { style: 'thin', color: { argb: 'FF000000' } };
    const mediumBorder = { style: 'medium', color: { argb: 'FF000000' } };

    // ----- LINHAS 1-3: CABEÇALHO DA EMPRESA (mesclado) -----
    ws.mergeCells(1, 1, 3, totalCols);
    const companyCell = ws.getRow(1).getCell(1);
    companyCell.value = COMPANY_HEADER_TEXT;
    companyCell.fill = companyFill;
    companyCell.font = { name: 'Times New Roman', bold: true, size: 16 };
    companyCell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    companyCell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    [1, 2, 3].forEach((r) => { ws.getRow(r).height = 30; });

    // ----- LINHAS 4-5: RESPIRO EM BRANCO -----
    [4, 5].forEach((r) => { ws.getRow(r).height = 15; });

    // ----- LINHA 6: BARRA NAVY -----
    ws.mergeCells(6, 1, 6, totalCols);
    ws.getRow(6).getCell(1).fill = navyFill;
    ws.getRow(6).height = 15;

    // ----- LINHA 7: TÍTULO "N: 0000 / DAY: ..." — usa o período selecionado na Lista de Produção -----
    const dayLabel = (() => {
      if (rangeFrom && rangeTo) return rangeFrom === rangeTo ? toDDMMYY(rangeFrom) : `${toDDMMYY(rangeFrom)} A ${toDDMMYY(rangeTo)}`;
      if (rangeFrom) return toDDMMYY(rangeFrom);
      if (rangeTo) return toDDMMYY(rangeTo);
      const dates = invoiceSourceRows.map((r) => r.date).filter(Boolean).sort();
      return toDDMMYY(dates.length ? dates[dates.length - 1] : new Date().toISOString().slice(0, 10));
    })();
    ws.mergeCells(7, 1, 7, totalCols);
    const titleCell = ws.getRow(7).getCell(1);
    titleCell.value = `N: 0000 / DAY: ${dayLabel}`;
    titleCell.fill = titleFill;
    titleCell.font = { name: 'Times New Roman', bold: true, size: 16 };
    titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
    titleCell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    ws.getRow(7).height = 21.75;

    // ----- LINHA 8: CABEÇALHOS DAS COLUNAS -----
    ws.getRow(8).values = headers;
    for (let c = 1; c <= totalCols; c++) {
      const cell = ws.getRow(8).getCell(c);
      cell.font = { name: 'Times New Roman', size: 12 };
      cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      cell.border = { top: mediumBorder, bottom: mediumBorder, left: mediumBorder, right: mediumBorder };
    }

    // ----- LINHAS 9+: DADOS -----
    invoiceSourceRows.forEach((item, idx) => {
      const r = 9 + idx;
      const row = ws.getRow(r);
      const dateCell = row.getCell(1);
      if (item.date) {
        dateCell.value = new Date(`${item.date}T00:00:00`);
        dateCell.numFmt = 'dd/mm/yy';
      } else {
        dateCell.value = '';
      }
      row.getCell(2).value = item.map || '';
      row.getCell(3).value = item.location || '';
      row.getCell(4).value = item.splice || '';
      row.getCell(5).value = item.name || '';
      row.getCell(6).value = item.type || '';
      row.getCell(7).value = item.typeEnd || '';
      CODE_FIELDS.forEach((f, i) => { row.getCell(nMain + 1 + i).value = item.codes?.[f.id] || ''; });
      row.height = 15.75;
    });

    const lastDataRow = 8 + invoiceSourceRows.length;

    // Zebra: faixas alternadas D9E2F3 / B4C6E7, uniformes em todas as colunas
    for (let r = 9; r <= lastDataRow; r++) {
      const band = (r % 2 === 1) ? bandFillA : bandFillB;
      for (let c = 1; c <= totalCols; c++) {
        const cell = ws.getRow(r).getCell(c);
        cell.fill = band;
        cell.font = { name: 'Times New Roman', size: 10 };
        cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
      }
    }

    // ===== BLOCO 2: FECHAMENTO / INVOICE (TOTAL, PRICE e tabela vertical) =====
    const miniHeaderFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2F5496' } };
    const miniTotalFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF9CC2E5' } };

    const miniStartRow = lastDataRow + 3; // deixa 2 linhas em branco de respiro
    const miniStartCol = nMain + 1;       // alinha as colunas dos códigos com o bloco de cima

    // Cabeçalho com os códigos
    for (let i = 0; i < nCode; i++) {
      const cell = ws.getRow(miniStartRow).getCell(miniStartCol + i);
      cell.value = codeHeaders[i];
      cell.fill = miniHeaderFill;
      cell.font = { name: 'Times New Roman', bold: true, color: { argb: 'FFFFFFFF' } };
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
      cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    }
    // Rótulo "TOTAL" / "PRICE" na coluna anterior aos códigos
    ws.getRow(miniStartRow + 1).getCell(miniStartCol - 1).value = 'TOTAL';
    ws.getRow(miniStartRow + 2).getCell(miniStartCol - 1).value = 'PRICE';

    invoiceRows.forEach((r, i) => {
      const totalCell = ws.getRow(miniStartRow + 1).getCell(miniStartCol + i);
      totalCell.value = r.total;
      const priceCell = ws.getRow(miniStartRow + 2).getCell(miniStartCol + i);
      priceCell.value = r.price;
      priceCell.numFmt = '"$" #,##0.00';
      totalCell.fill = miniTotalFill;
      totalCell.font = { name: 'Times New Roman', bold: true };
      totalCell.alignment = { horizontal: 'center', vertical: 'middle' };
      totalCell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
      // PRICE não tem preenchimento (fica branco), igual ao modelo
      priceCell.font = { name: 'Times New Roman', bold: true };
      priceCell.alignment = { horizontal: 'center', vertical: 'middle' };
      priceCell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    });
    const totalLabelCell = ws.getRow(miniStartRow + 1).getCell(miniStartCol - 1);
    totalLabelCell.fill = miniTotalFill;
    totalLabelCell.font = { name: 'Times New Roman', bold: true };
    totalLabelCell.alignment = { horizontal: 'left', vertical: 'middle' };
    totalLabelCell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    const priceLabelCell = ws.getRow(miniStartRow + 2).getCell(miniStartCol - 1);
    priceLabelCell.font = { name: 'Times New Roman', bold: true };
    priceLabelCell.alignment = { horizontal: 'left', vertical: 'middle' };
    priceLabelCell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };

    // ----- TABELA VERTICAL (CÓDIGO / $), logo abaixo da mini-tabela, alinhada para terminar na última coluna -----
    const vStartRow = miniStartRow + 4; // 1 linha em branco de respiro após PRICE
    const valueCol = totalCols;         // coluna de valores termina alinhada com a última coluna
    const codeCol = totalCols - 1;      // coluna de rótulos (código) logo à esquerda
    invoiceRows.forEach((r, idx) => {
      const row = ws.getRow(vStartRow + idx);
      row.getCell(codeCol).value = r.label;
      row.getCell(valueCol).value = r.subtotal;
      row.getCell(codeCol).fill = miniTotalFill;
      row.getCell(valueCol).fill = miniTotalFill;
      row.getCell(codeCol).font = { name: 'Times New Roman', bold: true };
      row.getCell(valueCol).font = { name: 'Times New Roman', bold: true };
      row.getCell(codeCol).alignment = { horizontal: 'center', vertical: 'middle' };
      row.getCell(valueCol).alignment = { horizontal: 'right', vertical: 'middle' };
      row.getCell(valueCol).numFmt = '"$" #,##0.00';
      row.getCell(codeCol).border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
      row.getCell(valueCol).border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    });

    const subtotalRow = vStartRow + invoiceRows.length + 2;
    ws.getRow(subtotalRow).getCell(codeCol).value = 'TOTAL';
    ws.getRow(subtotalRow).getCell(valueCol).value = invoiceGrandTotal;
    ws.getRow(subtotalRow).getCell(codeCol).fill = navyFill;
    ws.getRow(subtotalRow).getCell(valueCol).fill = navyFill;
    ws.getRow(subtotalRow).getCell(codeCol).font = { name: 'Times New Roman', bold: true, color: { argb: 'FFFFFFFF' }, size: 16 };
    ws.getRow(subtotalRow).getCell(valueCol).font = { name: 'Times New Roman', bold: true, color: { argb: 'FFFFFFFF' }, size: 16 };
    ws.getRow(subtotalRow).getCell(codeCol).alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getRow(subtotalRow).getCell(valueCol).alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getRow(subtotalRow).getCell(valueCol).numFmt = '"$" #,##0.00';
    ws.getRow(subtotalRow).getCell(codeCol).border = { top: mediumBorder, bottom: mediumBorder, left: mediumBorder, right: mediumBorder };
    ws.getRow(subtotalRow).getCell(valueCol).border = { top: mediumBorder, bottom: mediumBorder, left: mediumBorder, right: mediumBorder };

    // Larguras de coluna (DATE, MAP, LOCATION, SPLICE, NAME, TYPE, TYPE2, códigos...)
    ws.columns = headers.map((h, i) => ({
      width: i === 0 ? 12 : i === 1 ? 14 : i === 2 ? 30 : i === 3 ? 12 : i === 4 ? 19 : i === 5 ? 16 : i === 6 ? 13 : 10
    }));

    // Congela até o cabeçalho de colunas e ativa o filtro no bloco de dados
    ws.views = [{ state: 'frozen', ySplit: 8 }];
    ws.autoFilter = `A8:${colLetter(totalCols)}8`;

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    const mapSuffix = selectedMapProd === "ALL" ? "TODOS" : selectedMapProd.replace(/\s+/g, "_");
    link.download = `Invoice_${mapSuffix}_DAY_${dayLabel.replace(/\s+/g, "_")}.xlsx`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  // ===== EXPORTAR .XLSX COLORIDO DA TABELA "CONTROLE GERAL DE PRODUÇÃO E DOCUMENTAÇÃO" =====
  // Reutilizável: recebe a lista de itens e o nome-base do arquivo, para servir tanto o botão
  // "Exportar XLSX" (itens filtrados na tela) quanto a exportação automática do mês inteiro
  // ao clicar em "Novo Mês (Resetar Semanas)".
  const exportGeneralXLSXForItems = async (items, filenameBase) => {
    if (!window.ExcelJS) {
      alert('Biblioteca de exportação Excel ainda carregando, tente novamente em instantes.');
      return;
    }
    const headers = [
      "SEMANA", "ENTREGA", "MAPA / CÓDIGO", "OTS PENDENTES",
      "AS-BUILT STATUS", "AS-BUILT TÉCNICO", "AS-BUILT DATA",
      "INVOICE STATUS", "INVOICE TÉCNICO", "INVOICE DATA",
      "WORKBOOK STATUS", "WORKBOOK TÉCNICO", "WORKBOOK DATA",
      "STATUS GERAL", "OBSERVAÇÕES"
    ];
    const totalCols = headers.length;
    const colLetter = (n) => {
      let s = '';
      while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
      return s;
    };

    const stageLabel = (st) => (st === "OK" || st === "SIM") ? "ATUALIZADO" : (st === "FAZENDO" ? "FAZENDO" : "PENDENTE");
    const generalLabel = (st) => st === "OK" ? "PRONTO" : (st === "PENDING_REVISION" ? "REVISÃO NECESSÁRIA" : "SEM ATUALIZAÇÃO");
    const weekLabel = (cycleId) => (WEEK_OPTIONS.find(w => w.id === cycleId) || {}).label || cycleId || '';

    const wb = new window.ExcelJS.Workbook();
    const ws = wb.addWorksheet('Controle Geral');

    // ----- LINHA 1: CABEÇALHOS -----
    ws.getRow(1).values = headers;

    // ----- LINHAS 2+: DADOS -----
    items.forEach((item, idx) => {
      ws.getRow(2 + idx).values = [
        weekLabel(item.cycle), item.deliveryDay || '', item.map || '', item.otCount || 0,
        stageLabel(item.asbuiltStatus), item.asbuiltTech || '', item.asbuiltDate || '',
        stageLabel(item.invoiceStatus), item.invoiceTech || '', item.invoiceDate || '',
        stageLabel(item.workbookStatus), item.workbookTech || '', item.workbookDate || '',
        generalLabel(item.status), item.note || ''
      ];
    });

    const lastDataRow = 1 + items.length;

    // ----- CORES -----
    const headerFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0D1117' } };
    const greenFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFC6EFCE' } };
    const greenFont = { color: { argb: 'FF1E7A34' }, bold: true };
    const amberFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFEB9C' } };
    const amberFont = { color: { argb: 'FF9C6500' }, bold: true };
    const redFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFC7CE' } };
    const redFont = { color: { argb: 'FF9C0006' }, bold: true };
    const grayFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE5E5E5' } };
    const grayFont = { color: { argb: 'FF666666' } };
    const otFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB3E5FC' } };
    const thinBorder = { style: 'thin', color: { argb: 'FF999999' } };

    // Cabeçalho
    for (let c = 1; c <= totalCols; c++) {
      const cell = ws.getRow(1).getCell(c);
      cell.fill = headerFill;
      cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
      cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    }

    // Colunas com status (AS-BUILT, INVOICE, WORKBOOK, GERAL) coloridas por cor de andamento
    const stageStatusCols = [5, 8, 11]; // AS-BUILT / INVOICE / WORKBOOK status (agora deslocadas +1 pela coluna SEMANA)
    const generalStatusCol = 14;

    for (let r = 2; r <= lastDataRow; r++) {
      const item = items[r - 2];
      for (let c = 1; c <= totalCols; c++) {
        const cell = ws.getRow(r).getCell(c);
        cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
        cell.alignment = { horizontal: c === totalCols ? 'left' : 'center', vertical: 'middle', wrapText: c === totalCols };
      }
      // OTs pendentes em destaque
      const otCell = ws.getRow(r).getCell(4);
      otCell.fill = otFill;
      otCell.font = { bold: true };

      // Colore cada coluna de status (AS-BUILT, INVOICE, WORKBOOK) conforme o andamento
      const stageStatuses = [item.asbuiltStatus, item.invoiceStatus, item.workbookStatus];
      stageStatusCols.forEach((colIdx, i) => {
        const st = stageStatuses[i];
        const cell = ws.getRow(r).getCell(colIdx);
        if (st === "OK" || st === "SIM") { cell.fill = greenFill; cell.font = greenFont; }
        else if (st === "FAZENDO") { cell.fill = amberFill; cell.font = amberFont; }
        else { cell.fill = redFill; cell.font = redFont; }
      });

      // Colore a coluna de Status Geral
      const gCell = ws.getRow(r).getCell(generalStatusCol);
      if (item.status === "OK") { gCell.fill = greenFill; gCell.font = greenFont; }
      else if (item.status === "PENDING_REVISION") { gCell.fill = redFill; gCell.font = redFont; }
      else { gCell.fill = grayFill; gCell.font = grayFont; }
    }

    // Larguras de coluna
    ws.columns = headers.map((h, i) => {
      if (i === 2) return { width: 22 }; // MAPA / CÓDIGO
      if (i === totalCols - 1) return { width: 30 }; // OBSERVAÇÕES
      if (i === 13) return { width: 18 }; // STATUS GERAL
      return { width: 13 };
    });

    // Congela o cabeçalho e ativa o filtro
    ws.views = [{ state: 'frozen', ySplit: 1 }];
    ws.autoFilter = `A1:${colLetter(totalCols)}1`;

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${filenameBase}_${new Date().toISOString().slice(0, 10)}.xlsx`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

// ===== IMPORTAÇÃO EM MASSA (COLAR DO EXCEL) NA ABA DE PRODUÇÃO =====
// Aceita datas como 07/31/26, 7/31/2026, ou até com typo de barra dupla (08//02/26)
function parsePastedDate(raw) {
  if (!raw) return "";
  const digits = String(raw).match(/\d+/g);
  if (!digits || digits.length < 3) return "";
  let [a, b, c] = digits;
  let month = parseInt(a, 10);
  let day = parseInt(b, 10);
  let year = parseInt(c, 10);
  if (year < 100) year += 2000;
  if (month < 1 || month > 12 || day < 1 || day > 31) return "";
  return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

function splitPastedCells(line) {
  let cells = line.split('\t');
  if (cells.length < 2) cells = line.split(/\s{2,}/);
  return cells.map((c) => (c || '').trim());
}

// Transforma o texto colado (DATE, MAP, LOCATION, SPLICE, NAME, TYPE, TYPE [+ códigos opcionais])
// em linhas prontas. Ignora automaticamente cabeçalho, linhas em branco e separadores (ex: "END
// INVOICE"), já que essas não têm uma data válida na primeira coluna.
//
// Se vier colunas extras depois da 7ª (códigos tipo US01, FS01, FS02...), elas também são
// importadas: se a 1ª linha colada tiver os nomes dos códigos como cabeçalho, usa isso pra saber
// qual coluna é qual código (funciona em qualquer ordem); se não tiver cabeçalho reconhecível,
// assume a ordem padrão dos códigos do sistema (a mesma da Lista de Produção).
function parsePastedProductionRows(text) {
  if (!text) return [];
  const lines = text.split(/\r?\n/).filter((l) => l.trim());
  if (lines.length === 0) return [];

  let codeColumnMap = null; // { índiceDaColuna: idDoCódigo }
  let startIdx = 0;
  const firstCells = splitPastedCells(lines[0]);
  const isHeaderRow = /^date$/i.test(firstCells[0] || '') ||
    firstCells.slice(7).some((c) => CODE_FIELDS.some((f) => f.id.toUpperCase() === (c || '').toUpperCase()));

  if (isHeaderRow) {
    codeColumnMap = {};
    firstCells.forEach((cellText, idx) => {
      if (idx < 7) return;
      const match = CODE_FIELDS.find((f) => f.id.toUpperCase() === (cellText || '').toUpperCase());
      if (match) codeColumnMap[idx] = match.id;
    });
    startIdx = 1;
  }

  const rows = [];
  for (let i = startIdx; i < lines.length; i++) {
    const cells = splitPastedCells(lines[i]);
    const [dateRaw, map, location, splice, name, type, typeEnd] = cells;
    if (!dateRaw) continue;
    if (/^date$/i.test(dateRaw)) continue; // linha de cabeçalho colada junto (sem ter sido detectada como a 1ª)
    const date = parsePastedDate(dateRaw);
    if (!date) continue; // sem data válida = separador/rótulo, ignora

    const codes = {};
    if (codeColumnMap) {
      Object.keys(codeColumnMap).forEach((idxStr) => {
        const idx = parseInt(idxStr, 10);
        const val = (cells[idx] || '').trim();
        if (val !== '') codes[codeColumnMap[idx]] = val;
      });
    } else if (cells.length > 7) {
      // Sem cabeçalho identificável: assume a ordem padrão dos códigos do sistema
      CODE_FIELDS.forEach((f, offset) => {
        const val = (cells[7 + offset] || '').trim();
        if (val !== '') codes[f.id] = val;
      });
    }

    rows.push({
      date, map: map || '', location: location || '', splice: splice || '',
      name: name || '', type: type || 'AERIAL', typeEnd: typeEnd || 'END', codes
    });
  }
  return rows;
}

function PasteImportModal({ onClose, onImport }) {
  const [text, setText] = useState('');
  const rows = useMemo(() => parsePastedProductionRows(text), [text]);

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }}>
      <div style={{ background: C.panel, border: `1px solid ${C.border2}`, borderRadius: 8, padding: 20, width: 740, maxHeight: "90vh", overflowY: "auto", display: "flex", flexDirection: "column", gap: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `1px solid ${C.border}`, paddingBottom: 10 }}>
          <div style={{ fontFamily: FONT_HEAD, fontSize: 15, fontWeight: 700, color: C.accent }}>Colar Dados do Excel</div>
          <X size={16} color={C.textDim} style={{ cursor: "pointer" }} onClick={onClose} />
        </div>

        <div style={{ fontSize: 11, color: C.textDim, lineHeight: 1.6 }}>
          Copia (Ctrl+C) as colunas <strong style={{ color: C.text }}>DATE, MAP, LOCATION, SPLICE, NAME, TYPE, TYPE</strong> direto do Excel/Google Sheets — e se quiser, inclui também as colunas de código (<strong style={{ color: C.text }}>US01, FS01, FS02...</strong>) que elas são preenchidas sozinhas.
          Se você copiar junto a linha de cabeçalho (com os nomes das colunas), o sistema usa ela pra saber qual coluna é qual código, então funciona mesmo se a ordem for diferente da do sistema.
          Sem cabeçalho, ele assume a ordem padrão dos códigos. Linhas sem data válida (cabeçalho perdido, "END INVOICE" etc.) são ignoradas automaticamente.
        </div>

        <textarea
          autoFocus
          value={text}
          onChange={(e) => setText(e.target.value)}
          placeholder={"Cole aqui as linhas copiadas do Excel...\nEx: 08/03/26    JS98E    SE 025    3    ODAIR GOMES    AERIAL    RING CUT"}
          style={{ width: "100%", minHeight: 160, background: C.panel2, color: C.text, border: `1px solid ${C.border2}`, borderRadius: 6, padding: 10, fontSize: 11, fontFamily: "'JetBrains Mono', monospace", outline: "none", resize: "vertical", boxSizing: "border-box" }}
        />

        <div style={{ fontSize: 11, fontWeight: 700, color: rows.length > 0 ? C.green : C.textFaint }}>
          {rows.length > 0 ? `✓ ${rows.length} linha(s) detectada(s) e prontas pra importar.` : "Nenhuma linha válida detectada ainda — cola os dados acima."}
        </div>

        {rows.length > 0 && (
          <div style={{ maxHeight: 220, overflowY: "auto", border: `1px solid ${C.border2}`, borderRadius: 6 }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 10.5 }}>
              <thead>
                <tr style={{ background: C.panel2 }}>
                  {["DATA", "MAPA", "LOCAL", "SPLICE", "NOME", "TYPE", "TYPE", "CÓDIGOS"].map((h) => (
                    <th key={h} style={{ padding: "6px 8px", textAlign: "left", color: C.textDim, borderBottom: `1px solid ${C.border2}`, position: "sticky", top: 0, background: C.panel2 }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.slice(0, 50).map((r, i) => {
                  const codeEntries = Object.entries(r.codes || {}).filter(([, v]) => v !== '');
                  return (
                    <tr key={i} style={{ borderBottom: `1px solid ${C.borderSoft}` }}>
                      <td style={{ padding: "5px 8px", color: C.text }}>{r.date}</td>
                      <td style={{ padding: "5px 8px", color: C.text }}>{r.map}</td>
                      <td style={{ padding: "5px 8px", color: C.text }}>{r.location}</td>
                      <td style={{ padding: "5px 8px", color: C.text }}>{r.splice}</td>
                      <td style={{ padding: "5px 8px", color: C.text }}>{r.name}</td>
                      <td style={{ padding: "5px 8px", color: C.text }}>{r.type}</td>
                      <td style={{ padding: "5px 8px", color: C.text }}>{r.typeEnd}</td>
                      <td style={{ padding: "5px 8px", color: codeEntries.length > 0 ? C.accent : C.textFaint, fontWeight: codeEntries.length > 0 ? 700 : 400 }}>
                        {codeEntries.length > 0 ? codeEntries.map(([k, v]) => `${k}:${v}`).join(', ') : '—'}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {rows.length > 50 && <div style={{ padding: 8, fontSize: 10, color: C.textFaint, textAlign: "center" }}>+ {rows.length - 50} linha(s) a mais...</div>}
          </div>
        )}

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <button onClick={onClose} style={{ background: C.panel2, border: `1px solid ${C.border2}`, color: C.textDim, borderRadius: 5, padding: "8px 14px", fontSize: 11, cursor: "pointer" }}>Cancelar</button>
          <button
            disabled={rows.length === 0}
            onClick={() => onImport(rows)}
            style={{ background: rows.length > 0 ? C.accent : C.panel2, color: rows.length > 0 ? "#000" : C.textFaint, border: "none", borderRadius: 5, padding: "8px 18px", fontSize: 11, fontWeight: 800, cursor: rows.length > 0 ? "pointer" : "not-allowed" }}
          >
            Importar {rows.length > 0 ? `${rows.length} Registro(s)` : ""}
          </button>
        </div>
      </div>
    </div>
  );
}

function ProductionModal({ initial, onClose, onSave }) {
  const [form, setForm] = useState(() => initial || {
    daily: "",
    pendings: "NO HUNG",
    date: new Date().toISOString().slice(0, 10),
    map: "",
    location: "",
    splice: "",
    name: "",
    type: "AERIAL",
    typeEnd: "END",
    codes: { US01: '', FS01: '', FS02: '', FS03: '', FS07A: '', FS08: '', FS16: '', FS04: '', MC01A: '' }
  });

  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));
  const setCode = (codeId) => (e) => {
    const val = e.target.value;
    setForm(f => ({ ...f, codes: { ...f.codes, [codeId]: val } }));
  };

  const generatedPreview = computeAsbuiltFormat(form.codes);

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }}>
      <div style={{ background: C.panel, border: `1px solid ${C.border2}`, borderRadius: 8, padding: 20, width: 700, maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, borderBottom: `1px solid ${C.border}`, paddingBottom: 10 }}>
          <div style={{ fontFamily: FONT_HEAD, fontSize: 15, fontWeight: 700, color: C.green }}>
            {initial ? `Editar Produção: ${initial.map} - ${initial.location}` : "Adicionar Novo Item de Produção"}
          </div>
          <X size={16} color={C.textFaint} style={{ cursor: "pointer" }} onClick={onClose} />
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10, marginBottom: 14 }}>
          <Field label="Pendings"><Input value={form.pendings} onChange={set("pendings")} /></Field>
          <Field label="Data"><Input type="date" value={form.date} onChange={set("date")} /></Field>
          <Field label="Map / Código"><Input value={form.map} onChange={set("map")} placeholder="Ex: GT057E" /></Field>
          <Field label="Location"><Input value={form.location} onChange={set("location")} placeholder="Ex: SE 025" /></Field>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 10, marginBottom: 16 }}>
          <Field label="Splice"><Input value={form.splice} onChange={set("splice")} placeholder="Ex: 48" /></Field>
          <Field label="Técnico / Name"><Input value={form.name} onChange={set("name")} placeholder="Ex: ROBSON" /></Field>
          <Field label="Type"><Input value={form.type} onChange={set("type")} placeholder="Ex: AERIAL" /></Field>
          <Field label="Type End"><Input value={form.typeEnd} onChange={set("typeEnd")} placeholder="Ex: END" /></Field>
        </div>

        <div style={{ background: C.panel2, border: `1px solid ${C.border2}`, padding: 14, borderRadius: 6, marginBottom: 16 }}>
          <div style={{ fontWeight: 700, color: C.amber, fontSize: 11, marginBottom: 10, textTransform: "uppercase" }}>
            CÓDIGOS & QUANTIDADES
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 10 }}>
            {CODE_FIELDS.map(f => (
              <Field key={f.id} label={f.label}>
                <Input type="number" placeholder="0" value={form.codes?.[f.id] || ''} onChange={setCode(f.id)} />
              </Field>
            ))}
          </div>
        </div>

        <div style={{ background: "rgba(0, 212, 255, 0.08)", border: `1px solid ${C.accent}`, padding: 12, borderRadius: 6, marginBottom: 16 }}>
          <div style={{ fontSize: 9.5, color: C.textDim, textTransform: "uppercase", marginBottom: 4 }}>
            Resultado Formatado Automaticamente para a coluna ASBUILT:
          </div>
          <div style={{ fontSize: 15, fontWeight: 800, color: C.accent }}>
            {generatedPreview || <span style={{ color: C.textFaint, fontSize: 12 }}>(Preencha as quantidades dos códigos)</span>}
          </div>
        </div>

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <button onClick={onClose} style={{ background: C.panel2, border: `1px solid ${C.border2}`, color: C.textDim, borderRadius: 5, padding: "8px 14px", fontSize: 11, cursor: "pointer" }}>Cancelar</button>
          <button onClick={() => onSave(form)} style={{ background: C.green, color: "#000", border: "none", borderRadius: 5, padding: "8px 16px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Salvar Registro</button>
        </div>
      </div>
    </div>
  );
}

function ItemModal({ initial, mode = "GENERAL", openWeek, onClose, onSave }) {
  const today = new Date().toISOString().slice(0, 10);
  const [addOtInput, setAddOtInput] = useState("");
  const isQueueMode = mode === "QUEUE";

  const [form, setForm] = useState(() => initial || {
    deliveryDay: "QUINTA",
    cycle: openWeek || "SEMANA_1",
    map: "",
    status: "NO_UPDATE",
    otCount: 0,
    asbuiltStatus: "PENDENTE",
    asbuiltDate: "",
    asbuiltTech: "",
    invoiceStatus: "PENDENTE",
    invoiceDate: "",
    invoiceTech: "",
    workbookStatus: "PENDENTE",
    workbookDate: "",
    workbookTech: "",
    note: ""
  });

  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  const addFormHistoryToday = (stage) => {
    const historyKey = `${stage}History`;
    const dateKey = `${stage}Date`;
    const techKey = `${stage}Tech`;
    setForm((f) => {
      const currentHistory = Array.isArray(f[historyKey]) ? f[historyKey] : [];
      if (historyHasDate(currentHistory, today)) return f;
      const entry = { date: today, tech: (f[techKey] || '').trim() };
      return { ...f, [historyKey]: [...currentHistory, entry], [dateKey]: today };
    });
  };

  const handleAddOt = () => {
    const qty = parseInt(addOtInput, 10);
    if (!qty || isNaN(qty) || qty <= 0) return;
    setForm(f => ({ ...f, otCount: (Number(f.otCount) || 0) + qty }));
    setAddOtInput("");
  };

  const handleAsBuiltStatusChange = (e) => {
    const val = e.target.value;
    const countsAsActivity = val === "OK" || val === "FAZENDO";

    // Exige o nome do técnico ANTES de deixar marcar FAZENDO/ATUALIZADO — assim o mapa já
    // fica "pegado" por quem vai executar, e esse nome é reaproveitado quando finalizar.
    if (countsAsActivity && !(form.asbuiltTech || '').trim()) {
      alert('Preencha o campo "Seu Nome (Técnico)" antes de marcar FAZENDO ou ATUALIZADO.');
      return;
    }

    setForm(f => {
      // Marcar FAZENDO ou ATUALIZADO (OK) já conta como atividade do dia no Ciclo (Sáb-Sex),
      // sem precisar clicar manualmente em "+Hoje" depois no Controle Geral.
      const currentHistory = Array.isArray(f.asbuiltHistory) ? f.asbuiltHistory : [];
      const asbuiltHistory = countsAsActivity && !historyHasDate(currentHistory, today)
        ? [...currentHistory, { date: today, tech: (f.asbuiltTech || '').trim() }]
        : currentHistory;
      return {
        ...f,
        asbuiltStatus: val,
        asbuiltDate: countsAsActivity && !f.asbuiltDate ? today : f.asbuiltDate,
        asbuiltHistory,
        // OTs pendentes só zeram quando marcado como ATUALIZADO (OK) — "FAZENDO" mantém a fila.
        otCount: val === "OK" ? 0 : f.otCount
      };
    });
  };

  const handleWorkbookStatusChange = (e) => {
    const val = e.target.value;
    setForm(f => ({ 
      ...f, 
      workbookStatus: val, 
      workbookDate: val === "SIM" && !f.workbookDate ? today : f.workbookDate 
    }));
  };

  const handleInvoiceStatusChange = (e) => {
    const val = e.target.value;
    setForm(f => ({ 
      ...f, 
      invoiceStatus: val, 
      invoiceDate: val === "SIM" && !f.invoiceDate ? today : f.invoiceDate 
    }));
  };

  // ===== MODO "FILA DE PRIORIDADE": modal enxuto, só para atualização diária do AS-BUILT =====
  if (isQueueMode) {
    return (
      <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }}>
        <div style={{ background: C.panel, border: `1px solid ${C.border2}`, borderRadius: 8, padding: 20, width: 420, maxHeight: "90vh", overflowY: "auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6, borderBottom: `1px solid ${C.border}`, paddingBottom: 10 }}>
            <div style={{ fontFamily: FONT_HEAD, fontSize: 15, fontWeight: 700, color: C.accent }}>Atualizar AS-BUILT: {form.map}</div>
            <X size={16} color={C.textFaint} style={{ cursor: "pointer" }} onClick={onClose} />
          </div>
          <div style={{ fontSize: 10, color: C.textDim, marginBottom: 14, lineHeight: 1.5 }}>
            Marque <strong style={{ color: C.amber }}>FAZENDO</strong> assim que começar (assim ninguém mais pega esse mapa), e <strong style={{ color: C.green }}>ATUALIZADO</strong> quando terminar. As OTs pendentes só somem quando marcar ATUALIZADO.
          </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "rgba(255,82,82,0.08)", border: `1px solid ${C.red}`, padding: "8px 12px", borderRadius: 6, marginBottom: 14 }}>
            <span style={{ fontSize: 10.5, color: C.textDim, fontWeight: 700, textTransform: "uppercase" }}>OTs Pendentes</span>
            <span style={{ fontSize: 16, fontWeight: 800, color: C.red }}>{form.otCount}</span>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <Field label="Status AS-BUILT">
              <select value={form.asbuiltStatus} onChange={handleAsBuiltStatusChange} style={{ background: C.panel2, color: C.text, border: `1px solid ${C.border2}`, borderRadius: 5, padding: "8px", fontSize: 11, outline: "none" }}>
                <option value="PENDENTE">PENDENTE</option>
                <option value="FAZENDO">FAZENDO (Em Andamento)</option>
                <option value="OK">ATUALIZADO (OK)</option>
              </select>
            </Field>
            <Field label="Seu Nome (Técnico)"><Input placeholder="Nome de quem está atualizando..." value={form.asbuiltTech} onChange={set("asbuiltTech")} /></Field>
            <Field label="Data"><Input type="date" value={form.asbuiltDate} onChange={set("asbuiltDate")} /></Field>
          </div>

          <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 20 }}>
            <button onClick={onClose} style={{ background: C.panel2, border: `1px solid ${C.border2}`, color: C.textDim, borderRadius: 5, padding: "8px 14px", fontSize: 11, cursor: "pointer" }}>Cancelar</button>
            <button onClick={() => onSave(form)} style={{ background: C.accent, color: "#000", border: "none", borderRadius: 5, padding: "8px 16px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Salvar Atualização</button>
          </div>
        </div>
      </div>
    );
  }

  // ===== MODO "GERAL": cadastro/edição do item (sem edição de AS-BUILT — isso é feito só pela Fila de Prioridade) =====
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }}>
      <div style={{ background: C.panel, border: `1px solid ${C.border2}`, borderRadius: 8, padding: 20, width: 620, maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, borderBottom: `1px solid ${C.border}`, paddingBottom: 10 }}>
          <div style={{ fontFamily: FONT_HEAD, fontSize: 15, fontWeight: 700, color: C.accent }}>
            {initial ? `Editar Item: ${initial.map}` : "Cadastrar Novo Item Manual"}
          </div>
          <X size={16} color={C.textFaint} style={{ cursor: "pointer" }} onClick={onClose} />
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 16 }}>
          <Field label="Dia de Entrega"><Input placeholder="Ex: QUINTA" value={form.deliveryDay} onChange={set("deliveryDay")} /></Field>
          <Field label="Mapa / Código"><Input placeholder="Ex: AL-LE45E" value={form.map} onChange={set("map")} /></Field>
          <Field label="Atribuir à Semana">
            <select value={form.cycle} onChange={set("cycle")} style={{ background: C.panel2, color: C.text, border: `1px solid ${C.border2}`, borderRadius: 5, padding: "8px", fontSize: 11, outline: "none" }}>
              {WEEK_OPTIONS.map((w) => (
                <option key={w.id} value={w.id}>{w.label} {w.id === openWeek ? "(Aberta)" : "(Fechada)"}</option>
              ))}
            </select>
          </Field>
        </div>

        <div style={{ background: "rgba(255,82,82,0.08)", border: `1px solid ${C.red}`, padding: 12, borderRadius: 6, marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <span style={{ color: C.red, fontWeight: 700, fontSize: 10, textTransform: "uppercase" }}>⚡ Priorização de OTs (Novas Demandas)</span>
            <span style={{ fontSize: 11, fontWeight: 800, color: C.text }}>Saldo Total Pendente: <span style={{ color: C.red, fontSize: 14 }}>{form.otCount} OTs</span></span>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "flex-end" }}>
            <div style={{ flex: 1 }}><Field label="Adicionar OTs Criadas"><Input type="number" placeholder="Ex: 5" value={addOtInput} onChange={(e) => setAddOtInput(e.target.value)} /></Field></div>
            <button onClick={handleAddOt} type="button" style={{ background: C.red, color: "#fff", border: "none", borderRadius: 5, padding: "8px 14px", fontSize: 11, fontWeight: 700, cursor: "pointer", height: 32 }}>+ Somar OTs</button>
          </div>
        </div>

        {initial && (
          <div style={{ background: C.panel2, border: `1px solid ${C.border2}`, padding: 12, borderRadius: 6, marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
            <div>
              <div style={{ fontWeight: 700, color: C.accent, fontSize: 10, marginBottom: 6, textTransform: "uppercase" }}>Status AS-BUILT Atual</div>
              <StageBadge status={form.asbuiltStatus} tech={form.asbuiltTech} date={form.asbuiltDate} />
            </div>
            <div style={{ fontSize: 9.5, color: C.textFaint, maxWidth: 280, lineHeight: 1.5, textAlign: "right" }}>
              O AS-BUILT só é atualizado pelo botão "Atualizar Item" na <strong style={{ color: C.textDim }}>Fila de Prioridade</strong> — isso garante que as atualizações diárias contem pontos para o colaborador certo.
            </div>
          </div>
        )}

        <div style={{ background: C.panel2, border: `1px solid ${C.border2}`, padding: 12, borderRadius: 6, marginBottom: 12 }}>
          <div style={{ fontWeight: 700, color: C.purple, fontSize: 10, marginBottom: 8, textTransform: "uppercase" }}>ETAPA WORKBOOK</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1.2fr", gap: 10 }}>
            <Field label="Status Workbook">
              <select value={form.workbookStatus} onChange={handleWorkbookStatusChange} style={{ background: C.panel, color: C.text, border: `1px solid ${C.border2}`, borderRadius: 5, padding: "8px", fontSize: 11, outline: "none" }}>
                <option value="SIM">SIM (ATUALIZADO)</option>
                <option value="PENDENTE">NÃO / PENDENTE</option>
              </select>
            </Field>
            <Field label="Data Atualização Workbook"><Input type="date" value={form.workbookDate} onChange={set("workbookDate")} /></Field>
            <Field label="Técnico Workbook"><Input placeholder="Nome do técnico..." value={form.workbookTech} onChange={set("workbookTech")} /></Field>
          </div>
        </div>

        <div style={{ background: C.panel2, border: `1px solid ${C.border2}`, padding: 12, borderRadius: 6, marginBottom: 12 }}>
          <div style={{ fontWeight: 700, color: C.green, fontSize: 10, marginBottom: 8, textTransform: "uppercase" }}>ETAPA INVOICE</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1.2fr", gap: 10 }}>
            <Field label="Status Invoice">
              <select value={form.invoiceStatus} onChange={handleInvoiceStatusChange} style={{ background: C.panel, color: C.text, border: `1px solid ${C.border2}`, borderRadius: 5, padding: "8px", fontSize: 11, outline: "none" }}>
                <option value="SIM">SIM (ATUALIZADO)</option>
                <option value="PENDENTE">NÃO / PENDENTE</option>
              </select>
            </Field>
            <Field label="Data Atualização Invoice"><Input type="date" value={form.invoiceDate} onChange={set("invoiceDate")} /></Field>
            <Field label="Técnico Invoice"><Input placeholder="Nome do técnico..." value={form.invoiceTech} onChange={set("invoiceTech")} /></Field>
          </div>
        </div>

        <div style={{ background: C.panel2, border: `1px solid ${C.border2}`, padding: 12, borderRadius: 6, marginBottom: 16 }}>
            <div style={{ fontWeight: 700, color: C.textDim, fontSize: 10, marginBottom: 8, textTransform: "uppercase" }}>Histórico do Ciclo (Sáb - Sex)</div>
            <WeeklyActivityHeatmap
                asbuiltHistory={form.asbuiltHistory}
                workbookHistory={form.workbookHistory}
                invoiceHistory={form.invoiceHistory}
                onAddToday={addFormHistoryToday}
            />
        </div>

        <Field label="Observações / Detalhes"><Input placeholder="Observações adicionais..." value={form.note} onChange={set("note")} /></Field>

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 20 }}>
          <button onClick={onClose} style={{ background: C.panel2, border: `1px solid ${C.border2}`, color: C.textDim, borderRadius: 5, padding: "8px 14px", fontSize: 11, cursor: "pointer" }}>Cancelar</button>
          <button onClick={() => onSave(form)} style={{ background: C.accent, color: "#000", border: "none", borderRadius: 5, padding: "8px 16px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Salvar Produção</button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PasswordGate><ProductionDashboard /></PasswordGate>);
</script>
