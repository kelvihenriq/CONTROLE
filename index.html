// Tabela única no Supabase (app_state) guarda um "JSON por chave", igual ao localStorage,
// só que compartilhado entre todo mundo e com Realtime (edição de um aparece pros outros na hora).
// Ver o script SQL fornecido separadamente para criar essa tabela.
const APP_STATE_TABLE = 'app_state';

// Hook genérico: sincroniza um pedaço de estado do React com uma linha da tabela app_state.
// - key: identificador da linha (ex: 'projects', 'production_list')
// - deps: array de dependências que, quando mudar, dispara o salvamento (debounced) na nuvem
// - getValue: função que retorna o valor atual (serializável em JSON) a ser salvo
// - applyRemote: função chamada quando chega uma atualização de outro funcionário (via Realtime) ou no carregamento inicial
function useCloudSync(key, deps, getValue, applyRemote) {
  const isApplyingRemote = React.useRef(false);
  const saveTimer = React.useRef(null);
  const didInit = React.useRef(false);

  // Carrega o valor mais recente da nuvem e assina mudanças em tempo real
  useEffect(() => {
    let active = true;
    (async () => {
      try {
        const { data, error } = await sb.from(APP_STATE_TABLE).select('value').eq('key', key).maybeSingle();
        if (!active) return;
        if (error) throw error;
        if (data && data.value !== undefined && data.value !== null) {
          isApplyingRemote.current = true;
          applyRemote(data.value);
        } else {
          // Ainda não existe registro para essa chave: sobe o valor local atual como semente inicial
          await sb.from(APP_STATE_TABLE).upsert({ key, value: getValue(), updated_at: new Date().toISOString() });
        }
        didInit.current = true;
      } catch (e) {
        console.error(`[Supabase] Falha ao carregar "${key}" — usando dado local por enquanto.`, e);
        didInit.current = true;
      }
    })();

    const channel = sb
      .channel('sync_' + key)
      .on('postgres_changes', { event: '*', schema: 'public', table: APP_STATE_TABLE, filter: `key=eq.${key}` }, (payload) => {
        if (payload.new && payload.new.value !== undefined) {
          isApplyingRemote.current = true;
          applyRemote(payload.new.value);
        }
      })
      .subscribe();

    return () => {
      active = false;
      sb.removeChannel(channel);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [key]);

  // Salva na nuvem (com debounce) sempre que o valor local mudar por uma edição real (não por update remoto)
  useEffect(() => {
    if (!didInit.current) return; // evita sobrescrever a nuvem antes do primeiro carregamento
    if (isApplyingRemote.current) { isApplyingRemote.current = false; return; }
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      sb.from(APP_STATE_TABLE).upsert({ key, value: getValue(), updated_at: new Date().toISOString() })
        .then(({ error }) => { if (error) console.error(`[Supabase] Falha ao salvar "${key}"`, error); });
    }, 500);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, deps);
}

// Migração: o código que era chamado "MC01" foi renomeado pra "MC01A" (nome certo).
// Isso pega registros antigos que ainda tenham valor salvo em codes.MC01 e move pra codes.MC01A,
// sem perder o que já foi preenchido.
function migrateProductionCodes(list) {
  if (!Array.isArray(list)) return list;
  let changed = false;
  const next = list.map((item) => {
    if (item?.codes && item.codes.MC01 !== undefined && item.codes.MC01 !== '' && !item.codes.MC01A) {
      changed = true;
      const { MC01, ...rest } = item.codes;
      return { ...item, codes: { ...rest, MC01A: MC01 } };
    }
    return item;
  });
  return changed ? next : list;
}

function computeAsbuiltFormat(codes = {}) {
  const parts = [];
  CODE_FIELDS.forEach(field => {
    const qty = codes[field.id];
    if (qty && Number(qty) > 0) {
      parts.push(`${field.id}X${qty}`);
    }
  });
  return parts.join(' ');
}

  if (!dateStr) return -1;

// Formata 'YYYY-MM-DD' -> 'DD/MM' para exibição compacta
function formatShortDate(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    return `${parts[2]}/${parts[1]}`;
}

// Entradas de histórico podem vir no formato antigo (string 'YYYY-MM-DD')
// ou no novo formato ({ date, tech }) que também guarda quem atualizou naquele dia.
function historyEntryDate(entry) {
    if (!entry) return '';
    return typeof entry === 'string' ? entry : (entry.date || '');
}
function historyEntryTech(entry) {
    if (!entry || typeof entry === 'string') return '';
    return entry.tech || '';
}
function historyHasDate(list, dateStr) {
    return (Array.isArray(list) ? list : []).some((e) => historyEntryDate(e) === dateStr);
}

const MAX_HISTORY_DOTS_VISIBLE = 3;

function UpdateHistoryRow({ title, history, color, onAddToday }) {
    const [expanded, setExpanded] = useState(false);
    const list = Array.isArray(history) ? history : [];
    const hasToday = historyHasDate(list, new Date().toISOString().slice(0, 10));
    const visible = expanded ? list : list.slice(-MAX_HISTORY_DOTS_VISIBLE);

    return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginBottom: 2 }}>

                )}
                {visible.length === 0 && (
                    <span style={{ fontSize: 9, color: C.textFaint }}>—</span>

                {visible.map((entry, i) => {
                    const d = historyEntryDate(entry);
                    const tech = historyEntryTech(entry);
                    return (

function getPrefix(tag) {

}

// ===== CALCULADORA DE FIBRA (RISCANDO) =====
function newFiberRow() {
  return { id: 'row-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), text: '', qty: '', autoQty: true };
}

// Lê a primeira ocorrência de "#<inicio>-<fim>" (faixa) ou "#<numero>" (fibra única) no texto da linha
// e devolve a quantidade de fibras correspondente. Ex: "SPLT1x32#1-9 TO FT031#3-11" -> 9 (1..9)
// "SE010 IN#9 TO FT011#1" -> 1 (referência única, não é faixa)
function parseFiberCount(text) {
  if (!text) return 0;
  const match = String(text).match(/#\s*(\d+)\s*-\s*(\d+)/) || String(text).match(/#\s*(\d+)/);
  if (!match) return 0;
  if (match[2] !== undefined) {
    const a = parseInt(match[1], 10);
    const b = parseInt(match[2], 10);
    if (isNaN(a) || isNaN(b)) return 0;
    return Math.abs(b - a) + 1;
  }
  return 1;
}

function padNumber(n, width) {

function PendingsTab({ pendingsByMap, setPendingsByMap, suggestedMaps }) {
  const mapKeys = useMemo(() => Object.keys(pendingsByMap).sort(), [pendingsByMap]);
  const [selectedMap, setSelectedMap] = useState(mapKeys[0] || "");

  useEffect(() => {
    if (!selectedMap && mapKeys.length > 0) setSelectedMap(mapKeys[0]);
    if (selectedMap && !mapKeys.includes(selectedMap) && mapKeys.length > 0) setSelectedMap(mapKeys[0]);
  }, [mapKeys]);

  const data = pendingsByMap[selectedMap];

  const updateMapData = (patchFn) => {
    setPendingsByMap(prev => ({ ...prev, [selectedMap]: patchFn(prev[selectedMap]) }));
  };

  const createNewMap = () => {
    const name = (prompt('Nome do mapa (ex: LE18E):') || '').trim().toUpperCase();
    if (!name) return;
    if (pendingsByMap[name]) { setSelectedMap(name); return; }
    setPendingsByMap(prev => ({ ...prev, [name]: defaultPendingsMap(name) }));
    setSelectedMap(name);
  };

  const deleteCurrentMap = () => {
    if (!selectedMap) return;
    if (!confirm(`Apagar toda a lista de pendings do mapa ${selectedMap}? Essa ação não pode ser desfeita.`)) return;
    setPendingsByMap(prev => {
      const next = { ...prev };
      delete next[selectedMap];
      return next;
    });
    setSelectedMap("");
  };

  const setTitle = (title) => updateMapData(m => ({ ...m, title }));

  const addGroup = () => {
    const prefix = (prompt('Prefixo do novo grupo (ex: FT, SE, S, PP...):') || '').trim().toUpperCase();
    if (!prefix) return;
    updateMapData(m => ({ ...m, groups: [...m.groups, { id: uid('g'), prefix, items: [] }] }));
  };

  const renameGroup = (groupId) => {
    const group = data.groups.find(g => g.id === groupId);
    const prefix = (prompt('Novo prefixo do grupo:', group?.prefix || '') || '').trim().toUpperCase();
    if (!prefix) return;
    updateMapData(m => ({ ...m, groups: m.groups.map(g => g.id === groupId ? { ...g, prefix } : g) }));
  };

  const deleteGroup = (groupId) => {
    if (!confirm('Apagar esse grupo inteiro e todos os itens dele?')) return;
    updateMapData(m => ({ ...m, groups: m.groups.filter(g => g.id !== groupId) }));
  };

  const addSingleItem = (groupId) => {
    const group = data.groups.find(g => g.id === groupId);
    const nextNum = (group?.items.length || 0) + 1;
    const suggestion = `${group.prefix} ${padNumber(nextNum, 3)}`;
    const code = (prompt('Código do item:', suggestion) || '').trim();
    if (!code) return;
    updateMapData(m => ({
      ...m,
      groups: m.groups.map(g => g.id === groupId ? { ...g, items: [...g.items, { id: uid('i'), code, status: 'PENDING', note: '' }] } : g)
    }));
  };

  const generateRange = (groupId) => {
    const group = data.groups.find(g => g.id === groupId);

    // Descobre o maior número já usado nos itens desse grupo (ex: se já tem "FT 015",
    // continua a partir do 16) — assim não precisa dizer "de/até", só a quantidade.
    let lastNum = 0;
    group.items.forEach((it) => {
      const m = it.code.match(/(\d+)\s*$/);
      if (m) lastNum = Math.max(lastNum, parseInt(m[1], 10));
    });

    const qtyStr = prompt(`Quantos itens "${group.prefix}" você quer adicionar?\n(vai gerar de ${group.prefix} ${padNumber(lastNum + 1, 3)} até ${group.prefix} ${padNumber(lastNum + 20, 3)}, por exemplo, se digitar 20)`, '20');
    if (qtyStr === null) return;
    const qty = parseInt(qtyStr, 10);
    if (isNaN(qty) || qty <= 0) { alert('Quantidade inválida.'); return; }
    if (qty > 500) { alert('Quantidade grande demais (máximo 500 itens por vez).'); return; }

    const from = lastNum + 1;
    const to = lastNum + qty;
    const width = String(to).length >= 3 ? String(to).length : 3;
    const newItems = [];
    for (let n = from; n <= to; n++) {
      newItems.push({ id: uid('i'), code: `${group.prefix} ${padNumber(n, width)}`, status: 'PENDING', note: '' });
    }
    updateMapData(m => ({
      ...m,
      groups: m.groups.map(g => g.id === groupId ? { ...g, items: [...g.items, ...newItems] } : g)
    }));
  };

  const deleteItem = (groupId, itemId) => {
    updateMapData(m => ({
      ...m,
      groups: m.groups.map(g => g.id === groupId ? { ...g, items: g.items.filter(i => i.id !== itemId) } : g)
    }));
  };

  // Clique cicla: PENDING (em branco) -> DONE (verde) -> ISSUE (vermelho, com nota) -> PENDING
  const cycleItemStatus = (groupId, itemId) => {
    updateMapData(m => ({
      ...m,
      groups: m.groups.map(g => {
        if (g.id !== groupId) return g;
        return {
          ...g,
          items: g.items.map(i => {
            if (i.id !== itemId) return i;
            if (i.status === 'PENDING') return { ...i, status: 'DONE', note: '' };
            if (i.status === 'DONE') return { ...i, status: 'ISSUE', note: i.note || 'MISSING CABLE' };
            return { ...i, status: 'PENDING', note: '' };
          })
        };
      })
    }));
  };

  const updateItemNote = (groupId, itemId, note) => {
    updateMapData(m => ({
      ...m,
      groups: m.groups.map(g => g.id === groupId ? { ...g, items: g.items.map(i => i.id === itemId ? { ...i, note } : i) } : g)
    }));
  };

  const addLocation = () => {
    updateMapData(m => ({ ...m, locations: [...m.locations, { id: uid('loc'), name: '', coords: '' }] }));
  };
  const updateLocation = (locId, field, value) => {
    updateMapData(m => ({ ...m, locations: m.locations.map(l => l.id === locId ? { ...l, [field]: value } : l) }));
  };
  const deleteLocation = (locId) => {
    updateMapData(m => ({ ...m, locations: m.locations.filter(l => l.id !== locId) }));
  };

  // Totais gerais do mapa (todos os grupos somados)
  const totals = useMemo(() => {
    if (!data) return { total: 0, done: 0, pct: 0 };
    let total = 0, done = 0;
    data.groups.forEach(g => { total += g.items.length; done += g.items.filter(i => i.status === 'DONE').length; });
    return { total, done, pct: total > 0 ? (done / total) * 100 : 0 };
  }, [data]);

  const exportPendingsXLSX = async () => {
    if (!window.ExcelJS || !data) return;
    const wb = new window.ExcelJS.Workbook();
    buildPendingsSheet(wb, selectedMap, data);
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `Pendings_${selectedMap}_${new Date().toISOString().slice(0, 10)}.xlsx`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  const itemStyle = (status) => {
    if (status === 'DONE') return { background: C.greenSoft, color: C.green, border: `1px solid ${C.green}` };
    if (status === 'ISSUE') return { background: C.redSoft, color: C.red, border: `1px solid ${C.red}` };
    return { background: C.panel2, color: C.textDim, border: `1px solid ${C.border2}` };
  };

  return (
    <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 16 }}>
      {/* SELETOR DE MAPA */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <span style={{ fontSize: 10, color: C.textDim, fontWeight: 700, textTransform: "uppercase" }}>Mapa:</span>
        <select value={selectedMap} onChange={(e) => setSelectedMap(e.target.value)} style={{ background: C.panel2, color: C.text, border: `1px solid ${C.border2}`, borderRadius: 5, padding: "7px 10px", fontSize: 11, fontWeight: 700, outline: "none", cursor: "pointer" }}>
          <option value="" style={{ background: C.panel }}>— selecione —</option>
          {mapKeys.map(k => <option key={k} value={k} style={{ background: C.panel }}>{k}</option>)}
        </select>
        <button onClick={createNewMap} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", color: C.accent, border: `1px dashed ${C.accent}`, borderRadius: 5, padding: "7px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
          <Plus size={13} /> Novo Mapa
        </button>
        {selectedMap && (
          <>
            <button onClick={exportPendingsXLSX} style={{ display: "flex", alignItems: "center", gap: 6, background: C.greenSoft, color: C.green, border: `1px solid ${C.green}`, borderRadius: 5, padding: "7px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
              <Download size={13} /> Exportar Pendings (.XLSX)
            </button>
            <button onClick={deleteCurrentMap} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", color: C.red, border: `1px solid ${C.red}`, borderRadius: 5, padding: "7px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer", marginLeft: "auto" }}>
              <Trash2 size={12} /> Apagar Mapa
            </button>
          </>
        )}
      </div>

      {!selectedMap && (
        <div style={{ padding: 30, textAlign: "center", color: C.textFaint, fontSize: 12 }}>
          Selecione um mapa acima ou crie um novo pra começar a marcar os pendings.
        </div>
      )}

      {selectedMap && data && (
        <>
          {/* TÍTULO */}
          <input
            value={data.title}
            onChange={(e) => setTitle(e.target.value)}
            style={{ background: C.accentSoft, color: C.accent, border: `1px solid ${C.accent}`, borderRadius: 6, padding: "12px 16px", fontSize: 16, fontWeight: 800, textAlign: "center", outline: "none", fontFamily: FONT_HEAD }}
          />

          <div style={{ display: "flex", gap: 0, width: 260, borderRadius: 6, overflow: "hidden", border: `1px solid ${C.border2}` }}>
            <div style={{ flex: 1 }}>

function RedlinesTab({ redlinesData, setRedlinesData }) {
  const monthKeys = useMemo(() => Object.keys(redlinesData.months || {}), [redlinesData]);
  const [selectedMonth, setSelectedMonth] = useState(redlinesData.currentMonth || monthKeys[0] || "");

  useEffect(() => {
    if (!selectedMonth && monthKeys.length > 0) setSelectedMonth(monthKeys[0]);
    if (selectedMonth && !monthKeys.includes(selectedMonth) && monthKeys.length > 0) setSelectedMonth(monthKeys[0]);
  }, [monthKeys]);

  useEffect(() => {
    if (selectedMonth) setRedlinesData(prev => ({ ...prev, currentMonth: selectedMonth }));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selectedMonth]);

  const monthData = redlinesData.months?.[selectedMonth];

  const updateMonth = (patchFn) => {
    setRedlinesData(prev => ({
      ...prev,
      months: { ...prev.months, [selectedMonth]: patchFn(prev.months[selectedMonth]) }
    }));
  };

  const createNewMonth = () => {
    const name = (prompt('Nome do mês (ex: SETEMBRO):') || '').trim().toUpperCase();
    if (!name) return;
    if (redlinesData.months?.[name]) { setSelectedMonth(name); return; }
    setRedlinesData(prev => ({ ...prev, months: { ...prev.months, [name]: defaultRedlineMonth() } }));
    setSelectedMonth(name);
  };

  const deleteCurrentMonth = () => {
    if (!selectedMonth) return;
    if (!confirm(`Apagar TODO o mês ${selectedMonth} do Redlines? Essa ação não pode ser desfeita.`)) return;
    setRedlinesData(prev => {
      const next = { ...prev, months: { ...prev.months } };
      delete next.months[selectedMonth];
      return next;
    });
    setSelectedMonth("");
  };

  const addRow = () => updateMonth(m => ({ ...m, rows: [...m.rows, newRedlineRow()] }));

  const deleteRow = (rowId) => {
    if (!confirm('Apagar essa linha?')) return;
    updateMonth(m => ({ ...m, rows: m.rows.filter(r => r.id !== rowId) }));
  };

  const cycleRowColor = (rowId) => {
    updateMonth(m => ({
      ...m,
      rows: m.rows.map(r => {
        if (r.id !== rowId) return r;
        const idx = REDLINE_COLOR_CYCLE.indexOf(r.color);
        const next = REDLINE_COLOR_CYCLE[(idx + 1) % REDLINE_COLOR_CYCLE.length];
        return { ...r, color: next };
      })
    }));
  };

  const updateCell = (rowId, key, value) => {
    updateMonth(m => ({
      ...m,
      rows: m.rows.map(r => r.id === rowId ? { ...r, cells: { ...r.cells, [key]: value } } : r)
    }));
  };

  const addPendencia = () => {
    updateMonth(m => ({ ...m, pendencias: [...m.pendencias, { id: uid('pd'), text: '' }] }));
  };
  const updatePendencia = (pdId, text) => {
    updateMonth(m => ({ ...m, pendencias: m.pendencias.map(p => p.id === pdId ? { ...p, text } : p) }));
  };
  const deletePendencia = (pdId) => {
    updateMonth(m => ({ ...m, pendencias: m.pendencias.filter(p => p.id !== pdId) }));
  };

  const exportRedlinesXLSX = async () => {
    if (!window.ExcelJS || !monthData) return;
    const wb = new window.ExcelJS.Workbook();
    buildRedlinesSheet(wb, selectedMonth, monthData);
    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `Redlines_${selectedMonth}_${new Date().toISOString().slice(0, 10)}.xlsx`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  const cellInputStyle = { width: "100%", background: "transparent", color: C.text, border: "none", outline: "none", padding: "5px 6px", fontSize: 10.5 };

  return (
    <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 14 }}>
      {/* SELETOR DE MÊS */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <span style={{ fontSize: 10, color: C.textDim, fontWeight: 700, textTransform: "uppercase" }}>Mês:</span>
        {monthKeys.map(k => (
          <button
            key={k}
            onClick={() => setSelectedMonth(k)}
            style={{
              background: selectedMonth === k ? C.greenSoft : "transparent",
              color: selectedMonth === k ? C.green : C.textDim,
              border: `1px solid ${selectedMonth === k ? C.green : C.border2}`,
              borderRadius: 5, padding: "6px 12px", fontSize: 10.5, fontWeight: 700, cursor: "pointer"
            }}
          >{k}</button>
        ))}
        <button onClick={createNewMonth} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", color: C.accent, border: `1px dashed ${C.accent}`, borderRadius: 5, padding: "6px 12px", fontSize: 10.5, fontWeight: 700, cursor: "pointer" }}>
          <Plus size={13} /> Novo Mês
        </button>
        {selectedMonth && (
          <>
            <button onClick={exportRedlinesXLSX} style={{ display: "flex", alignItems: "center", gap: 6, background: C.greenSoft, color: C.green, border: `1px solid ${C.green}`, borderRadius: 5, padding: "6px 12px", fontSize: 10.5, fontWeight: 700, cursor: "pointer" }}>
              <Download size={13} /> Exportar Redlines (.XLSX)
            </button>
            <button onClick={deleteCurrentMonth} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", color: C.red, border: `1px solid ${C.red}`, borderRadius: 5, padding: "6px 12px", fontSize: 10.5, fontWeight: 700, cursor: "pointer", marginLeft: "auto" }}>
              <Trash2 size={12} /> Apagar Mês
            </button>
          </>
        )}
      </div>

      {!selectedMonth && (
        <div style={{ padding: 30, textAlign: "center", color: C.textFaint, fontSize: 12 }}>
          Crie um mês acima (ex: AGOSTO) pra começar a preencher o Redlines.
        </div>
      )}

      {selectedMonth && monthData && (
        <>
          <div style={{ fontSize: 9.5, color: C.textDim, lineHeight: 1.5 }}>
            Clique no quadradinho de cor à esquerda de cada linha pra alternar: sem cor → <span style={{ color: C.green, fontWeight: 700 }}>verde (feito)</span> → <span style={{ color: '#e0c200', fontWeight: 700 }}>amarelo (aguardando/atenção)</span> → <span style={{ color: C.red, fontWeight: 700 }}>vermelho (problema)</span>. As cores saem iguais na planilha exportada.
          </div>

          {/* TABELA REDLINE */}
          <div style={{ overflowX: "auto", border: `1px solid ${C.border2}`, borderRadius: 6 }}>
            <table style={{ borderCollapse: "collapse", fontSize: 10.5, width: "100%" }}>
              <thead>
                <tr>
                  <th style={{ padding: "6px 4px", background: C.panel2, border: `1px solid ${C.border2}`, width: 26 }}></th>
                  {REDLINE_COLUMNS.map(c => (
                    <th key={c.key} style={{ padding: "6px 8px", background: C.panel2, border: `1px solid ${C.border2}`, textAlign: "left", color: C.text, whiteSpace: "nowrap" }}>{c.label}</th>
                  ))}
                  <th style={{ padding: "6px 4px", background: C.panel2, border: `1px solid ${C.border2}`, width: 26 }}></th>
                </tr>
              </thead>
              <tbody>
                {monthData.rows.map(row => (
                  <tr key={row.id} style={{ background: REDLINE_COLOR_STYLE[row.color].background }}>
                    <td style={{ border: `1px solid ${C.borderSoft}`, textAlign: "center" }}>
                      <div
                        onClick={() => cycleRowColor(row.id)}
                        title="Clique pra mudar a cor da linha"
                        style={{ width: 16, height: 16, margin: "0 auto", borderRadius: 3, border: `1px solid ${C.border2}`, cursor: "pointer", background: row.color === 'NONE' ? C.panel2 : 'transparent' }}
                      />
                    </td>
                    {REDLINE_COLUMNS.map(c => (
                      <td key={c.key} style={{ border: `1px solid ${C.borderSoft}`, padding: 0, minWidth: c.width * 7 }}>
                        <input value={row.cells[c.key]} onChange={(e) => updateCell(row.id, c.key, e.target.value)} style={cellInputStyle} />
                      </td>
                    ))}
                    <td style={{ border: `1px solid ${C.borderSoft}`, textAlign: "center" }}>
                      <X size={12} color={C.textFaint} style={{ cursor: "pointer" }} onClick={() => deleteRow(row.id)} />
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <button onClick={addRow} style={{ alignSelf: "flex-start", display: "flex", alignItems: "center", gap: 6, background: "transparent", color: C.accent, border: `1px dashed ${C.accent}`, borderRadius: 4, padding: "6px 12px", fontSize: 10.5, fontWeight: 700, cursor: "pointer" }}>
            <Plus size={12} /> Nova Linha
          </button>

          {/* PENDÊNCIAS DO MÊS */}
          <div style={{ maxWidth: 640 }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: C.amber, textTransform: "uppercase", marginBottom: 6 }}>Pendências do Mês</div>
            <div style={{ fontSize: 9.5, color: C.textDim, marginBottom: 8 }}>Anota aqui pendências gerais (não de uma linha específica), tipo "GR06E — falta fotos" ou "RU80E — falta PDF". Sai listado junto na exportação.</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {monthData.pendencias.map(pd => (
                <div key={pd.id} style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <input
                    value={pd.text}
                    onChange={(e) => updatePendencia(pd.id, e.target.value)}
                    placeholder="Ex: GR06E — falta fotos do splice"
                    style={{ flex: 1, background: C.amberSoft, color: C.text, border: `1px solid ${C.amber}`, borderRadius: 4, padding: "6px 8px", fontSize: 11, outline: "none" }}
                  />
                  <X size={12} color={C.textFaint} style={{ cursor: "pointer", flexShrink: 0 }} onClick={() => deletePendencia(pd.id)} />
                </div>
              ))}
            </div>
            <button onClick={addPendencia} style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 6, background: "transparent", color: C.amber, border: `1px dashed ${C.amber}`, borderRadius: 4, padding: "5px 10px", fontSize: 10, fontWeight: 700, cursor: "pointer" }}>

// Constrói a planilha "REDLINES" — replica o modelo do CONTROLE REDLINE de referência: linhas coloridas
// por status, e uma seção de PENDÊNCIAS logo abaixo da tabela, tudo na mesma aba do mês.
function buildRedlinesSheet(wb, monthName, monthData) {
  const sheetName = monthName.slice(0, 31);
  const ws = wb.addWorksheet(sheetName);

  const headerFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB4C7E7' } };
  const grayBorder = { style: 'thin', color: { argb: 'FF999999' } };

  const headerRow = ws.getRow(1);
  REDLINE_COLUMNS.forEach((c, idx) => {
    const cell = headerRow.getCell(idx + 1);
    cell.value = c.label;
    cell.fill = headerFill;
    cell.font = { bold: true };
    cell.border = { top: grayBorder, bottom: grayBorder, left: grayBorder, right: grayBorder };
    ws.getColumn(idx + 1).width = c.width;
  });

  monthData.rows.forEach((row, rIdx) => {
    const xlRow = ws.getRow(rIdx + 2);
    const colorInfo = REDLINE_COLOR_STYLE[row.color];
    REDLINE_COLUMNS.forEach((c, cIdx) => {
      const cell = xlRow.getCell(cIdx + 1);
      cell.value = row.cells[c.key] || '';
      cell.border = { top: grayBorder, bottom: grayBorder, left: grayBorder, right: grayBorder };
      if (colorInfo.hex) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: colorInfo.hex } };
    });
  });

  // PENDÊNCIAS — logo abaixo da tabela principal, com uma linha em branco de respiro
  const pendStartRow = monthData.rows.length + 4;
  const pendTitleCell = ws.getRow(pendStartRow).getCell(1);
  pendTitleCell.value = 'PENDÊNCIAS';
  pendTitleCell.font = { bold: true, size: 13 };
  pendTitleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFD966' } };
  ws.mergeCells(pendStartRow, 1, pendStartRow, 4);
  pendTitleCell.border = { top: grayBorder, bottom: grayBorder, left: grayBorder, right: grayBorder };

  monthData.pendencias.forEach((pd, idx) => {
    const cell = ws.getRow(pendStartRow + 1 + idx).getCell(1);
    cell.value = pd.text || '';
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF2CC' } };
    cell.border = { top: grayBorder, bottom: grayBorder, left: grayBorder, right: grayBorder };
    ws.mergeCells(pendStartRow + 1 + idx, 1, pendStartRow + 1 + idx, 4);
  });

  return ws;
}

// Constrói a planilha "PENDINGS" (usada tanto na exportação isolada quanto dentro da Lista de Produção)
function buildPendingsSheet(wb, mapName, data) {
  const sheetName = `PENDINGS ${mapName}`.slice(0, 31);
  const ws = wb.addWorksheet(sheetName);

  const titleFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB4C7E7' } };
  const totalFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
  const doneFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF00FF00' } };
  const pctFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF00B0F0' } };
  const greenFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF00FF00' } };
  const redFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFF0000' } };
  const grayBorder = { style: 'thin', color: { argb: 'FF999999' } };
  const thickBorder = { style: 'medium', color: { argb: 'FF000000' } };

  // Título (linha 1, mesclado)
  ws.getRow(1).getCell(6).value = data.title;
  ws.mergeCells(1, 6, 1, 15);
  const titleCell = ws.getRow(1).getCell(6);
  titleCell.fill = titleFill;
  titleCell.font = { bold: true, size: 18 };
  titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
  titleCell.border = { top: thickBorder, bottom: thickBorder, left: thickBorder, right: thickBorder };

  // TOTAL / DONE / %
  let total = 0, done = 0;
  data.groups.forEach(g => { total += g.items.length; done += g.items.filter(i => i.status === 'DONE').length; });

  const summaryRows = [
    { row: 3, label: 'TOTAL', value: total, fill: totalFill },
    { row: 4, label: 'DONE', value: done, fill: doneFill }, // valor inicial; vira fórmula logo abaixo (linha ~*)
    { row: 5, label: '%', value: null, fill: pctFill }       // vira fórmula logo abaixo
  ];
  summaryRows.forEach(({ row, label, value, fill }) => {
    const labelCell = ws.getRow(row).getCell(2);
    const valueCell = ws.getRow(row).getCell(3);
    labelCell.value = label;
    if (value !== null) valueCell.value = value;
    [labelCell, valueCell].forEach(cell => {
      cell.fill = fill;
      cell.font = { bold: true };
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
      cell.border = { top: grayBorder, bottom: grayBorder, left: grayBorder, right: grayBorder };
    });
  });

  // Grupos de itens (cada grupo ocupa 2 colunas: código + status, com 1 coluna de espaço entre grupos)
  const startRow = 7;
  let col = 6;
  const colLetter = (c) => ws.getColumn(c).letter;
  const statusRanges = []; // guarda o range da coluna de status de cada grupo, pra montar as fórmulas de DONE/%

  data.groups.forEach((g) => {
    const codeColL = colLetter(col);
    const statusColL = colLetter(col + 1);
    const firstDataRow = startRow;
    const lastDataRow = startRow + g.items.length - 1;
    if (g.items.length > 0) statusRanges.push(`${statusColL}${firstDataRow}:${statusColL}${lastDataRow}`);

    g.items.forEach((item, idx) => {
      const codeCell = ws.getRow(startRow + idx).getCell(col);
      const statusCell = ws.getRow(startRow + idx).getCell(col + 1);
      codeCell.value = item.code;
      codeCell.border = { top: grayBorder, bottom: grayBorder, left: grayBorder, right: grayBorder };
      statusCell.border = { top: grayBorder, bottom: grayBorder, left: grayBorder, right: grayBorder };
      if (item.status === 'DONE') {
        codeCell.fill = greenFill;
        statusCell.value = 'DONE';
        statusCell.fill = greenFill;
      } else if (item.status === 'ISSUE') {
        codeCell.fill = redFill;
        codeCell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
        statusCell.value = item.note || 'PROBLEMA';
        statusCell.fill = redFill;
        statusCell.font = { color: { argb: 'FFFFFFFF' }, bold: true };
      }
    });

    // Formatação condicional AO VIVO: continua funcionando mesmo depois de baixar e abrir no Excel/Google
    // Sheets. Se alguém digitar DONE (qualquer caixa) na coluna de status, a própria célula e a célula do
    // código ao lado ficam verdes na hora — não depende de reabrir a ferramenta nem reexportar.
    if (g.items.length > 0) {
      const statusRange = `${statusColL}${firstDataRow}:${statusColL}${lastDataRow}`;
      const codeRange = `${codeColL}${firstDataRow}:${codeColL}${lastDataRow}`;
      const doneStyle = {
        fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: 'FF00FF00' } },
        font: { bold: true }
      };
      ws.addConditionalFormatting({
        ref: statusRange,
        rules: [{ type: 'containsText', operator: 'containsText', text: 'DONE', priority: col, style: doneStyle }]
      });
      // Código ao lado acompanha o status da mesma linha (fórmula, referência relativa ajusta linha a linha)
      ws.addConditionalFormatting({
        ref: codeRange,
        rules: [{
          type: 'expression',
          formulae: [`ISNUMBER(SEARCH("DONE",${statusColL}${firstDataRow}))`],
          priority: col + 1,
          style: doneStyle
        }]
      });
    }

    ws.getColumn(col).width = 10;
    ws.getColumn(col + 1).width = 16;
    col += 3; // pula uma coluna de espaço antes do próximo grupo
  });

  // DONE (linha 4) e % (linha 5) viram FÓRMULAS somando quantos "DONE" existem em todas as colunas de
  // status — assim, se alguém digitar DONE numa célula depois de baixar a planilha, esse total e a
  // porcentagem se atualizam sozinhos também (não fica travado no número de quando foi exportado).
  const doneValueCell = ws.getRow(4).getCell(3);
  const pctValueCell = ws.getRow(5).getCell(3);
  if (statusRanges.length > 0) {
    doneValueCell.value = { formula: statusRanges.map(r => `COUNTIF(${r},"*DONE*")`).join('+') };
  }
  pctValueCell.value = { formula: `IFERROR(C4/C3,0)` };
  pctValueCell.numFmt = '0.00%';

  // LOCATION / COORDINATES — colocado à direita, começando na mesma linha dos grupos
  if (data.locations && data.locations.length > 0) {
    const locCol = col + 1;
    const locHeaderRow = startRow;
    ws.getRow(locHeaderRow).getCell(locCol).value = 'LOCATION';
    ws.getRow(locHeaderRow).getCell(locCol + 1).value = 'COORDINATIES';
    [locCol, locCol + 1].forEach((c) => {
      const cell = ws.getRow(locHeaderRow).getCell(c);
      cell.font = { bold: true };
      cell.alignment = { horizontal: 'center', vertical: 'middle' };
      cell.border = { top: grayBorder, bottom: grayBorder, left: grayBorder, right: grayBorder };
    });
    data.locations.forEach((loc, idx) => {
      const nameCell = ws.getRow(locHeaderRow + 1 + idx).getCell(locCol);
      const coordsCell = ws.getRow(locHeaderRow + 1 + idx).getCell(locCol + 1);
      nameCell.value = loc.name;
      coordsCell.value = loc.coords;
      [nameCell, coordsCell].forEach(cell => {
        cell.fill = greenFill;
        cell.font = { bold: true };
        cell.border = { top: grayBorder, bottom: grayBorder, left: grayBorder, right: grayBorder };
      });
    });
    ws.getColumn(locCol).width = 22;
    ws.getColumn(locCol + 1).width = 26;
  }

  return ws;
}

function FiberCalcTab() {
  const [sheets, setSheets] = useState([]); // [{id, name, code, mode, rows:[{id,text,qty}]}]
  const [activeSheetId, setActiveSheetId] = useState(null);
  const [renamingId, setRenamingId] = useState(null);
  const [renameValue, setRenameValue] = useState('');
  const [copiedFeedback, setCopiedFeedback] = useState(false);

  const RIBBON_MULTIPLIER = 12;

  // Carrega estado salvo
  useEffect(() => {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY_FIBER_CALC) || 'null'); } catch (e) {}
    if (saved && Array.isArray(saved.sheets) && saved.sheets.length > 0) {
      setSheets(saved.sheets.map(s => ({
        mode: 'normal',
        ...s,
        rows: (s.rows || []).map(r => {
          const row = { autoQty: true, ...r };
          return row.autoQty ? { ...row, qty: parseFiberCount(row.text) } : row;
        })
      })));
      setActiveSheetId(saved.activeSheetId && saved.sheets.some(s => s.id === saved.activeSheetId) ? saved.activeSheetId : saved.sheets[0].id);
    } else {
      const first = { id: 'sheet-1', name: 'Cálculo 1', code: 'FS02', mode: 'normal', rows: [newFiberRow()] };
      setSheets([first]);
      setActiveSheetId(first.id);
    }
  }, []);

  // Salva estado
  useEffect(() => {
    if (sheets.length === 0) return;
    try { localStorage.setItem(STORAGE_KEY_FIBER_CALC, JSON.stringify({ sheets, activeSheetId })); } catch (e) { console.error('Erro ao salvar calculadora de fibra', e); }
  }, [sheets, activeSheetId]);

  useCloudSync(
    'fiber_calc',
    [sheets, activeSheetId],
    () => ({ sheets, activeSheetId }),
    (v) => {
      if (v && Array.isArray(v.sheets) && v.sheets.length > 0) {
        setSheets(v.sheets.map(s => ({ mode: 'normal', ...s })));
        setActiveSheetId(v.activeSheetId && v.sheets.some(s => s.id === v.activeSheetId) ? v.activeSheetId : v.sheets[0].id);
      }
    }
  );

  const activeSheet = sheets.find(s => s.id === activeSheetId) || sheets[0];

  const updateActiveSheet = (patchFn) => {
    setSheets(prev => prev.map(s => s.id === activeSheetId ? patchFn(s) : s));
  };

  const addSheet = (mode) => {
    const isRibbon = mode === 'ribbon';
    const n = {
      id: 'sheet-' + Date.now(),
      name: isRibbon ? `Ribbon ${sheets.filter(s => s.mode === 'ribbon').length + 1}` : `Cálculo ${sheets.filter(s => s.mode !== 'ribbon').length + 1}`,
      code: 'FS02',
      mode: isRibbon ? 'ribbon' : 'normal',
      rows: [newFiberRow()]
    };
    setSheets(prev => [...prev, n]);
    setActiveSheetId(n.id);
  };

  const removeSheet = (id) => {
    if (sheets.length <= 1) return;
    const idx = sheets.findIndex(s => s.id === id);
    const next = sheets.filter(s => s.id !== id);
    setSheets(next);
    if (activeSheetId === id) {
      setActiveSheetId(next[Math.max(0, idx - 1)].id);
    }
  };

  const addRow = () => updateActiveSheet(s => ({ ...s, rows: [...s.rows, newFiberRow()] }));
  const removeRow = (rowId) => updateActiveSheet(s => ({ ...s, rows: s.rows.filter(r => r.id !== rowId) }));
  const updateRow = (rowId, field, value) => updateActiveSheet(s => ({
    ...s,
    rows: s.rows.map(r => {
      if (r.id !== rowId) return r;
      if (field === 'text') {
        // Se a quantidade ainda estiver em modo automático, recalcula a partir do novo texto
        const nextQty = r.autoQty ? parseFiberCount(value) : r.qty;
        return { ...r, text: value, qty: nextQty };
      }
      if (field === 'qty') {
        // Edição manual desliga o modo automático dessa linha
        return { ...r, qty: value, autoQty: false };
      }
      return { ...r, [field]: value };
    })
  }));
  const resetAutoQty = (rowId) => updateActiveSheet(s => ({
    ...s,
    rows: s.rows.map(r => r.id === rowId ? { ...r, autoQty: true, qty: parseFiberCount(r.text) } : r)
  }));
  const setCode = (val) => updateActiveSheet(s => ({ ...s, code: val }));
  const setMode = (val) => updateActiveSheet(s => ({ ...s, mode: val }));

  if (!activeSheet) return null;

  const isRibbon = activeSheet.mode === 'ribbon';
  const multiplier = isRibbon ? RIBBON_MULTIPLIER : 1;
  const rows = activeSheet.rows;
  const rawQtys = rows.map(r => Number(r.qty) || 0);
  const fiberQtys = rawQtys.map(q => q * multiplier);
  const rawTotal = rawQtys.reduce((a, b) => a + b, 0);
  const total = fiberQtys.reduce((a, b) => a + b, 0);
  const equation = rawQtys.length > 0
    ? rawQtys.map(q => isRibbon ? `${q || 0}×${RIBBON_MULTIPLIER}` : (q || 0)).join(' + ')
    : '0';
  const generatedCode = `${(activeSheet.code || '').trim().toUpperCase() || 'FS02'}X${total}`;

  const handleCopy = () => {
    navigator.clipboard.writeText(generatedCode).then(() => {
      setCopiedFeedback(true);
      setTimeout(() => setCopiedFeedback(false), 1500);
    }).catch(() => {});
  };

  const handleClear = () => {
    updateActiveSheet(s => ({ ...s, rows: [newFiberRow()] }));
  };

  const gridCols = isRibbon ? "40px 1fr 80px 80px 24px 40px" : "40px 1fr 90px 24px 40px";

  return (
    <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 16 }}>
      {/* SUB-ABAS DE CÁLCULOS SALVOS */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {sheets.map(s => (
            <div key={s.id} style={{ display: "flex", alignItems: "center" }}>
              {renamingId === s.id ? (
                <input
                  autoFocus
                  value={renameValue}
                  onChange={(e) => setRenameValue(e.target.value)}
                  onBlur={() => { updateActiveSheet2(s.id, renameValue); setRenamingId(null); }}
                  onKeyDown={(e) => { if (e.key === 'Enter') { updateActiveSheet2(s.id, renameValue); setRenamingId(null); } if (e.key === 'Escape') setRenamingId(null); }}
                  style={{ background: C.panel2, color: C.text, border: `1px solid ${C.pink}`, borderRadius: 5, padding: "6px 10px", fontSize: 11, fontWeight: 700, width: 120, outline: "none" }}
                />
              ) : (
                <button
                  onClick={() => setActiveSheetId(s.id)}
                  onDoubleClick={() => { setRenamingId(s.id); setRenameValue(s.name); }}
                  title="Clique duplo para renomear"
                  style={{
                    display: "flex", alignItems: "center", gap: 8,
                    background: s.id === activeSheetId ? C.pinkSoft : C.panel2,
                    color: s.id === activeSheetId ? C.pink : C.textDim,
                    border: s.id === activeSheetId ? `1px solid ${C.pink}` : `1px solid ${C.border2}`,
                    borderRadius: 5, padding: "6px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer"
                  }}
                >
                  {s.mode === 'ribbon' && (
                    <span style={{ fontSize: 8.5, fontWeight: 800, color: s.id === activeSheetId ? C.pink : C.accent, border: `1px solid ${s.id === activeSheetId ? C.pink : C.accent}`, borderRadius: 3, padding: "1px 4px" }}>×12</span>
                  )}
                  {s.name}
                  {sheets.length > 1 && (
                    <X size={11} onClick={(e) => { e.stopPropagation(); removeSheet(s.id); }} style={{ opacity: 0.6 }} />
                  )}
                </button>
              )}
            </div>
          ))}
        </div>
        <button onClick={() => addSheet('normal')} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", color: C.pink, border: `1px dashed ${C.pink}`, borderRadius: 5, padding: "6px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
          <Plus size={13} /> Novo Cálculo
        </button>
        <button onClick={() => addSheet('ribbon')} title="Cálculo dedicado onde cada unidade equivale a 12 fibras (ribbon)" style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", color: C.accent, border: `1px dashed ${C.accent}`, borderRadius: 5, padding: "6px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
          <Plus size={13} /> Novo Cálculo Ribbon (×12)
        </button>
      </div>

      <Panel
        title={isRibbon ? "Calculadora de Fibra — Riscando (Ribbon ×12)" : "Calculadora de Fibra — Riscando"}
        icon={<List size={13} color={C.pink} />}
        right={
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ display: "flex", gap: 3, background: C.panel2, border: `1px solid ${C.border2}`, borderRadius: 6, padding: 3 }}>
              <button
                onClick={() => setMode('normal')}
                title="1 unidade = 1 fibra"
                style={{
                  background: !isRibbon ? C.pinkSoft : "transparent",
                  color: !isRibbon ? C.pink : C.textDim,
                  border: !isRibbon ? `1px solid ${C.pink}` : "1px solid transparent",
                  borderRadius: 4, padding: "5px 10px", fontSize: 10.5, fontWeight: 800, cursor: "pointer"
                }}
              >
                Normal
              </button>
              <button
                onClick={() => setMode('ribbon')}
                title="1 unidade = 12 fibras (ribbon)"
                style={{
                  background: isRibbon ? C.accentSoft : "transparent",
                  color: isRibbon ? C.accent : C.textDim,
                  border: isRibbon ? `1px solid ${C.accent}` : "1px solid transparent",
                  borderRadius: 4, padding: "5px 10px", fontSize: 10.5, fontWeight: 800, cursor: "pointer"
                }}
              >
                Ribbon ×12
              </button>
            </div>
            <span style={{ fontSize: 10, color: C.textDim, fontWeight: 700, textTransform: "uppercase" }}>Código:</span>
            <select
              value={activeSheet.code}
              onChange={(e) => setCode(e.target.value)}
              style={{ background: C.panel2, color: C.pink, border: `1px solid ${C.border2}`, borderRadius: 5, padding: "5px 8px", fontSize: 11, fontWeight: 800, outline: "none", cursor: "pointer" }}
            >
              {CODE_FIELDS.map(f => (
                <option key={f.id} value={f.id} style={{ background: C.panel }}>{f.id}</option>
              ))}
            </select>
            <button onClick={handleClear} title="Limpar linhas" style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", color: C.textDim, border: `1px solid ${C.border2}`, borderRadius: 5, padding: "6px 10px", fontSize: 10.5, fontWeight: 700, cursor: "pointer" }}>
              <RotateCcw size={12} /> Limpar
            </button>
          </div>
        }
      >
        {isRibbon && (
          <div style={{ fontSize: 11, color: C.accent, background: C.accentSoft || C.panel2, border: `1px solid ${C.accent}`, borderRadius: 6, padding: "8px 12px", marginBottom: 10 }}>
            Modo Ribbon ativo: cada unidade contada na linha vale <strong>12 fibras</strong>. Ex: faixa #1-4 (4 ribbons) = 48 fibras.
          </div>
        )}
        {/* TABELA DE LINHAS */}
        <div style={{ display: "flex", flexDirection: "column", gap: 0, border: `1px solid ${C.border}`, borderRadius: 6, overflow: "hidden" }}>
          <div style={{ display: "grid", gridTemplateColumns: gridCols, gap: 0, background: C.panel2, padding: "10px 14px", borderBottom: `1px solid ${C.border}` }}>
            <div style={{ fontSize: 10, fontWeight: 800, color: C.textDim, textTransform: "uppercase" }}>#</div>
            <div style={{ fontSize: 10, fontWeight: 800, color: C.textDim, textTransform: "uppercase" }}>Linha</div>
            <div style={{ fontSize: 10, fontWeight: 800, color: C.textDim, textTransform: "uppercase" }}>{isRibbon ? "Ribbons" : "Fibras"}</div>
            {isRibbon && <div style={{ fontSize: 10, fontWeight: 800, color: C.textDim, textTransform: "uppercase" }}>Fibras</div>}
            <div></div>
            <div></div>
          </div>
          {rows.map((r, i) => (
            <div key={r.id} style={{ display: "grid", gridTemplateColumns: gridCols, gap: 0, alignItems: "center", padding: "8px 14px", borderBottom: i === rows.length - 1 ? "none" : `1px solid ${C.borderSoft}` }}>
              <div style={{ fontSize: 12, color: C.textDim, fontWeight: 700 }}>{i + 1}</div>
              <input
                value={r.text}
                onChange={(e) => updateRow(r.id, 'text', e.target.value)}
                placeholder="Ex: SE010 IN#1 TO FT031#1"
                style={{ background: "transparent", color: C.text, border: "none", outline: "none", fontSize: 12, fontFamily: "'JetBrains Mono', monospace", padding: "6px 8px" }}
              />
              <input
                type="number"
                value={r.qty}
                onChange={(e) => updateRow(r.id, 'qty', e.target.value)}
                placeholder="0"
                title={r.autoQty ? "Calculado automaticamente a partir da faixa # na linha" : "Valor manual (clique no ↺ para voltar ao automático)"}
                style={{ background: C.panel2, color: r.autoQty ? C.accent : C.pink, border: `1px solid ${r.autoQty ? C.accent : C.border2}`, borderRadius: 5, outline: "none", fontSize: 12, fontWeight: 800, padding: "6px 8px", width: isRibbon ? 56 : 68, textAlign: "right" }}
              />
              {isRibbon && (
                <div style={{ fontSize: 12, fontWeight: 800, color: C.accent, textAlign: "right", paddingRight: 8 }}>
                  {(Number(r.qty) || 0) * RIBBON_MULTIPLIER}
                </div>
              )}
              <div style={{ display: "flex", justifyContent: "center" }}>
                {!r.autoQty && (
                  <RotateCcw size={12} color={C.textDim} onClick={() => resetAutoQty(r.id)} title="Voltar ao cálculo automático" style={{ cursor: "pointer" }} />
                )}
              </div>
              <X size={14} color={C.textFaint} onClick={() => removeRow(r.id)} style={{ cursor: "pointer", justifySelf: "center" }} />
            </div>
          ))}
          <div style={{ display: "grid", gridTemplateColumns: gridCols, gap: 0, alignItems: "center", padding: "10px 14px", background: C.panel2, borderTop: `1px solid ${C.border}` }}>
            <div></div>
            <div style={{ fontSize: 12, fontWeight: 800, color: C.text, fontFamily: FONT_HEAD }}>Total</div>
            <div style={{ fontSize: 14, fontWeight: 800, color: isRibbon ? C.accent : C.pink, textAlign: "right", paddingRight: 8 }}>{isRibbon ? rawTotal : total}</div>
            {isRibbon && <div style={{ fontSize: 14, fontWeight: 800, color: C.pink, textAlign: "right", paddingRight: 8 }}>{total}</div>}
            <div></div>
            <div></div>
          </div>
        </div>

        <button onClick={addRow} style={{ alignSelf: "flex-start", display: "flex", alignItems: "center", gap: 6, background: "transparent", color: C.accent, border: `1px dashed ${C.accent}`, borderRadius: 5, padding: "7px 14px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
          <Plus size={13} /> Adicionar Linha
        </button>

        {/* RESULTADO / RISCANDO */}
        <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 10, background: C.panel2, border: `1px solid ${C.border2}`, borderRadius: 6, padding: "14px 16px", marginTop: 4 }}>
          <span style={{ fontSize: 12.5, color: C.text }}>Riscando: <span style={{ color: C.textDim }}>{equation}</span> = <span style={{ color: C.pink, fontWeight: 800 }}>{total}</span> →</span>
          <span style={{ background: C.pinkSoft, color: C.pink, border: `1px solid ${C.pink}`, borderRadius: 5, padding: "5px 12px", fontSize: 13, fontWeight: 800, fontFamily: "'JetBrains Mono', monospace" }}>
            {generatedCode}
          </span>
          <button onClick={handleCopy} style={{ display: "flex", alignItems: "center", gap: 6, background: copiedFeedback ? C.greenSoft : "transparent", color: copiedFeedback ? C.green : C.textDim, border: `1px solid ${copiedFeedback ? C.green : C.border2}`, borderRadius: 5, padding: "6px 12px", fontSize: 10.5, fontWeight: 700, cursor: "pointer" }}>
            <Copy size={12} /> {copiedFeedback ? "Copiado!" : "Copiar Código"}
          </button>
        </div>
      </Panel>
    </div>
  );

  function updateActiveSheet2(id, name) {
    if (!name || !name.trim()) return;
    setSheets(prev => prev.map(s => s.id === id ? { ...s, name: name.trim() } : s));
  }
}

function AutomacaoMapaTab({ productionRows = [], mapLabel = '' }) {
  const [frameUrl, setFrameUrl] = useState(null);
  const [frameError, setFrameError] = useState('');
  const iframeRef = React.useRef(null);
  const frameReadyRef = React.useRef(false);

  useEffect(() => {
    let objUrl = null;
    try {
      const binary = atob(AUTOMACAO_HTML_B64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'text/html;charset=utf-8' });
      objUrl = URL.createObjectURL(blob);
      setFrameUrl(objUrl);
    } catch (e) {
      console.error('Erro ao preparar a Automação (mapa):', e);
      setFrameError('Não foi possível carregar a ferramenta de automação. Recarregue a página.');
    }
    return () => { if (objUrl) URL.revokeObjectURL(objUrl); };
  }, []);

  // Monta os dados no mesmo formato que a ferramenta de Automação espera (mesma estrutura
  // de item.codes já usada na aba Produção — os mesmos valores que aparecem certos em ASBUILT GERADO).
  const buildPanelRows = () => productionRows.map(item => ({
    date: item.date || '',
    name: (item.location || '').trim(),
    splice: item.splice || 0,
    type2: item.typeEnd || '',
    codes: item.codes || {}
  }));

  const sendProductionToFrame = () => {
    if (!iframeRef.current || !iframeRef.current.contentWindow) return;
    iframeRef.current.contentWindow.postMessage(
      { type: 'CONTROL_PRO_PRODUCTION_DATA', rows: buildPanelRows() },
      '*'
    );
  };

  // Reenvia sempre que a produção mudar (ex: usuário editou/adicionou algo na aba Produção)
  // enquanto a aba Automação está aberta, desde que o iframe já tenha avisado que está pronto.
  useEffect(() => {
    if (frameReadyRef.current) sendProductionToFrame();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [productionRows]);

  useEffect(() => {
    const onMessage = (ev) => {
      if (ev.data && ev.data.type === 'CONTROL_PRO_AUTOMACAO_READY') {
        frameReadyRef.current = true;
        sendProductionToFrame();
      }
    };
    window.addEventListener('message', onMessage);
    return () => window.removeEventListener('message', onMessage);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [frameUrl]);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{ fontSize: 10.5, color: C.textDim, lineHeight: 1.5 }}>
        Sobe o <strong style={{ color: C.text }}>Splice Report</strong> e o <strong style={{ color: C.text }}>PDF do As-Built</strong> — a
        lista de <strong style={{ color: C.text }}>Produção</strong>{mapLabel ? ` (mapa ${mapLabel})` : ''} já vem direto da aba Produção
        deste painel (botão "Usar Produção do Painel" dentro da ferramenta), sem precisar exportar/subir planilha à parte.
        Ela acha a posição certa de cada tag sozinha e grava as caixinhas como anotações reais (editáveis) no PDF, já com conciliação em Excel.
      </div>
      {frameError && (
        <div style={{ background: "rgba(255,82,82,0.1)", border: `1px solid ${C.red}`, color: C.red, padding: 10, borderRadius: 6, fontSize: 11 }}>
          {frameError}
        </div>
      )}
      <div style={{ width: '100%', height: 'calc(100vh - 190px)', minHeight: 600, background: '#fff', borderRadius: 8, overflow: 'hidden', border: `1px solid ${C.border2}` }}>
        {frameUrl ? (
          <iframe
            ref={iframeRef}
            src={frameUrl}
            title="Automação de Callouts (Mapa)"
            onLoad={() => { frameReadyRef.current = true; sendProductionToFrame(); }}
            style={{ width: '100%', height: '100%', border: 'none' }}
          />
        ) : (
          <div style={{ padding: 20, color: C.textDim, fontSize: 11 }}>Carregando ferramenta de automação...</div>
        )}
      </div>
    </div>
  );
}

function ProductionDashboard() {
  // Carrega do localStorage se existir, senão usa o inicial
  const [projects, setProjects] = useState(() => {
    const saved = localStorage.getItem(STORAGE_KEY);
    let data = INITIAL_DEFAULT_DATA;
    if (saved) {
      try {
        data = JSON.parse(saved);
      } catch (e) {
        console.error("Erro ao carregar dados locais", e);
      }
    }
    // Migração do sistema antigo (Semana Atual/Anterior) para o novo (Semana 1-4)
    // + Migração para histórico de datas (CICLO): se o item ainda não tem histórico,
    // cria um a partir da data única que já existia (sem perder o que já estava lá).
    return data.map((p) => {
      let migrated = { ...p };
      if (migrated.cycle === 'CURRENT_WEEK') migrated.cycle = 'SEMANA_1';
      if (migrated.cycle === 'PREVIOUS_WEEK') migrated.cycle = 'SEMANA_2';
      if (!Array.isArray(migrated.asbuiltHistory)) migrated.asbuiltHistory = migrated.asbuiltDate ? [migrated.asbuiltDate] : [];
      if (!Array.isArray(migrated.workbookHistory)) migrated.workbookHistory = migrated.workbookDate ? [migrated.workbookDate] : [];
      if (!Array.isArray(migrated.invoiceHistory)) migrated.invoiceHistory = migrated.invoiceDate ? [migrated.invoiceDate] : [];
      return migrated;
    });
  });

  // ===== HISTÓRICO DE ATUALIZAÇÕES (CICLO) — adiciona a data de hoje na etapa escolhida, junto com quem atualizou =====
  const addHistoryToday = (itemId, stage) => {
    const today = new Date().toISOString().slice(0, 10);
    const historyKey = `${stage}History`; // 'asbuiltHistory' | 'workbookHistory' | 'invoiceHistory'
    const dateKey = `${stage}Date`;
    const techKey = `${stage}Tech`;
    setProjects((prev) => prev.map((p) => {
      if (p.id !== itemId) return p;
      const currentHistory = Array.isArray(p[historyKey]) ? p[historyKey] : [];
      if (historyHasDate(currentHistory, today)) return p; // já registrado hoje, não duplica
      const entry = { date: today, tech: (p[techKey] || '').trim() };
      return { ...p, [historyKey]: [...currentHistory, entry], [dateKey]: today };
    }));
  };

  // Semana atualmente "aberta" para lançamentos (as outras ficam "fechadas"/histórico)
  const [openWeek, setOpenWeek] = useState(() => {
    const saved = localStorage.getItem(STORAGE_KEY_OPEN_WEEK);
    return saved && WEEK_OPTIONS.some((w) => w.id === saved) ? saved : 'SEMANA_1';
  });
  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY_OPEN_WEEK, openWeek); } catch (e) { console.error('Erro ao salvar semana aberta', e); }
  }, [openWeek]);
  useCloudSync('open_week', [openWeek], () => openWeek, (v) => setOpenWeek(v));

  // ===== ARQUIVO/HISTÓRICO MENSAL (reset manual das semanas) =====
  const [archives, setArchives] = useState(() => {
    const saved = localStorage.getItem(STORAGE_KEY_ARCHIVE);
    if (saved) { try { return JSON.parse(saved); } catch (e) { console.error('Erro ao carregar histórico', e); } }
    return [];
  });
  const [showArchiveModal, setShowArchiveModal] = useState(false);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY_ARCHIVE, JSON.stringify(archives)); } catch (e) { console.error('Erro ao salvar histórico', e); }
  }, [archives]);
  useCloudSync('archives', [archives], () => archives, (v) => setArchives(v));

  const handleResetMonth = async () => {
    if (projects.length === 0) { alert('Não há itens para arquivar — a lista já está vazia.'); return; }
    const suggestion = new Date().toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    const label = window.prompt('Vamos arquivar TODOS os itens atuais (Semanas 1-4) e começar um novo mês do zero.\n\nUm arquivo .xlsx com tudo do mês vai ser baixado automaticamente antes de resetar.\n\nDê um nome para o mês que está sendo arquivado:', suggestion);
    if (label === null) return; // cancelou
    const finalLabel = label.trim() || suggestion;

    // Baixa um .xlsx com TODOS os itens do mês (das 4 semanas) antes de arquivar/limpar
    await exportGeneralXLSXForItems(projects, `Mes_${finalLabel.replace(/\s+/g, "_")}`);

    const snapshot = {
      id: 'arch-' + Date.now(),
      archivedAt: new Date().toISOString(),
      label: finalLabel,
      projects
    };
    setArchives((prev) => [snapshot, ...prev]);
    setProjects([]);
    setOpenWeek('SEMANA_1');
    setSelectedCycle('SEMANA_1');
  };

  const handleRestoreArchive = (archiveId) => {
    const arch = archives.find((a) => a.id === archiveId);
    if (!arch) return;
    if (!confirm(`Restaurar "${arch.label}"? Isso vai SUBSTITUIR os itens atuais (${projects.length}) pelos ${arch.projects.length} itens arquivados. Se quiser manter os atuais, arquive-os primeiro.`)) return;
    setProjects(arch.projects);
    setArchives((prev) => prev.filter((a) => a.id !== archiveId));
    setShowArchiveModal(false);
  };

  const handleDeleteArchive = (archiveId) => {
    if (!confirm('Excluir este arquivo permanentemente? Não dá pra desfazer.')) return;
    setArchives((prev) => prev.filter((a) => a.id !== archiveId));
  };

  // ===== BOTÃO "STATUS": TEXTO PRONTO OU PRINT PARA MANDAR NO WHATSAPP (MANUAL) =====
  const statusCaptureRef = React.useRef(null);
  const [statusFeedback, setStatusFeedback] = useState(""); // "" | "texto" | "imagem"

  const copyToClipboardGeneric = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch (e2) {
        console.error('Falha ao copiar', e2);
        return false;
      }
    }
  };

  const copyStatusText = async () => {
    const topPriority = filteredAndSorted[0]?.otCount > 0 ? `${filteredAndSorted[0].map} (${filteredAndSorted[0].otCount} OTs)` : "Nenhuma";
    const lines = [
      `📊 *STATUS DA PRODUÇÃO* — ${new Date().toLocaleDateString('pt-BR')}`,
      ``,
      `✅ Taxa de Conclusão: *${kpis.rate}%*`,
      `🗺️ Mapas: ${kpis.total} total | ${kpis.ok} finalizados | ${kpis.pending} em andamento`,
      ``,
      `⚠️ OTs a Fazer: *${kpis.totalOTs}*`,
      `🔥 Prioridade Máxima: *${topPriority}*`,
      ``,
      `📐 AS-BUILT: ${kpis.ok} prontos | ${kpis.pending} pendentes/revisão`,
      `📄 Invoices: ${kpis.invoiceUpdated}/${kpis.total} atualizadas`,
      `📘 Workbooks: ${kpis.workbookUpdated}/${kpis.total} atualizados`
    ];
    const ok = await copyToClipboardGeneric(lines.join('\n'));
    if (ok) {
      setStatusFeedback('texto');
      setTimeout(() => setStatusFeedback(''), 2000);
    } else {
      alert('Não foi possível copiar automaticamente. Tente novamente.');
    }
  };

  const captureStatusImage = async () => {
    if (!window.html2canvas) { alert('Biblioteca de captura ainda carregando, tente novamente em instantes.'); return; }
    const node = statusCaptureRef.current;
    if (!node) return;
    try {
      const canvas = await window.html2canvas(node, { backgroundColor: '#0b0f16', scale: 2 });
      canvas.toBlob(async (blob) => {
        if (!blob) return;
        const fileName = `Status_Producao_${new Date().toISOString().slice(0, 10)}.png`;
        // Em celular com suporte, tenta abrir direto o menu de compartilhamento (permite escolher o WhatsApp)
        try {
          const file = new File([blob], fileName, { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Status da Produção' });
            setStatusFeedback('imagem');
            setTimeout(() => setStatusFeedback(''), 2000);
            return;
          }
        } catch (shareErr) {
          // Cancelado ou não suportado — cai para o download abaixo
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setStatusFeedback('imagem');
        setTimeout(() => setStatusFeedback(''), 2000);
      }, 'image/png');
    } catch (e) {
      console.error('Erro ao capturar imagem de status', e);
      alert('Não foi possível gerar a imagem. Tente novamente.');
    }
  };

  const [search, setSearch] = useState("");
  const [selectedCycle, setSelectedCycle] = useState("SEMANA_1");
  const [selectedDeliveryDay, setSelectedDeliveryDay] = useState("ALL");
  const [showModal, setShowModal] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [modalMode, setModalMode] = useState("GENERAL"); // 'GENERAL' (Controle Geral / Novo Item) ou 'QUEUE' (Prioridade da Fila — atualização diária de AS-BUILT)
  const [perfTab, setPerfTab] = useState("PRODUCAO_SEMANA");
  const [selectedGeneralIds, setSelectedGeneralIds] = useState(() => new Set());

  // ===== ABA (DASHBOARD DE CONTROLE x PRODUÇÃO & CÓDIGOS AS-BUILT) =====
  const [activeTab, setActiveTab] = useState("DASHBOARD");

  const [productionList, setProductionList] = useState(() => {
    const saved = localStorage.getItem(STORAGE_KEY_PRODUCTION);
    if (saved) {
      try { return migrateProductionCodes(JSON.parse(saved)); } catch (e) { console.error("Erro ao carregar produção", e); }
    }
    return INITIAL_PRODUCTION;
  });
  const [searchProd, setSearchProd] = useState("");
  const [showProdModal, setShowProdModal] = useState(false);
  const [showPasteImportModal, setShowPasteImportModal] = useState(false);
  const [editingProd, setEditingProd] = useState(null);
  const [selectedMapProd, setSelectedMapProd] = useState("ALL");
  const [copiedRowId, setCopiedRowId] = useState(null);

  // ===== COPIAR TEXTO PRONTO (LOCAL + SPLICE + CÓDIGOS) PARA COLAR NA AUTOMAÇÃO =====
  const copyProdToClipboard = async (item) => {
    const asbuiltText = computeAsbuiltFormat(item.codes);
    const lines = [item.location, item.splice ? `#${item.splice}` : '', asbuiltText].filter(Boolean);
    const text = lines.join('\n');
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      // Fallback para navegadores/contextos sem permissão de Clipboard API
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e2) {
        console.error('Falha ao copiar', e2);
        return;
      }
    }
    setCopiedRowId(item.id);
    setTimeout(() => setCopiedRowId((id) => (id === item.id ? null : id)), 1500);
  };

  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY_PRODUCTION, JSON.stringify(productionList));
    } catch (e) {
      console.error('Erro ao salvar lista de produção:', e);
    }
  }, [productionList]);
  useCloudSync('production_list', [productionList], () => productionList, (v) => setProductionList(migrateProductionCodes(v)));

  // Grava automaticamente no localStorage sempre que 'projects' for alterado
  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
    } catch (e) {

        const matchNote = (p.note || "").toLowerCase().includes(s);

  // DESEMPENHO POR COLABORADOR: CADA DIA REGISTRADO NO CICLO (COM TÉCNICO) SOMA 1 PONTO PARA QUEM ATUALIZOU
  const perfCollaborators = useMemo(() => {
    const mapTechs = {};

    const ensureTech = (key) => {
      if (!mapTechs[key]) {
        mapTechs[key] = {
          name: key,
          updatesCount: 0,
          asbuiltCount: 0,
          invoiceCount: 0,
          workbookCount: 0,
          pendingOts: 0,
          asbuiltMaps: [],
          invoiceMaps: [],
          workbookMaps: []
        };
      }
      return mapTechs[key];
    };

    // Cada entrada de data no histórico do ciclo vale 1 ponto para o técnico que a registrou.
    // Ex: mapa X atualizado por KELVI em 04-08 e 05-08, depois por CARLOS em 06-08, depois
    // KELVI de novo em 07-08 → KELVI fica com 3 pontos (3 datas) e CARLOS com 1 (1 data).
    const recordUpdate = (techName, stageName, mapLabel, dateStr) => {
      const key = (techName || "").toUpperCase().trim();
      if (!key) return; // sem técnico atribuído nessa data, não dá pra creditar ninguém
      const t = ensureTech(key);
      t.updatesCount += 1;
      const mapName = `${(mapLabel || "SEM MAPA").trim()}${dateStr ? ` (${formatShortDate(dateStr)})` : ""}`;
      if (stageName === 'AB') { t.asbuiltCount += 1; t.asbuiltMaps.push(mapName); }
      if (stageName === 'INV') { t.invoiceCount += 1; t.invoiceMaps.push(mapName); }
      if (stageName === 'WB') { t.workbookCount += 1; t.workbookMaps.push(mapName); }
    };

    filteredAndSorted.forEach(p => {
      [
        { hist: p.asbuiltHistory, stage: 'AB' },
        { hist: p.workbookHistory, stage: 'WB' },
        { hist: p.invoiceHistory, stage: 'INV' }
      ].forEach(({ hist, stage }) => {
        (Array.isArray(hist) ? hist : []).forEach((entry) => {
          recordUpdate(historyEntryTech(entry), stage, p.map, historyEntryDate(entry));
        });
      });

      // OTs pendentes continuam atribuídas ao técnico de AS-BUILT atual do item
      if (p.otCount > 0 && p.asbuiltTech) {
        ensureTech(p.asbuiltTech.toUpperCase().trim()).pendingOts += p.otCount;
      }
    });

    return Object.values(mapTechs).sort((a, b) => b.updatesCount - a.updatesCount);
  }, [filteredAndSorted]);

    const asbuiltStatus = (submittedOtCount > 0 && item.asbuiltStatus === "OK") ? "PENDENTE" : item.asbuiltStatus;

  const allGeneralVisibleSelected = generalTableItems.length > 0 && generalTableItems.every(p => selectedGeneralIds.has(p.id));

  const handleCopyToNextWeek = () => {

  // ===== LÓGICA DA ABA PRODUÇÃO & CÓDIGOS AS-BUILT =====

  const availableMaps = useMemo(() => {

  const productionByMap = useMemo(() => {

  }, [productionList, selectedMapProd]);

  const filteredProduction = useMemo(() => {

  }, [productionByMap, searchProd]);

  // ===== SELEÇÃO DE LINHAS (pra somar só algumas no Invoice, ex: só uma semana específica) =====
  const [selectedProdIds, setSelectedProdIds] = useState(() => new Set());
  const [rangeFrom, setRangeFrom] = useState("");
  const [rangeTo, setRangeTo] = useState("");

  const toggleProdSelect = (id) => {

      return next;
    });

  const allVisibleSelected = filteredProduction.length > 0 && filteredProduction.every(p => selectedProdIds.has(p.id));
  const toggleSelectAllVisible = () => {

  const clearProdSelection = () => setSelectedProdIds(new Set());

  // Marca automaticamente todas as linhas visíveis dentro de um período de datas (ex: 2026-08-01 a 2026-08-07)
  const selectByDateRange = () => {

    setSelectedProdIds(prev => {

  // Se houver linhas selecionadas, o Invoice/Totais usa só elas — senão, usa tudo que está filtrado (comportamento de sempre)
  const invoiceSourceRows = selectedProdIds.size > 0 ? filteredProduction.filter(p => selectedProdIds.has(p.id)) : filteredProduction;

  const codeTotals = useMemo(() => {

  const [invoicePrices, setInvoicePrices] = useState(() => {

  useEffect(() => {

  useCloudSync('invoice_prices', [invoicePrices], () => invoicePrices, (v) => setInvoicePrices(v));

  const [redlinesData, setRedlinesData] = useState(() => {

  useEffect(() => {

  }, [redlinesData]);

  const handleSaveProd = (item) => {

  const handleImportPastedRows = (rows) => {

  // ===== EXPORTAR .XLSX COM CORES (igual ao padrão usado na planilha do Google Sheets) =====
  const exportProdXLSX = async () => {
    if (!window.ExcelJS) {
      alert('Biblioteca de exportação Excel ainda carregando, tente novamente em instantes.');
      return;
    }
    const mainHeaders = ["DAILY", "PENDINGS", "DATE", "MAP", "LOCATION", "SPLICE", "NAME", "TYPE", "TYPE"];
    const codeHeaders = CODE_FIELDS.map((f) => f.label);
    const headers = [...mainHeaders, ...codeHeaders, "ASBUILT (GERADO)"];
    const nMain = mainHeaders.length;
    const nCode = codeHeaders.length;
    const totalCols = headers.length;
    const colLetter = (n) => {
      let s = '';
      while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
      return s;
    };

    const wb = new window.ExcelJS.Workbook();
    const ws = wb.addWorksheet('Produção As-Built');

    // ----- LINHA 1: TOTAIS -----
    const totalsRowData = new Array(totalCols).fill('');
    totalsRowData[0] = `TOTAIS ${selectedMapProd === "ALL" ? "(TODOS OS MAPAS)" : `(MAPA ${selectedMapProd})`} -->`;
    CODE_FIELDS.forEach((f, i) => { totalsRowData[nMain + i] = codeTotals[f.id] || 0; });
    totalsRowData[totalCols - 1] = 'AUTOMÁTICO';
    ws.getRow(1).values = totalsRowData;
    ws.mergeCells(1, 1, 1, nMain);

    // ----- LINHA 2: CABEÇALHOS -----
    ws.getRow(2).values = headers;

    // ----- LINHAS 3+: DADOS -----
    filteredProduction.forEach((item, idx) => {
      const asbuiltText = computeAsbuiltFormat(item.codes);
      ws.getRow(3 + idx).values = [
        item.daily || '', item.pendings || '', item.date || '', item.map || '', item.location || '',
        item.splice || '', item.name || '', item.type || '', item.typeEnd || '',
        ...CODE_FIELDS.map((f) => item.codes?.[f.id] || ''),
        asbuiltText
      ];
    });

    const lastDataRow = 2 + filteredProduction.length;

    // ----- CORES -----
    const mainHeaderFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1B5E20' } };
    const codeHeaderFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF33691E' } };
    const totalsFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB3E5FC' } };
    const dateMapLocFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF92D050' } };
    const codeDataFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF00FFFF' } };
    const thinBorder = { style: 'thin', color: { argb: 'FF999999' } };

    // Linha de totais
    for (let c = 1; c <= totalCols; c++) {
      const cell = ws.getRow(1).getCell(c);
      cell.fill = totalsFill;
      cell.font = { bold: true, color: { argb: 'FF0D47A1' } };
      cell.alignment = { horizontal: c === 1 ? 'right' : 'center', vertical: 'middle' };
      cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    }

    // Linha de cabeçalhos
    for (let c = 1; c <= totalCols; c++) {
      const cell = ws.getRow(2).getCell(c);
      const isCode = c > nMain && c <= nMain + nCode;
      cell.fill = isCode ? codeHeaderFill : mainHeaderFill;
      cell.font = { bold: true, color: { argb: isCode ? 'FFC6E0B4' : 'FFFFFFFF' } };
      cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    }

    // Linhas de dados
    for (let r = 3; r <= lastDataRow; r++) {
      for (let c = 1; c <= totalCols; c++) {
        const cell = ws.getRow(r).getCell(c);
        cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        // DATE, MAP, LOCATION (colunas 3, 4, 5) em verde-claro
        if (c >= 3 && c <= 5) cell.fill = dateMapLocFill;
        // Colunas de códigos (bloco inteiro) em ciano, igual ao padrão da planilha
        if (c > nMain && c <= nMain + nCode) cell.fill = codeDataFill;
      }
      // ASBUILT alinhado à esquerda, em negrito
      const asbuiltCell = ws.getRow(r).getCell(totalCols);
      asbuiltCell.alignment = { horizontal: 'left', vertical: 'middle' };
      asbuiltCell.font = { bold: true };
    }

    // Larguras de coluna
    ws.columns = headers.map((h, i) => ({
      width: i < nMain ? (i === 4 ? 14 : 11) : (i < nMain + nCode ? 9 : 22)
    }));

    // Congela as duas primeiras linhas (totais + cabeçalho) e ativa o filtro
    ws.views = [{ state: 'frozen', ySplit: 2 }];
    ws.autoFilter = `A2:${colLetter(totalCols)}2`;

    // ===== ADICIONA A(S) ABA(S) DE PENDINGS NO MESMO ARQUIVO =====
    // A comparação ignora maiúsculas/minúsculas e espaços nas pontas, pra não depender de
    // ter digitado o nome do mapa EXATAMENTE igual nas duas abas (Produção e Pendings).
    const normalizeMapName = (s) => (s || '').trim().toUpperCase();
    if (selectedMapProd === "ALL") {
      Object.keys(pendingsByMap).sort().forEach((mapName) => {
        buildPendingsSheet(wb, mapName, pendingsByMap[mapName]);
      });
    } else {
      const matchKey = Object.keys(pendingsByMap).find((k) => normalizeMapName(k) === normalizeMapName(selectedMapProd));
      if (matchKey) {
        buildPendingsSheet(wb, matchKey, pendingsByMap[matchKey]);
      }
