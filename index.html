  // ===== EXPORTAR .XLSX COLORIDO DA TABELA "CONTROLE GERAL DE PRODUÇÃO E DOCUMENTAÇÃO" =====
  // Reutilizável: recebe a lista de itens e o nome-base do arquivo, para servir tanto o botão
  // "Exportar XLSX" (itens filtrados na tela) quanto a exportação automática do mês inteiro
  // ao clicar em "Novo Mês (Resetar Semanas)".
  const exportGeneralXLSXForItems = async (items, filenameBase) => {
    if (!window.ExcelJS) {
      alert('Biblioteca de exportação Excel ainda carregando, tente novamente em instantes.');
      return;
    }
    const headers = [
      "SEMANA", "ENTREGA", "MAPA / CÓDIGO", "SITUAÇÃO (DRIVE)", "MODIFICADO (DRIVE)", "OTS PENDENTES",
      "AS-BUILT STATUS", "AS-BUILT TÉCNICO", "AS-BUILT DATA",
      "INVOICE STATUS", "INVOICE TÉCNICO", "INVOICE DATA",
      "WORKBOOK STATUS", "WORKBOOK TÉCNICO", "WORKBOOK DATA",
      "STATUS GERAL", "OBSERVAÇÕES"
    ];
    const totalCols = headers.length;
    const colLetter = (n) => {
      let s = '';
      while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
      return s;
    };

    const stageLabel = (st) => st === "ENTREGUE" ? "ENTREGUE" : (st === "OK" || st === "SIM") ? "ATUALIZADO" : (st === "FAZENDO" ? "FAZENDO" : (st === "SEM_ATUALIZACAO_SEMANA" ? "SEM ATUALIZAÇÃO NA SEMANA" : "PENDENTE"));
    const generalLabel = (st) => st === "OK" ? "PRONTO" : (st === "PENDING_REVISION" ? "REVISÃO NECESSÁRIA" : "SEM ATUALIZAÇÃO");
    const weekLabel = (cycleId) => { const w = WEEK_OPTIONS.find(w => w.id === cycleId); return w ? formatWeekLabel(w, weekDateRanges) : (cycleId || ''); };
    // Mesma leitura da varredura do Drive usada na tela do Controle Geral (coluna SITUAÇÃO/MODIFICADO),
    // pra exportar exatamente o que aparece no dashboard.
    const driveStatusLabel = (dr) => {
      if (!dr) return '—';
      if (dr.error) return 'Erro na leitura';
      if ((dr.pendingCount || 0) === 0) return 'EM DIA';
      return `${dr.pendingCount} linha(s) pendente(s)${dr.usedDateFallback ? ' (POR DATA)' : ''}`;
    };
    const driveModifiedLabel = (dr) => (dr && dr.modifiedTime) ? new Date(dr.modifiedTime).toLocaleString('pt-BR') : '—';

    const wb = new window.ExcelJS.Workbook();
    const ws = wb.addWorksheet('Controle Geral');

    // ----- LINHA 1: CABEÇALHOS -----
    ws.getRow(1).values = headers;

    // ----- LINHAS 2+: DADOS -----
    items.forEach((item, idx) => {
      const dr = getDriveResultForItem(item.map);
      ws.getRow(2 + idx).values = [
        weekLabel(item.cycle), item.deliveryDay || '', item.map || '', driveStatusLabel(dr), driveModifiedLabel(dr), item.otCount || 0,
        stageLabel(item.asbuiltStatus), item.asbuiltTech || '', item.asbuiltDate || '',
        stageLabel(item.invoiceStatus), item.invoiceTech || '', item.invoiceDate || '',
        stageLabel(item.workbookStatus), item.workbookTech || '', item.workbookDate || '',
        generalLabel(item.status), item.note || ''
      ];
    });

    const lastDataRow = 1 + items.length;

    // ----- CORES -----
    const headerFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0D1117' } };
    const greenFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFC6EFCE' } };
    const greenFont = { color: { argb: 'FF1E7A34' }, bold: true };
    const amberFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFEB9C' } };
    const amberFont = { color: { argb: 'FF9C6500' }, bold: true };
    const redFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFC7CE' } };
    const redFont = { color: { argb: 'FF9C0006' }, bold: true };
    const grayFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE5E5E5' } };
    const grayFont = { color: { argb: 'FF666666' } };
    const pinkFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFD6E8' } };
    const pinkFont = { color: { argb: 'FFB0206B' }, bold: true };
    const otFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB3E5FC' } };
    const thinBorder = { style: 'thin', color: { argb: 'FF999999' } };

    // Cabeçalho
    for (let c = 1; c <= totalCols; c++) {
      const cell = ws.getRow(1).getCell(c);
      cell.fill = headerFill;
      cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
      cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
      cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
    }

    // Colunas com status (AS-BUILT, INVOICE, WORKBOOK, GERAL) coloridas por cor de andamento
    const stageStatusCols = [7, 10, 13]; // AS-BUILT / INVOICE / WORKBOOK status (deslocadas +2 pelas colunas SITUAÇÃO/MODIFICADO do Drive)
    const generalStatusCol = 16;
    const driveStatusCol = 4;

    for (let r = 2; r <= lastDataRow; r++) {
      const item = items[r - 2];
      const dr = getDriveResultForItem(item.map);
      for (let c = 1; c <= totalCols; c++) {
        const cell = ws.getRow(r).getCell(c);
        cell.border = { top: thinBorder, bottom: thinBorder, left: thinBorder, right: thinBorder };
        cell.alignment = { horizontal: c === totalCols ? 'left' : 'center', vertical: 'middle', wrapText: c === totalCols };
      }
      // OTs pendentes em destaque
      const otCell = ws.getRow(r).getCell(6);
      otCell.fill = otFill;
      otCell.font = { bold: true };

      // Colore a coluna SITUAÇÃO (DRIVE) igual ao dashboard: verde em dia, vermelho com pendência, cinza sem dado/erro
      const driveCell = ws.getRow(r).getCell(driveStatusCol);
      if (!dr) { driveCell.fill = grayFill; driveCell.font = grayFont; }
      else if (dr.error) { driveCell.fill = grayFill; driveCell.font = grayFont; }
      else if ((dr.pendingCount || 0) === 0) { driveCell.fill = greenFill; driveCell.font = greenFont; }
      else { driveCell.fill = redFill; driveCell.font = redFont; }

      // Colore cada coluna de status (AS-BUILT, INVOICE, WORKBOOK) conforme o andamento
      const stageStatuses = [item.asbuiltStatus, item.invoiceStatus, item.workbookStatus];
      stageStatusCols.forEach((colIdx, i) => {
        const st = stageStatuses[i];
        const cell = ws.getRow(r).getCell(colIdx);
        if (st === "ENTREGUE") { cell.fill = pinkFill; cell.font = pinkFont; }
        else if (st === "OK" || st === "SIM") { cell.fill = greenFill; cell.font = greenFont; }
        else if (st === "FAZENDO") { cell.fill = amberFill; cell.font = amberFont; }
        else if (st === "SEM_ATUALIZACAO_SEMANA") { cell.fill = grayFill; cell.font = grayFont; }
        else { cell.fill = redFill; cell.font = redFont; }
      });

      // Colore a coluna de Status Geral
      const gCell = ws.getRow(r).getCell(generalStatusCol);
      if (item.status === "OK") { gCell.fill = greenFill; gCell.font = greenFont; }
      else if (item.status === "PENDING_REVISION") { gCell.fill = redFill; gCell.font = redFont; }
      else { gCell.fill = grayFill; gCell.font = grayFont; }
    }

    // Larguras de coluna
    ws.columns = headers.map((h, i) => {
      if (i === 2) return { width: 22 }; // MAPA / CÓDIGO
      if (i === 3) return { width: 24 }; // SITUAÇÃO (DRIVE)
      if (i === 4) return { width: 20 }; // MODIFICADO (DRIVE)
      if (i === totalCols - 1) return { width: 30 }; // OBSERVAÇÕES
      if (i === totalCols - 2) return { width: 18 }; // STATUS GERAL
      return { width: 13 };
    });

    // Congela o cabeçalho e ativa o filtro
    ws.views = [{ state: 'frozen', ySplit: 1 }];
    ws.autoFilter = `A1:${colLetter(totalCols)}1`;

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

    URL.revokeObjectURL(url);

// ===== IMPORTAÇÃO EM MASSA (COLAR DO EXCEL) NA ABA DE PRODUÇÃO =====
// Aceita datas como 07/31/26, 7/31/2026, ou até com typo de barra dupla (08//02/26)
function parsePastedDate(raw) {
  if (!raw) return "";
  const digits = String(raw).match(/\d+/g);
  if (!digits || digits.length < 3) return "";
  let [a, b, c] = digits;
  let month = parseInt(a, 10);
  let day = parseInt(b, 10);
  let year = parseInt(c, 10);
  if (year < 100) year += 2000;
  if (month < 1 || month > 12 || day < 1 || day > 31) return "";
  return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

function splitPastedCells(line) {
  let cells = line.split('\t');
  if (cells.length < 2) cells = line.split(/\s{2,}/);
  return cells.map((c) => (c || '').trim());
}

// Transforma o texto colado (DATE, MAP, LOCATION, SPLICE, NAME, TYPE, TYPE [+ códigos opcionais])
// em linhas prontas. Ignora automaticamente cabeçalho, linhas em branco e separadores (ex: "END
// INVOICE"), já que essas não têm uma data válida na primeira coluna.
//
// Se vier colunas extras depois da 7ª (códigos tipo US01, FS01, FS02...), elas também são
// importadas: se a 1ª linha colada tiver os nomes dos códigos como cabeçalho, usa isso pra saber
// qual coluna é qual código (funciona em qualquer ordem); se não tiver cabeçalho reconhecível,
// assume a ordem padrão dos códigos do sistema (a mesma da Lista de Produção).
function parsePastedProductionRows(text) {
  if (!text) return [];
  const lines = text.split(/\r?\n/).filter((l) => l.trim());
  if (lines.length === 0) return [];

  let codeColumnMap = null; // { índiceDaColuna: idDoCódigo }
  let startIdx = 0;
  const firstCells = splitPastedCells(lines[0]);
  const isHeaderRow = /^date$/i.test(firstCells[0] || '') ||
    firstCells.slice(7).some((c) => CODE_FIELDS.some((f) => f.id.toUpperCase() === (c || '').toUpperCase()));

  if (isHeaderRow) {
    codeColumnMap = {};
    firstCells.forEach((cellText, idx) => {
      if (idx < 7) return;
      const match = CODE_FIELDS.find((f) => f.id.toUpperCase() === (cellText || '').toUpperCase());
      if (match) codeColumnMap[idx] = match.id;
    });
    startIdx = 1;
  }

  const rows = [];
  for (let i = startIdx; i < lines.length; i++) {
    const cells = splitPastedCells(lines[i]);
    const [dateRaw, map, location, splice, name, type, typeEnd] = cells;
    if (!dateRaw) continue;
    if (/^date$/i.test(dateRaw)) continue; // linha de cabeçalho colada junto (sem ter sido detectada como a 1ª)
    const date = parsePastedDate(dateRaw);
    if (!date) continue; // sem data válida = separador/rótulo, ignora

    const codes = {};
    if (codeColumnMap) {
      Object.keys(codeColumnMap).forEach((idxStr) => {
        const idx = parseInt(idxStr, 10);
        const val = (cells[idx] || '').trim();
        if (val !== '') codes[codeColumnMap[idx]] = val;
      });
    } else if (cells.length > 7) {
      // Sem cabeçalho identificável: assume a ordem padrão dos códigos do sistema
      CODE_FIELDS.forEach((f, offset) => {
        const val = (cells[7 + offset] || '').trim();
        if (val !== '') codes[f.id] = val;
      });
    }

    rows.push({
      date, map: map || '', location: location || '', splice: splice || '',
      name: name || '', type: type || 'AERIAL', typeEnd: typeEnd || 'END', codes
    });
  }
  return rows;
}

// Modal que traz direto pra Produção as linhas "pendentes" que a aba Scanner Drive já leu das
// planilhas do Google Drive — sem precisar copiar/colar manualmente. Não faz varredura sozinho
// (isso continua exigindo ir na aba Scanner Drive e clicar "Escanear Agora" ou conectar); aqui só
// lê o resultado mais recente salvo no navegador (mesma fonte usada no Dashboard) e deixa
// escolher quais mapas/linhas trazer.
function DriveImportModal({ onClose, onImport, existingSignatures, prodRowSignature }) {
  const { t, lang } = useLang();
  const [driveResults, setDriveResults] = useState(() => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY_DRIVE_SCAN_RESULTS) || 'null') || []; }
    catch (e) { return []; }
  });
  const lastScan = (() => { try { return localStorage.getItem(STORAGE_KEY_DRIVE_SCAN_LAST) || ''; } catch (e) { return ''; } })();
  const [onlyNew, setOnlyNew] = useState(true);
  const [updateExisting, setUpdateExisting] = useState(false);
  const [checkedMaps, setCheckedMaps] = useState(null); // null = todos marcados por padrão
  const [result, setResult] = useState(null);

  // Uma linha por mapa escaneado que tem pendência, com suas linhas já anotadas como "nova"
  // (ainda não existe na Produção) ou "já importada" (evita duplicar se importar de novo).
  const mapGroups = useMemo(() => {
    return driveResults
      .filter((r) => !r.error && (r.pendingCount || 0) > 0 && r.pendingRows && r.pendingRows.length > 0)
      .map((r) => {
        const rows = r.pendingRows.map((row) => {
          const full = { ...row, map: row.map || r.mapName };
          const isNew = !existingSignatures.has(prodRowSignature(full));
          return { ...full, isNew, sourceFile: r.fileName, webViewLink: r.webViewLink };
        });
        return { mapName: r.mapName, fileName: r.fileName, webViewLink: r.webViewLink, rows, newCount: rows.filter((x) => x.isNew).length };
      })
      .filter((g) => g.rows.length > 0)
      .sort((a, b) => b.newCount - a.newCount);
  }, [driveResults, existingSignatures, prodRowSignature]);

  const isMapChecked = (mapName) => checkedMaps === null || checkedMaps.has(mapName);
  const toggleMap = (mapName) => {
    setCheckedMaps((prev) => {
      const base = prev === null ? new Set(mapGroups.map((g) => g.mapName)) : new Set(prev);
      if (base.has(mapName)) base.delete(mapName); else base.add(mapName);
      return base;
    });
  };

  const selectedRows = useMemo(() => {
    const rows = [];
    mapGroups.forEach((g) => {
      if (!isMapChecked(g.mapName)) return;
      g.rows.forEach((r) => {
        if (onlyNew && !r.isNew) return;
        rows.push(r);
      });
    });
    return rows;
  }, [mapGroups, checkedMaps, onlyNew]);

  const totalNew = mapGroups.reduce((acc, g) => acc + g.newCount, 0);

  const handleConfirm = () => {
    const res = onImport(selectedRows, updateExisting);
    setResult(res);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }}>
      <div style={{ background: C.panel, border: `1px solid ${C.border2}`, borderRadius: 8, padding: 20, width: 820, maxHeight: "90vh", overflowY: "auto", display: "flex", flexDirection: "column", gap: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `1px solid ${C.border}`, paddingBottom: 10 }}>
          <div style={{ fontFamily: FONT_HEAD, fontSize: 15, fontWeight: 700, color: "#4fc3f7" }}>{t('Importar do Drive')}</div>
          <X size={16} color={C.textDim} style={{ cursor: "pointer" }} onClick={onClose} />
        </div>

        {result ? (
          <>
            <div style={{ fontSize: 12, color: C.text, lineHeight: 1.8, background: C.panel2, border: `1px solid ${C.border2}`, borderRadius: 6, padding: 14 }}>
              ✓ <strong style={{ color: C.green }}>{result.imported}</strong> {t('registro(s) importado(s) pra Produção')}
              {result.updated > 0 && <>{' '}— <strong style={{ color: "#4fc3f7" }}>{result.updated}</strong> {t('atualizado(s) com os dados mais novos da planilha.')}</>}
              {result.skipped > 0 && <>{' '}— {result.skipped} {t('já existia(m) e foram ignorado(s) automaticamente.')}</>}
              {result.newCodes && result.newCodes.length > 0 && (
                <div style={{ marginTop: 8, fontSize: 11, color: "#4fc3f7" }}>
                  {t('Código(s) novo(s) detectado(s) e cadastrado(s) automaticamente no sistema:')} <strong>{result.newCodes.join(', ')}</strong>
                </div>
              )}
            </div>
            <div style={{ display: "flex", justifyContent: "flex-end" }}>
              <button onClick={onClose} style={{ background: C.accent, color: "#000", border: "none", borderRadius: 5, padding: "8px 18px", fontSize: 11, fontWeight: 800, cursor: "pointer" }}>{t('Fechar')}</button>
            </div>
          </>
        ) : (
          <>
            <div style={{ fontSize: 11, color: C.textDim, lineHeight: 1.6 }}>
              {t('Traz direto pra cá as linhas pendentes que a aba')} <strong style={{ color: C.text }}>Scanner Drive</strong> {t('já leu das planilhas do Google Drive — sem precisar copiar e colar. Linhas que já existem na Produção (mesmo mapa + local + data + splice) são detectadas e não entram duplicadas.')}
              {' '}{t('Se a lista abaixo estiver desatualizada ou vazia, vá na aba Scanner Drive e clique em "Escanear Agora" primeiro.')}
            </div>

            {lastScan && (
              <div style={{ fontSize: 10, color: C.textFaint }}>
                {t('Última varredura do Drive:')} {new Date(lastScan).toLocaleString(lang === 'en' ? 'en-US' : 'pt-BR')}
              </div>
            )}

            {mapGroups.length === 0 ? (
              <div style={{ padding: 20, textAlign: "center", color: C.textFaint, fontSize: 11, border: `1px dashed ${C.border2}`, borderRadius: 6 }}>
                {t('Nenhuma pendência encontrada na última varredura do Drive (ou nenhuma varredura foi feita ainda).')}
              </div>
            ) : (
              <>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: updateExisting ? C.textFaint : C.textDim, cursor: updateExisting ? "not-allowed" : "pointer" }}>
                      <input type="checkbox" checked={onlyNew} disabled={updateExisting} onChange={(e) => setOnlyNew(e.target.checked)} />
                      {t('Mostrar/importar só as linhas novas (ainda não estão na Produção)')}
                    </label>
                    <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: "#4fc3f7", cursor: "pointer" }}>
                      <input
                        type="checkbox"
                        checked={updateExisting}
                        onChange={(e) => { const v = e.target.checked; setUpdateExisting(v); if (v) setOnlyNew(false); }}
                      />
                      {t('Atualizar as linhas já existentes com os dados mais novos da planilha (em vez de ignorar)')}
                    </label>
                  </div>
                  <div style={{ fontSize: 11, fontWeight: 700, color: C.green }}>
                    {totalNew} {t('linha(s) nova(s) no total, em')} {mapGroups.length} {t('mapa(s)')}
                  </div>
                </div>
                {updateExisting && (
                  <div style={{ fontSize: 10, color: C.textFaint, lineHeight: 1.5 }}>
                    {t('Linhas marcadas "ATUALIZAR" vão receber o nome/tipo/códigos que vierem preenchidos na planilha. Nada que você já preencheu manualmente no site é apagado — só é sobrescrito o que a planilha realmente trouxer com valor.')}
                  </div>
                )}

                <div style={{ maxHeight: 340, overflowY: "auto", border: `1px solid ${C.border2}`, borderRadius: 6 }}>
                  {mapGroups.map((g) => (
                    <div key={g.mapName} style={{ borderBottom: `1px solid ${C.borderSoft}` }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", background: C.panel2, position: "sticky", top: 0 }}>
                        <input type="checkbox" checked={isMapChecked(g.mapName)} onChange={() => toggleMap(g.mapName)} style={{ cursor: "pointer" }} />
                        <strong style={{ fontSize: 11, color: C.text }}>{g.mapName}</strong>
                        <span style={{ fontSize: 10, color: g.newCount > 0 ? C.green : C.textFaint }}>
                          {g.newCount} {t('nova(s)')} / {g.rows.length} {t('total')}
                        </span>
                        {g.webViewLink && (
                          <a href={g.webViewLink} target="_blank" rel="noreferrer" style={{ marginLeft: "auto", fontSize: 9.5, color: C.textFaint }}>{g.fileName}</a>
                        )}
                      </div>
                      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 10 }}>
                        <tbody>
                          {g.rows.filter((r) => !onlyNew || r.isNew).map((r, idx) => (
                            <tr key={idx} style={{ opacity: isMapChecked(g.mapName) ? 1 : 0.4 }}>
                              <td style={{ padding: "4px 10px", color: C.textDim, width: 70 }}>{r.date}</td>
                              <td style={{ padding: "4px 10px", color: C.text }}>{r.location}</td>
                              <td style={{ padding: "4px 10px", color: C.textDim, width: 50 }}>{r.splice}</td>
                              <td style={{ padding: "4px 10px", color: C.textDim, width: 130 }}>{r.name}</td>
                              <td style={{ padding: "4px 10px", color: C.textDim, width: 90 }}>{r.typeCode || 'AERIAL'}</td>
                              <td style={{ padding: "4px 10px", color: r.codes && Object.keys(r.codes).length > 0 ? "#4fc3f7" : C.textFaint, fontWeight: 700 }}>
                                {computeAsbuiltFormat(r.codes || {}) || '—'}
                              </td>
                              <td style={{ padding: "4px 10px", width: 70 }}>
                                {r.isNew
                                  ? <span style={{ color: C.green, fontWeight: 700 }}>{t('NOVA')}</span>
                                  : updateExisting
                                    ? <span style={{ color: "#4fc3f7", fontWeight: 700 }}>{t('ATUALIZAR')}</span>
                                    : <span style={{ color: C.textFaint }}>{t('já existe')}</span>}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  ))}
                </div>
              </>
            )}

            <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
              <button onClick={onClose} style={{ background: C.panel2, border: `1px solid ${C.border2}`, color: C.textDim, borderRadius: 5, padding: "8px 14px", fontSize: 11, cursor: "pointer" }}>{t('Cancelar')}</button>
              <button
                disabled={selectedRows.length === 0}
                onClick={handleConfirm}
                style={{ background: selectedRows.length > 0 ? "#4fc3f7" : C.panel2, color: selectedRows.length > 0 ? "#000" : C.textFaint, border: "none", borderRadius: 5, padding: "8px 18px", fontSize: 11, fontWeight: 800, cursor: selectedRows.length > 0 ? "pointer" : "not-allowed" }}
              >
                {t('Importar')} {selectedRows.length > 0 ? `${selectedRows.length} ${t('Registro(s)')}` : ""}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

            )}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 10, maxHeight: 260, overflowY: "auto", paddingRight: 4 }}>
            {codeFields.map(f => {
              const isCustom = !fixedCodeIds.includes(f.id);
              return (
                <div key={f.id} style={{ position: "relative" }}>
                  <Field label={f.label}>
                    <Input type="number" placeholder="0" value={form.codes?.[f.id] || ''} onChange={setCode(f.id)} style={isCustom ? { paddingRight: 22 } : undefined} />
                  </Field>
                  {isCustom && onRemoveCode && (
                    <button
                      type="button"
                      title={`Remover o código "${f.id}" (não afeta produção já lançada com ele)`}
                      onClick={() => {
                        if (window.confirm(`Remover o código "${f.id}" da lista? Ele deixa de aparecer pra novos lançamentos, mas produção já salva com ele não é apagada.`)) {
                          onRemoveCode(f.id);
                        }
                      }}
                      style={{ position: "absolute", top: 20, right: 4, background: "transparent", border: "none", color: C.red, cursor: "pointer", padding: 2, lineHeight: 0 }}
                    >
                      <X size={12} />
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        <div style={{ background: "rgba(0, 212, 255, 0.08)", border: `1px solid ${C.accent}`, padding: 12, borderRadius: 6, marginBottom: 16 }}>
          <div style={{ fontSize: 9.5, color: C.textDim, textTransform: "uppercase", marginBottom: 4 }}>
            {t('Resultado Formatado Automaticamente para a coluna ASBUILT:')}
          </div>
          <div style={{ fontSize: 15, fontWeight: 800, color: C.accent }}>
            {generatedPreview || <span style={{ color: C.textFaint, fontSize: 12 }}>{t('(Preencha as quantidades dos códigos)')}</span>}
          </div>
        </div>

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
          <button onClick={onClose} style={{ background: C.panel2, border: `1px solid ${C.border2}`, color: C.textDim, borderRadius: 5, padding: "8px 14px", fontSize: 11, cursor: "pointer" }}>{t('Cancelar')}</button>
          <button onClick={() => onSave(form)} style={{ background: C.green, color: "#000", border: "none", borderRadius: 5, padding: "8px 16px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>{t('Salvar Registro')}</button>
        </div>
      </div>
    </div>
  );
}

function ItemModal({ initial, mode = "GENERAL", openWeek, onClose, onSave, productionList = [], weekDateRanges = {} }) {
  const { t } = useLang();
  const today = new Date().toISOString().slice(0, 10);
  const [addOtInput, setAddOtInput] = useState("");
  const isQueueMode = mode === "QUEUE";

  const [form, setForm] = useState(() => initial || {
    deliveryDay: "QUINTA",
    cycle: openWeek || "SEMANA_1",
    map: "",
    status: "NO_UPDATE",
    otCount: 0,
    asbuiltStatus: "SEM_ATUALIZACAO_SEMANA",
    asbuiltDate: "",
    asbuiltTech: "",
    invoiceStatus: "PENDENTE",
    invoiceDate: "",
    invoiceTech: "",
    workbookStatus: "PENDENTE",
    workbookDate: "",
    workbookTech: "",
    note: ""
  });

  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  // ===== SUGESTÃO AUTOMÁTICA DE "OTs PENDENTES" A PARTIR DA PRODUÇÃO =====
  // Conta, na aba Produção, quantas linhas desse MESMO mapa ainda não estão marcadas "FEITO".
  // É a mesma lógica do "X a fazer" que já aparece na Produção — só que agora sugerida aqui
  // também, pra ninguém precisar contar na mão e digitar de novo. NÃO sobrescreve sozinho:
  // o número salvo (form.otCount) só muda quando o usuário clicar em "Usar este valor".
  const otSuggestion = useMemo(() => {
    const mapKey = (form.map || "").trim().toUpperCase();
    if (!mapKey) return null;
    const rows = productionList.filter(p => (p.map || "").trim().toUpperCase() === mapKey);
    if (rows.length === 0) return null; // mapa ainda sem produção lançada — não dá suficiente pra sugerir
    const pending = rows.filter(p => !p.done).length;
    return { pending, total: rows.length };
  }, [form.map, productionList]);

  const applyOtSuggestion = () => {
    if (!otSuggestion) return;
    setForm(f => ({ ...f, otCount: otSuggestion.pending }));
  };

  const addFormHistoryToday = (stage) => {
    const historyKey = `${stage}History`;
    const dateKey = `${stage}Date`;
    const techKey = `${stage}Tech`;
    setForm((f) => {
      const currentHistory = Array.isArray(f[historyKey]) ? f[historyKey] : [];
      if (historyHasDate(currentHistory, today)) return f;
      const entry = { date: today, tech: (f[techKey] || '').trim() };
      return { ...f, [historyKey]: [...currentHistory, entry], [dateKey]: today };
    });
  };

  const handleAddOt = () => {
    const qty = parseInt(addOtInput, 10);
    if (!qty || isNaN(qty) || qty <= 0) return;
    setForm(f => ({ ...f, otCount: (Number(f.otCount) || 0) + qty }));
    setAddOtInput("");
  };

  const handleAsBuiltStatusChange = (e) => {
    const val = e.target.value;
    const countsAsActivity = val === "OK" || val === "FAZENDO" || val === "ENTREGUE";

    // Exige o nome do técnico ANTES de deixar marcar FAZENDO/ATUALIZADO/ENTREGUE — assim o
    // mapa já fica "pegado" por quem vai executar, e esse nome é reaproveitado quando finalizar.
    if (countsAsActivity && !(form.asbuiltTech || '').trim()) {
      alert('Preencha o campo "Seu Nome (Técnico)" antes de marcar FAZENDO, ATUALIZADO ou ENTREGUE.');
      return;
    }

    setForm(f => {
      // Marcar FAZENDO, ATUALIZADO (OK) ou ENTREGUE já conta como atividade do dia no Ciclo
      // (Sáb-Sex), sem precisar clicar manualmente em "+Hoje" depois no Controle Geral.
      const currentHistory = Array.isArray(f.asbuiltHistory) ? f.asbuiltHistory : [];
      const asbuiltHistory = countsAsActivity && !historyHasDate(currentHistory, today)
        ? [...currentHistory, { date: today, tech: (f.asbuiltTech || '').trim() }]
        : currentHistory;
      return {
        ...f,
        asbuiltStatus: val,
        asbuiltDate: countsAsActivity && !f.asbuiltDate ? today : f.asbuiltDate,
        asbuiltHistory,
        // OTs pendentes só zeram quando marcado como ATUALIZADO (OK) ou ENTREGUE — "FAZENDO" mantém a fila.
        otCount: (val === "OK" || val === "ENTREGUE") ? 0 : f.otCount
      };
    });
  };

  const handleWorkbookStatusChange = (e) => {
    const val = e.target.value;
    // Mesma trava do AS-BUILT: exige o nome do técnico antes de marcar SIM, senão a
    // atualização fica sem dono e some da pontuação de "Desempenho Colaborador".
    if (val === "SIM" && !(form.workbookTech || '').trim()) {
      alert('Preencha o campo "Técnico Workbook" antes de marcar como ATUALIZADO (SIM) — sem o nome, a atualização não conta na pontuação do colaborador.');
      return;
    }
    setForm(f => {
      const currentHistory = Array.isArray(f.workbookHistory) ? f.workbookHistory : [];
      const workbookHistory = val === "SIM" && !historyHasDate(currentHistory, today)
        ? [...currentHistory, { date: today, tech: (f.workbookTech || '').trim() }]
        : currentHistory;
      return {
        ...f,
        workbookStatus: val,
        workbookDate: val === "SIM" && !f.workbookDate ? today : f.workbookDate,
        workbookHistory
      };
    });
  };

  const handleInvoiceStatusChange = (e) => {
    const val = e.target.value;
    const countsAsActivity = val === "SIM" || val === "ENTREGUE";
    // Mesma trava do AS-BUILT: exige o nome do técnico antes de marcar SIM/ENTREGUE, senão a
    // atualização fica sem dono e some da pontuação de "Desempenho Colaborador".
    if (countsAsActivity && !(form.invoiceTech || '').trim()) {
      alert('Preencha o campo "Técnico Invoice" antes de marcar como ATUALIZADO (SIM) ou ENTREGUE — sem o nome, a atualização não conta na pontuação do colaborador.');
      return;
    }
    setForm(f => {
      const currentHistory = Array.isArray(f.invoiceHistory) ? f.invoiceHistory : [];
      const invoiceHistory = countsAsActivity && !historyHasDate(currentHistory, today)
        ? [...currentHistory, { date: today, tech: (f.invoiceTech || '').trim() }]
        : currentHistory;
      return {
        ...f,
        invoiceStatus: val,
        invoiceDate: countsAsActivity && !f.invoiceDate ? today : f.invoiceDate,
        invoiceHistory
      };
    });
  };

  // ===== MODO "FILA DE PRIORIDADE": modal enxuto, só para atualização diária do AS-BUILT =====
  if (isQueueMode) {
    return (
      <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }}>
        <div style={{ background: C.panel, border: `1px solid ${C.border2}`, borderRadius: 8, padding: 20, width: 420, maxHeight: "90vh", overflowY: "auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6, borderBottom: `1px solid ${C.border}`, paddingBottom: 10 }}>
            <div style={{ fontFamily: FONT_HEAD, fontSize: 15, fontWeight: 700, color: C.accent }}>{t('Atualizar AS-BUILT:')} {form.map}</div>
            <X size={16} color={C.textFaint} style={{ cursor: "pointer" }} onClick={onClose} />
          </div>
          <div style={{ fontSize: 10, color: C.textDim, marginBottom: 14, lineHeight: 1.5 }}>
            {t('Marque')} <strong style={{ color: C.amber }}>{t('FAZENDO')}</strong> {t('assim que começar (assim ninguém mais pega esse mapa), e')} <strong style={{ color: C.green }}>{t('ATUALIZADO')}</strong> {t('quando terminar. As OTs pendentes só somem quando marcar ATUALIZADO.')}
          </div>

          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "rgba(255,82,82,0.08)", border: `1px solid ${C.red}`, padding: "8px 12px", borderRadius: 6, marginBottom: otSuggestion ? 6 : 14 }}>
            <span style={{ fontSize: 10.5, color: C.textDim, fontWeight: 700, textTransform: "uppercase" }}>{t('OTs Pendentes')}</span>
            <span style={{ fontSize: 16, fontWeight: 800, color: C.red }}>{form.otCount}</span>
          </div>
          {otSuggestion && (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, background: "rgba(255,193,7,0.08)", border: `1px dashed ${C.amber}`, padding: "6px 10px", borderRadius: 6, marginBottom: 14 }}>
              <span style={{ fontSize: 9.5, color: C.textDim, lineHeight: 1.4 }}>
                📋 {t('Produção deste mapa:')} <strong style={{ color: C.amber }}>{otSuggestion.pending} {t('de')} {otSuggestion.total} {t('linhas')}</strong> {t('ainda não marcadas FEITO.')}
                {otSuggestion.pending !== Number(form.otCount || 0) && ` ${t('Valor diferente do salvo aqui.')}`}
              </span>
              <button type="button" onClick={applyOtSuggestion} style={{ background: "transparent", border: `1px solid ${C.amber}`, color: C.amber, borderRadius: 5, padding: "4px 8px", fontSize: 9.5, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>
                {t('Usar')} {otSuggestion.pending}
              </button>
            </div>
          )}

          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <Field label={t('Status AS-BUILT')}>
              <select value={form.asbuiltStatus} onChange={handleAsBuiltStatusChange} style={{ background: C.panel2, color: C.text, border: `1px solid ${C.border2}`, borderRadius: 5, padding: "8px", fontSize: 11, outline: "none" }}>
                <option value="SEM_ATUALIZACAO_SEMANA">{t('SEM ATUALIZAÇÃO NA SEMANA (ATÉ O MOMENTO)')}</option>
                <option value="PENDENTE">{t('PENDENTE')}</option>
                <option value="FAZENDO">{t('FAZENDO (Em Andamento)')}</option>
                <option value="OK">{t('ATUALIZADO (OK)')}</option>
                <option value="ENTREGUE">{t('ENTREGUE')}</option>
              </select>
            </Field>
            <Field label={t('Seu Nome (Técnico)')}><Input placeholder={t('Nome de quem está atualizando...')} value={form.asbuiltTech} onChange={set("asbuiltTech")} /></Field>
            <Field label={t('Data')}><Input type="date" value={form.asbuiltDate} onChange={set("asbuiltDate")} /></Field>
          </div>

          <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 20 }}>
            <button onClick={onClose} style={{ background: C.panel2, border: `1px solid ${C.border2}`, color: C.textDim, borderRadius: 5, padding: "8px 14px", fontSize: 11, cursor: "pointer" }}>{t('Cancelar')}</button>
            <button onClick={() => onSave(form)} style={{ background: C.accent, color: "#000", border: "none", borderRadius: 5, padding: "8px 16px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>{t('Salvar Atualização')}</button>
          </div>
        </div>
      </div>
    );
  }

  // ===== MODO "GERAL": cadastro/edição do item (sem edição de AS-BUILT — isso é feito só pela Fila de Prioridade) =====
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }}>
      <div style={{ background: C.panel, border: `1px solid ${C.border2}`, borderRadius: 8, padding: 20, width: 620, maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, borderBottom: `1px solid ${C.border}`, paddingBottom: 10 }}>
          <div style={{ fontFamily: FONT_HEAD, fontSize: 15, fontWeight: 700, color: C.accent }}>
            {initial ? `${t('Editar Item:')} ${initial.map}` : t('Cadastrar Novo Item Manual')}
          </div>
          <X size={16} color={C.textFaint} style={{ cursor: "pointer" }} onClick={onClose} />
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 16 }}>
          <Field label={t('Dia de Entrega')}><Input placeholder={t('Ex: QUINTA')} value={form.deliveryDay} onChange={set("deliveryDay")} /></Field>
          <Field label={t('Mapa / Código')}><Input placeholder="Ex: AL-LE45E" value={form.map} onChange={set("map")} /></Field>
          <Field label={t('Atribuir à Semana')}>
            <select value={form.cycle} onChange={set("cycle")} style={{ background: C.panel2, color: C.text, border: `1px solid ${C.border2}`, borderRadius: 5, padding: "8px", fontSize: 11, outline: "none" }}>
              {WEEK_OPTIONS.map((w) => (
                <option key={w.id} value={w.id}>{formatWeekLabel(w, weekDateRanges)} {w.id === openWeek ? t("(Aberta)") : t("(Fechada)")}</option>
              ))}
            </select>
          </Field>
        </div>

        <div style={{ background: "rgba(255,82,82,0.08)", border: `1px solid ${C.red}`, padding: 12, borderRadius: 6, marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <span style={{ color: C.red, fontWeight: 700, fontSize: 10, textTransform: "uppercase" }}>⚡ {t('Priorização de OTs (Novas Demandas)')}</span>
            <span style={{ fontSize: 11, fontWeight: 800, color: C.text }}>{t('Saldo Total Pendente:')} <span style={{ color: C.red, fontSize: 14 }}>{form.otCount} {t('OTs')}</span></span>
          </div>
          {otSuggestion && (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, background: "rgba(255,193,7,0.08)", border: `1px dashed ${C.amber}`, padding: "6px 10px", borderRadius: 6, marginBottom: 10 }}>
              <span style={{ fontSize: 9.5, color: C.textDim, lineHeight: 1.4 }}>
                📋 {t('Sugestão automática (Produção):')} <strong style={{ color: C.amber }}>{otSuggestion.pending} {t('de')} {otSuggestion.total} {t('linhas')}</strong> {t('deste mapa ainda não marcadas FEITO.')}
                {otSuggestion.pending !== Number(form.otCount || 0) && ` ${t('Diferente do saldo salvo aqui.')}`}
              </span>
              <button type="button" onClick={applyOtSuggestion} style={{ background: "transparent", border: `1px solid ${C.amber}`, color: C.amber, borderRadius: 5, padding: "4px 8px", fontSize: 9.5, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>
                {t('Usar')} {otSuggestion.pending}
              </button>
            </div>
          )}
          <div style={{ display: "flex", gap: 8, alignItems: "flex-end" }}>
            <div style={{ flex: 1 }}><Field label={t('Adicionar OTs Criadas')}><Input type="number" placeholder="Ex: 5" value={addOtInput} onChange={(e) => setAddOtInput(e.target.value)} /></Field></div>
            <button onClick={handleAddOt} type="button" style={{ background: C.red, color: "#fff", border: "none", borderRadius: 5, padding: "8px 14px", fontSize: 11, fontWeight: 700, cursor: "pointer", height: 32 }}>+ {t('Somar OTs')}</button>
          </div>
          <div style={{ marginTop: 8 }}>
            <Field label={t('Ajustar Saldo Manualmente (sobrescreve o total acima)')}>
              <Input type="number" placeholder="Ex: 3" value={form.otCount} onChange={(e) => setForm(f => ({ ...f, otCount: e.target.value === "" ? "" : Number(e.target.value) }))} />
            </Field>
          </div>
        </div>

        {initial && (
          <div style={{ background: C.panel2, border: `1px solid ${C.border2}`, padding: 12, borderRadius: 6, marginBottom: 12 }}>
            <div style={{ fontWeight: 700, color: C.accent, fontSize: 10, marginBottom: 8, textTransform: "uppercase" }}>{t('ETAPA AS-BUILT')}</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1.2fr", gap: 10 }}>
              <Field label={t('Status AS-BUILT')}>
                <select value={form.asbuiltStatus} onChange={handleAsBuiltStatusChange} style={{ background: C.panel, color: C.text, border: `1px solid ${C.border2}`, borderRadius: 5, padding: "8px", fontSize: 11, outline: "none" }}>
                  <option value="SEM_ATUALIZACAO_SEMANA">{t('SEM ATUALIZAÇÃO NA SEMANA (ATÉ O MOMENTO)')}</option>
                  <option value="PENDENTE">{t('PENDENTE')}</option>
                  <option value="FAZENDO">{t('FAZENDO (Em Andamento)')}</option>
                  <option value="OK">{t('ATUALIZADO (OK)')}</option>
                  <option value="ENTREGUE">{t('ENTREGUE')}</option>
                </select>
              </Field>
              <Field label={t('Data AS-BUILT')}><Input type="date" value={form.asbuiltDate} onChange={set("asbuiltDate")} /></Field>
              <Field label={t('Técnico AS-BUILT')}><Input placeholder={t('Nome do técnico...')} value={form.asbuiltTech} onChange={set("asbuiltTech")} /></Field>
            </div>
            <div style={{ fontSize: 9.5, color: C.textFaint, marginTop: 8, lineHeight: 1.5 }}>
              {t('Preencha o nome do técnico antes de marcar')} <strong style={{ color: C.amber }}>{t('FAZENDO')}</strong> {t('ou')} <strong style={{ color: C.green }}>{t('ATUALIZADO')}</strong> — {t('o mapa continua aparecendo na Fila de Prioridade enquanto estiver "FAZENDO" ou com OTs pendentes.')}
            </div>
          </div>
        )}

        <div style={{ background: C.panel2, border: `1px solid ${C.border2}`, padding: 12, borderRadius: 6, marginBottom: 12 }}>
          <div style={{ fontWeight: 700, color: C.purple, fontSize: 10, marginBottom: 8, textTransform: "uppercase" }}>{t('ETAPA WORKBOOK')}</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1.2fr", gap: 10 }}>
            <Field label={t('Status Workbook')}>
              <select value={form.workbookStatus} onChange={handleWorkbookStatusChange} style={{ background: C.panel, color: C.text, border: `1px solid ${C.border2}`, borderRadius: 5, padding: "8px", fontSize: 11, outline: "none" }}>
                <option value="SIM">{t('SIM (ATUALIZADO)')}</option>
                <option value="PENDENTE">{t('NÃO / PENDENTE')}</option>
              </select>
            </Field>
            <Field label={t('Data Atualização Workbook')}><Input type="date" value={form.workbookDate} onChange={set("workbookDate")} /></Field>
            <Field label={t('Técnico Workbook')}><Input placeholder={t('Nome do técnico...')} value={form.workbookTech} onChange={set("workbookTech")} /></Field>
          </div>
        </div>

        <div style={{ background: C.panel2, border: `1px solid ${C.border2}`, padding: 12, borderRadius: 6, marginBottom: 12 }}>
          <div style={{ fontWeight: 700, color: C.green, fontSize: 10, marginBottom: 8, textTransform: "uppercase" }}>{t('ETAPA INVOICE')}</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1.2fr", gap: 10 }}>
            <Field label={t('Status Invoice')}>
              <select value={form.invoiceStatus} onChange={handleInvoiceStatusChange} style={{ background: C.panel, color: C.text, border: `1px solid ${C.border2}`, borderRadius: 5, padding: "8px", fontSize: 11, outline: "none" }}>
                <option value="SIM">{t('SIM (ATUALIZADO)')}</option>
                <option value="PENDENTE">{t('NÃO / PENDENTE')}</option>
                <option value="ENTREGUE">{t('ENTREGUE')}</option>
              </select>
            </Field>
            <Field label={t('Data Atualização Invoice')}><Input type="date" value={form.invoiceDate} onChange={set("invoiceDate")} /></Field>
            <Field label={t('Técnico Invoice')}><Input placeholder={t('Nome do técnico...')} value={form.invoiceTech} onChange={set("invoiceTech")} /></Field>
          </div>
        </div>

        <div style={{ background: C.panel2, border: `1px solid ${C.border2}`, padding: 12, borderRadius: 6, marginBottom: 16 }}>
            <div style={{ fontWeight: 700, color: C.textDim, fontSize: 10, marginBottom: 8, textTransform: "uppercase" }}>{t('Histórico do Ciclo (Sáb - Sex)')}</div>
            <WeeklyActivityHeatmap
                asbuiltHistory={form.asbuiltHistory}
                workbookHistory={form.workbookHistory}
                invoiceHistory={form.invoiceHistory}
                onAddToday={addFormHistoryToday}
            />
        </div>

        <Field label={t('Observações / Detalhes')}><Input placeholder={t('Observações adicionais...')} value={form.note} onChange={set("note")} /></Field>

        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 20 }}>
          <button onClick={onClose} style={{ background: C.panel2, border: `1px solid ${C.border2}`, color: C.textDim, borderRadius: 5, padding: "8px 14px", fontSize: 11, cursor: "pointer" }}>{t('Cancelar')}</button>
          <button onClick={() => onSave(form)} style={{ background: C.accent, color: "#000", border: "none", borderRadius: 5, padding: "8px 16px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>{t('Salvar Produção')}</button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PasswordGate><ProductionDashboard /></PasswordGate>);
</script>
</body>
</html>
